name: Claude review

on:
  pull_request:
    branches: [main]
    # `labeled` is here because Renovate creates the pull request first and
    # adds the labels in a second call. The `opened` payload carries no label,
    # so a decision taken from that payload reviews a bump that merges itself.
    # The gate reads the labels from the API instead, so both runs reach the
    # same answer. A label added to any pull request starts a run, not only a
    # Renovate one.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# NOTE: the concurrency group sits on the `review` job, not on the workflow.
# A workflow-level group cancelled the run in flight before the gate had
# decided anything. A push that changed a runbook therefore cancelled the
# review of the manifest in the push before it, and its own gate then saw
# Markdown and skipped. The manifest reached main unreviewed, and the pull
# request showed no sign of it. A skipped push now cancels nothing, because
# the `review` job never starts and never enters the group.

jobs:
  gate:
    name: Decide whether to review
    # This job takes the whole decision, from the API and from the push. It
    # carries no `if:` on the event payload on purpose. The payload of an
    # `opened` event holds no label, because Renovate adds the labels in a
    # second call, so a condition on it says "review" for every bump that
    # merges itself. The job is cheap and the paid review is behind it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The gate reads the labels and the draft state through `gh`.
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      checklist: ${{ steps.lens.outputs.checklist }}
      what: ${{ steps.lens.outputs.what }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs `before` against the head. It needs the history
          # that holds `before`.
          fetch-depth: 0
          # The gate needs no token on disk.
          persist-credentials: false

      - name: Choose the checklist
        id: lens
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "renovate[bot]" ]; then
            echo "checklist=A" >> "$GITHUB_OUTPUT"
            echo "what=a dependency bump" >> "$GITHUB_OUTPUT"
          else
            echo "checklist=B" >> "$GITHUB_OUTPUT"
            echo "what=a change to this repository" >> "$GITHUB_OUTPUT"
          fi

      # A review cost about $0.30 on 2026-10-13, so a push that changes only
      # prose is not worth one. `paths-ignore` on a pull_request event does not do this: it
      # reads every file in the pull request, not the files in the push, so a
      # pull request that touched 1 manifest keeps paying for each later
      # documentation push. This step reads the push instead.
      #
      # NOTE: this gate does not stop a repeated push that edits a comment in
      # a YAML file. That is YAML, so it gets a review, and check B10 reads a
      # comment on purpose.
      #
      # REVIEW.md, AGENTS.md and CLAUDE.md are Markdown, and they are not
      # documentation for this test: they set the rules the review follows, so
      # a change to 1 of them gets a review.
      - name: Decide whether to review this push
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Read the labels and the draft state now, not from the payload.
          # Renovate adds the labels in a second call, so the payload of an
          # `opened` event holds none and a test on it reviews every bump
          # that merges itself.
          #
          # renovate.json5 sets `labels: [renovate, dependencies]` at the top
          # level, so every Renovate pull request ends up with at least 2
          # labels. An empty list on a Renovate pull request therefore means
          # the second call has not landed yet. Wait for it: 6 tries, 5
          # seconds apart.
          LABELS=""
          DRAFT="false"
          for attempt in 1 2 3 4 5 6; do
            STATE=$(gh pr view "$PR" --json labels,isDraft)
            LABELS=$(jq -r '[.labels[].name] | join(" ")' <<< "$STATE")
            DRAFT=$(jq -r '.isDraft' <<< "$STATE")
            if [ -n "$LABELS" ] || [ "$AUTHOR" != "renovate[bot]" ]; then
              break
            fi
            echo "No label yet on a Renovate pull request. Try ${attempt} of 6."
            sleep 5
          done
          echo "author=${AUTHOR} draft=${DRAFT} labels=[${LABELS}]"

          has_label() {
            # A herestring, not a pipe. Under pipefail a `grep -q` that exits
            # early makes the writer take SIGPIPE, and the test then reads as
            # false.
            grep -qw -- "$1" <<< "$LABELS"
          }

          if [ "$DRAFT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: the pull request is a draft."
            exit 0
          fi

          # The label is the test, not the update type. renovate.json5 puts
          # `automerge` on exactly the 2 rules that set automerge, so a bump
          # without it waits for a person and gets a review. A grouped pull
          # request unions the labels of its members, so one labelled
          # `automerge` together with `helm`, `major` or `manual-apply` holds
          # a bump that a person applies, and it gets a review too.
          # See REVIEW.md.
          if [ "$AUTHOR" = "renovate[bot]" ] && has_label automerge \
             && ! has_label helm && ! has_label major \
             && ! has_label manual-apply; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: the bump merges itself, so a review has no reader."
            exit 0
          fi

          # A Renovate rebase force-pushes, so the `before` commit can be gone.
          # Read the whole pull request when it is not there.
          if [ "$ACTION" = "synchronize" ] && [ -n "${BEFORE:-}" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE} ${HEAD_SHA}"
            SCOPE="this push"
          else
            RANGE="${BASE_SHA} ${HEAD_SHA}"
            SCOPE="the whole pull request"
          fi

          # --no-renames is required. With rename detection, git lists the
          # new path of a rename only. A push that moves
          # manifests/x/pvc.yaml to docs/x.md then looks like Markdown, the
          # review skips, and ArgoCD still prunes the PersistentVolumeClaim
          # on merge. --no-renames lists the delete and the add, so the
          # manifest path is in the list and the review runs.
          CHANGED=$(git diff --name-only --no-renames $RANGE)
          echo "Files changed in ${SCOPE}:"
          echo "$CHANGED" | sed 's/^/  /'

          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No file changed. Skipping the review."
            exit 0
          fi

          if grep -qvE '\.md$' <<< "$CHANGED"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Reviewing: a file that is not Markdown changed."
          elif grep -qE '^(REVIEW|AGENTS|CLAUDE)\.md$' <<< "$CHANGED"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Reviewing: a file that sets the rules of the review changed."
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: ${SCOPE} changes Markdown only."
          fi

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    # Renovate rebases a branch whenever main moves. A person pushes to a
    # branch while they work on it. Each push sends a new `synchronize` event.
    # Without this, GitHub reviews the same pull request once per push, and
    # bills each review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The review diffs the head against the merge base. It needs the
          # full history. A shallow clone has no merge base.
          fetch-depth: 0
          # Checkout writes GITHUB_TOKEN into .git/config by default. The
          # review reads third-party release notes, so an instruction inside
          # one can reach a token that writes to pull requests. The post step
          # takes the token from GH_TOKEN, so nothing needs it on disk. The
          # review tools refuse to read .git, and this keeps the token out of
          # it as well.
          persist-credentials: false

      # Check A2 needs the new chart's own values.yaml, to find a key that
      # apps/values.yaml still sets and the chart no longer reads. The
      # `helm_show_values` tool in review.py runs `helm show values` for it.
      # The script offers no `helm template` tool: that subcommand takes
      # --post-renderer, which runs any program on the runner.
      - name: Setup Helm
        uses: azure/setup-helm@v5

      # A review runs on the Messages API, through .github/scripts/review.py.
      # It does not run Claude Code.
      #
      # The reason is the bill. The monthly API credit on a Max plan covers the
      # Claude API. It does not cover Claude Code, and the Claude Agent SDK is
      # Claude Code packaged as a library, so neither draws on that credit. On
      # 2026-10-13 the purchased balance ran out and every review failed at
      # $0 cost, on 3 unrelated pull requests, with the credit untouched.
      # NOTE: the version is an env var because that is the only shape the
      # custom manager in renovate.json5 matches. It reads
      # `[A-Z_]+_VERSION: <value>` on the line after the comment. A
      # `pip install anthropic==1.13.0` line matches nothing, so the pin
      # looked tracked and no bump would ever have opened.
      - name: Install the Anthropic SDK
        env:
          # renovate: datasource=pypi depName=anthropic
          ANTHROPIC_VERSION: 2.2.0
        run: pip install "anthropic==${ANTHROPIC_VERSION}"

      # The tool list in review.py is the whole boundary. The review reads
      # third-party release notes, so an instruction inside one can reach any
      # tool. 3 properties hold it:
      #
      # 1. There is no shell. The old job allowed `Bash(git diff:*)`, and a
      #    write to .git/config plus that rule ran a program through
      #    `diff.external`. The script offers 6 typed functions instead, and
      #    every git call clears `diff.external`.
      # 2. Each file resolves inside the repository or the tool refuses it.
      #    /proc/self/environ holds ANTHROPIC_API_KEY, and the old job denied
      #    that path by rule. Containment denies it because it is not in the
      #    tree. `.git` and `*.enc.yaml` are denied by name.
      #
      #    WARNING: the test runs on each file that a tool returns, not on the
      #    argument alone. A review of this job caught the opposite: a glob of
      #    `../../../proc/self/environ` walked out of the tree and returned
      #    the key, because only the `path` argument was checked.
      # 3. A release note is fetched on Anthropic's servers, not here. The
      #    old job fetched it from the runner, which holds the API key.
      #    `web_fetch` reads a URL that is already in the conversation.
      #
      #    `helm_show_values` is the 1 tool that still fetches from the
      #    runner, because `helm show values --repo <url>` runs here. The
      #    model picks that URL, so it is limited to the `sourceRepos` list
      #    in bootstrap/argocd-project.yaml: the chart repositories the
      #    cluster already uses, and no other host.
      #
      # .github/scripts/test_review.py states each refusal. The `Review tools`
      # check in validate.yaml runs it on every pull request.
      - name: Review the pull request
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHECKLIST: ${{ needs.gate.outputs.checklist }}
          WHAT: ${{ needs.gate.outputs.what }}
          # Checks A7 and B9 confirm that the body holds the apply command for
          # a change under bootstrap/. Renovate writes it there through
          # prBodyNotes, so it is in no diff and no tool can reach it.
          #
          # WARNING: keep this in `env:`. The body is third-party text, and an
          # expression inside `run:` becomes shell before bash reads the line.
          # review.py fences it as data for the model.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/review.py

      - name: Post the review
        # Not always(): the concurrency group cancels the run in flight on each
        # new push. always() then reports "No review was written" for a run that
        # GitHub stopped on purpose. A skipped push does not reach this job.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          CHECKLIST: ${{ needs.gate.outputs.checklist }}
        run: |
          set -euo pipefail

          if [ ! -s claude-review.md ]; then
            echo "No review was written. Read the previous step's log."
            exit 1
          fi

          BLOB="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.base.ref }}"
          REVIEW_URL="${BLOB}/REVIEW.md"
          SCRIPT_URL="${BLOB}/.github/scripts/review.py"

          {
            cat claude-review.md
            echo
            echo "---"
            echo "_Checklist ${CHECKLIST} of [\`REVIEW.md\`](${REVIEW_URL}). Advice, not a gate. A person merges._"
            echo
            echo "_Written by Claude on the Claude API, by [\`review.py\`](${SCRIPT_URL})._"
          } > comment.md

          # --edit-last keeps one comment per pull request instead of one per
          # push. It edits the last comment by github-actions[bot], whichever
          # workflow wrote it, and this is the only workflow here that
          # comments. A second one would have its comment overwritten.
          # The fallback covers a runner with an older gh.
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file comment.md
