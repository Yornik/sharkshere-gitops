name: Review Renovate PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Renovate rebases a branch whenever main moves. Each rebase is a new
# `synchronize` event, so without this the same bump is reviewed — and paid
# for — once per rebase.
concurrency:
  group: renovate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Only the bumps that renovate.json5 refuses to automerge. The `patch
    # updates` group and docker minor bumps merge themselves, so a review of
    # those has no reader. See REVIEW.md for the two classes.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && (contains(github.event.pull_request.labels.*.name, 'helm')
      || contains(github.event.pull_request.labels.*.name, 'major')
      || contains(github.event.pull_request.labels.*.name, 'manual-apply'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The review diffs the head against the merge base, so the full
          # history is needed. A shallow clone has no merge base.
          fetch-depth: 0

      # `helm show values` is how the review gets the new chart's own
      # values.yaml, to find a key that apps/values.yaml still sets but the
      # chart no longer reads.
      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Review the bump
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this the action rejects the run: it refuses a bot actor
          # unless the bot is listed, which keeps bots out of trigger loops.
          allowed_bots: 'renovate[bot]'
          # Authenticate as this repository, not as the Claude GitHub App, so
          # the job needs no app installation. The job only reads.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }}. It is a Renovate dependency bump.

            Read REVIEW.md and follow it. It is the checklist and it
            defines the three verdicts.

            The diff is `git diff ${{ github.event.pull_request.base.sha }}...HEAD`.

            apps/values.yaml is long. Read only the Application that the diff
            touches. Use grep and sed to find it, not a full read.

            Write the review to claude-review.md in the repository root, as
            GitHub Markdown. Start it with the verdict on its own line. Keep
            it under 40 lines: the reader wants the decision and the evidence
            for it, not a summary of the diff.

            Write no other file. Do not commit. Do not push. Do not comment.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,WebFetch,Write,Bash(git diff:*),Bash(git log:*),Bash(helm show:*),Bash(helm template:*)"

      - name: Post the review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ ! -s claude-review.md ]; then
            echo "No review was written. Read the previous step's log."
            exit 1
          fi

          {
            cat claude-review.md
            echo
            echo "---"
            echo "_Advice, not a gate. See [\`REVIEW.md\`](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.base.ref }}/REVIEW.md). A person merges._"
            echo
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > comment.md

          # --edit-last keeps one comment per pull request instead of one per
          # rebase. The fallback covers a runner with an older gh.
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file comment.md
