apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: backup-prune-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # Secret/backup-prune-s3: S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY.
  #
  # The project-wide Hetzner Object Storage key, the same one openproject's
  # secret-s3-attachments.enc.yaml holds; rotate them together. A Hetzner S3
  # key is valid for every bucket in its project and in every location, which
  # is why one key reaches both the nbg1 bucket and the fsn1 one - and why this
  # job's KEY_REGEX and bucket name are the only things standing between it and
  # everything else in the project. Read them twice before changing them.
  - ./secret.enc.yaml
