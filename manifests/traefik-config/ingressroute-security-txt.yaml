apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: security-txt
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Path(`/.well-known/security.txt`) || Path(`/.well-known/pgp-key.txt`)
      kind: Rule
      priority: 9999
      middlewares:
        - name: security-txt-content-type
          namespace: traefik
      services:
        - name: security-txt
          port: 80
  tls:
    certResolver: letsencrypt
