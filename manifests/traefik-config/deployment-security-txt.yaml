apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-txt
  namespace: traefik
  labels:
    app: security-txt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-txt
  template:
    metadata:
      labels:
        app: security-txt
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: security-txt
              mountPath: /usr/share/nginx/html/.well-known/
              readOnly: true
          resources:
            # No cpu limit by design - see fedishark/deployment.yaml for the full
            # reasoning. This was the worst offender: 86% of CFS periods throttled
            # at 0% quota used. CPU is compressible and the request guarantees the
            # share under contention; the memory limit stays.
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: security-txt
          configMap:
            name: security-txt
