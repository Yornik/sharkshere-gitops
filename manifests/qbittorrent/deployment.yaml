apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: jellyfin
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
        - name: patch-config
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              CONF=/config/qBittorrent/qBittorrent.conf
              if [ ! -f "$CONF" ]; then
                echo "Config not found yet, skipping patch"
                exit 0
              fi
              if ! grep -q "ReverseProxySupportEnabled" "$CONF"; then
                sed -i "s/WebUI\\\\Username=/WebUI\\\\ReverseProxySupportEnabled=true\nWebUI\\\\TrustedReverseProxiesList=10.244.0.0\/16\nWebUI\\\\Username=/" "$CONF"
                echo "Patched reverse proxy settings into qBittorrent config"
              else
                echo "Reverse proxy settings already present, skipping"
              fi
              # Disable CSRF — Origin: null on file upload/form submit breaks it behind reverse proxy
              if ! grep -q "CSRFProtection" "$CONF"; then
                sed -i "s/WebUI\\\\Username=/WebUI\\\\CSRFProtection=false\nWebUI\\\\Username=/" "$CONF"
                echo "Disabled CSRF protection"
              fi
              # Set default save path to /media/movies
              sed -i "s|Downloads\\\\SavePath=.*|Downloads\\\\SavePath=/media/movies/|" "$CONF"
              sed -i "s|Session\\\\DefaultSavePath=.*|Session\\\\DefaultSavePath=/media/movies/|" "$CONF"
              echo "Set default download path to /media/movies"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.1
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
            privileged: false
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-vpn-secrets
                  key: wireguard-private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-vpn-secrets
                  key: wireguard-addresses
            - name: SERVER_COUNTRIES
              value: Netherlands
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.0.0.0/8,192.168.0.0/16
            - name: FIREWALL_VPN_INPUT_PORTS
              value: "6881"
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - containerPort: 8080
              name: webui
            - containerPort: 6881
              name: bittorrent
            - containerPort: 6881
              protocol: UDP
              name: bittorrent-udp
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          # Gluetun's internal health server binds 127.0.0.1:9999 (HTTP 200 when the
          # tunnel is healthy), so kubelet can't reach it over the pod IP — use an
          # exec probe inside the container (wget is present in the alpine image).
          # Generous initialDelay: VPN establishment can take 30-60s. period 30s x
          # failureThreshold 5 = ~2.5 min of tunnel-down before restart, so brief
          # VPN blips (which gluetun heals itself) don't kill the pod.
          livenessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:9999"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.1.4-r2-ls440
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
            - name: WEBUI_PORT
              value: "8080"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /media/movies
            - name: series
              mountPath: /media/series
          # Kubelet probes hit the pod IP; gluetun's firewall accepts anything on
          # eth0 destined to the local pod subnet (iptables: -d 10.244.0.0/24 -i
          # eth0 ACCEPT — verified on the live pod), so no FIREWALL_INPUT_PORTS
          # entry is needed. GET / returns 200 unauthenticated (login page), also
          # verified against the pod IP, so httpGet is reliable here.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Restart on hung WebUI: 3 x 30s = ~90s unresponsive before restart.
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-ssd
        - name: movies
          persistentVolumeClaim:
            claimName: qbittorrent-movies-rw
        - name: series
          persistentVolumeClaim:
            claimName: qbittorrent-series-rw
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
