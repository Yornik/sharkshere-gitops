apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: jellyfin
  labels:
    app: qbittorrent
# No external-dns annotation. The UI is on the tailnet only, through
# ingress-tailnet.yaml. ExternalDNS runs with --policy=upsert-only, so an
# annotation here would recreate a public record that was deleted by hand.
spec:
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: webui
      protocol: TCP
    - name: bittorrent
      port: 6881
      targetPort: bittorrent
      protocol: TCP
    - name: bittorrent-udp
      port: 6881
      targetPort: bittorrent-udp
      protocol: UDP
