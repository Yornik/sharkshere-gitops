apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: jellyfin
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`qbittorrent.fedishark.eu`)
      kind: Rule
      middlewares:
        # Traefik runs this list in order. basicAuth ends the chain on a
        # rejection, so every middleware after it is skipped for a failed
        # login. qbittorrent-auth stays last: a 401 must still pass through
        # fail2ban and rate-limit, and must still get the response headers.
        # See docs/incidents/2026-09-29-qbittorrent-middleware-order.md
        - name: security-headers
          namespace: traefik
        - name: fail2ban
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: no-compression
          namespace: traefik
        - name: qbittorrent-auth
          namespace: jellyfin
      services:
        - name: qbittorrent
          port: 8080
  tls:
    certResolver: letsencrypt
