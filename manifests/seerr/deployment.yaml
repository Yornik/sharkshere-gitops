apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: jellyfin
  labels:
    app: seerr
spec:
  replicas: 1
  # The config volume is RWO and holds a SQLite database. A second pod
  # must not start while the first pod still has the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      # Seerr documents `init: true` for Docker. Kubernetes has no such flag.
      # A shared process namespace makes the pause container PID 1, and it
      # reaps zombie processes.
      shareProcessNamespace: true
      securityContext:
        # The image runs as the `node` user, UID 1000. The config volume
        # must belong to that user.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5055
              name: http
          env:
            - name: TZ
              value: Europe/Amsterdam
            - name: LOG_LEVEL
              value: info
            # The database is on shared-pg (manifests/shared-pg/databases.yaml),
            # not in SQLite in /app/config/db, the same as Sonarr, Radarr and
            # Prowlarr. The connection is encrypted but the server certificate
            # is not checked, the same as the Servarr apps.
            #
            # NOTE: The old db.sqlite3 stays in /app/config/db as a fallback.
            # Remove these variables to go back to it.
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              value: shared-pg-rw.shared-pg.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: seerr
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: seerr-postgres
                  key: DB_PASS
            - name: DB_NAME
              value: seerr
            - name: DB_USE_SSL
              value: "true"
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /app/config
          # Needs no login.
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config-ssd
