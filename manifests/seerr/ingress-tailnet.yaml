apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr-tailnet
  namespace: jellyfin
  annotations:
    # The proxy serves port 443 only. Without the redirect, an http://
    # address times out instead of reaching the HTTPS one.
    tailscale.com/http-redirect: "true"
spec:
  # The Tailscale operator runs 1 proxy device for this Ingress. The proxy
  # ends TLS with a certificate for the ts.net name and sends plain HTTP to
  # Seerr. There is no public route.
  #
  # NOTE: Tailnet traffic does not pass through Traefik. The Seerr login
  # (Jellyfin sign-in) is the gate. The first visitor to a new Seerr
  # completes the setup wizard, so finish it before you share the address.
  # See docs/runbooks/seerr-sonarr.md.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: seerr
      port:
        number: 5055
  tls:
    # The first label is the device name: requests.hedgehog-wage.ts.net.
    - hosts:
        - requests
