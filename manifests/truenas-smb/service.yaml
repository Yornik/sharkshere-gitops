apiVersion: v1
kind: Service
metadata:
  name: truenas-smb
  namespace: truenas-smb
  labels:
    app: truenas-smb
  annotations:
    # The Tailscale operator runs 1 proxy device for this Service, at
    # nas-smb.hedgehog-wage.ts.net. Same pattern as manifests/gitlab/
    # service-ssh.yaml. The name is not "nas": that device belongs to the
    # Ingress of the web interface, and 1 proxy cannot be both.
    #
    # NOTE: The proxy sends every port of its tailnet address to the
    # ClusterIP of this Service. Declare port 445 and no other port here.
    # A second port would also be open to the tailnet.
    #
    # NOTE: The proxy has a tag of its own, not the default tag:k8s of
    # gitlab-shell. A rule of the tailnet policy for tag:k8s then does not
    # cover the SMB login of the NAS, and the path stays closed until a rule
    # names tag:nas-smb. The tag must be in tagOwners first. If it is not, the
    # operator cannot create the proxy, and no device appears.
    #
    # The operator sets the tags only when it creates a proxy. A proxy that
    # exists keeps its tags. See docs/runbooks/truenas-smb.md.
    tailscale.com/expose: "true"
    tailscale.com/hostname: nas-smb
    tailscale.com/tags: "tag:nas-smb"
spec:
  type: ClusterIP
  selector:
    app: truenas-smb
  ports:
    - name: smb
      port: 445
      targetPort: smb
      protocol: TCP
