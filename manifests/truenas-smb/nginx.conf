# TCP relay for the SMB service of the NAS. It does not read the traffic.
# Signing, encryption and the login run from the client to the NAS. See
# docs/runbooks/truenas-smb.md.
pid /tmp/nginx.pid;
# The word stderr uses the open descriptor. A path such as /dev/stderr is
# opened again, and a non-root user can fail to open it.
error_log stderr notice;

worker_processes 1;

events {
  # A relayed connection uses 2. Any pod, and any tailnet device that the
  # policy allows, can open idle connections without a password. 128 let
  # about 62 of them use the whole table in a test.
  worker_connections 1024;
}

stream {
  server {
    # Not 445: the pod runs as non-root and cannot bind a port below 1024.
    #
    # so_keepalive makes the kernel probe the client. After 10 minutes of
    # silence it sends up to 6 probes, 30 seconds apart, and then closes the
    # connection. Without it a client that vanishes keeps its connection, and
    # on the NAS its session, for the whole proxy_timeout.
    listen 8445 so_keepalive=10m:30s:6;
    # The NAS. The SMB volumes in manifests/jellyfin and manifests/qbittorrent
    # use the same address. A literal address needs no DNS, so the relay does
    # not depend on a resolver on the home network. A change to this line
    # changes the name of the generated ConfigMap, and the pod restarts.
    proxy_pass 192.168.1.42:445;
    # A NAS that is off makes the connection fail after 5 seconds, not 60.
    proxy_connect_timeout 5s;
    # The default closes a connection after 10 minutes without traffic. A
    # connection with an open file can stay silent for hours, and a relay
    # that cuts it breaks that file. 7 days is the value of manifests/
    # truenas-ui. No source names an SMB limit, so the value is a choice,
    # not a measurement.
    proxy_timeout 7d;
    # The same probes on the leg to the NAS. This directive covers that leg
    # only. The client leg has the so_keepalive on the listen line.
    proxy_socket_keepalive on;
  }

  # The kubelet probes this port, not 8445. A probe on 8445 would open a
  # connection to the NAS every 10 seconds.
  server {
    listen 8081;
    return "ok\n";
  }
}
