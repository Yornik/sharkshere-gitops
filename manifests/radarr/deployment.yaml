apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: jellyfin
  labels:
    app: radarr
spec:
  replicas: 1
  # The config volume is RWO and holds a SQLite database. A second pod
  # must not start while the first pod still has the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      initContainers:
        - name: create-downloads-dir
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              # qBittorrent saves the `movies` category here. The `.ignore` file
              # keeps Jellyfin from scanning half-finished downloads as
              # part of the film library.
              mkdir -p /media/movies/downloads
              touch /media/movies/downloads/.ignore
          volumeMounts:
            - name: movies
              mountPath: /media/movies
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.4.4.10685-ls324
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
            # Radarr skips the login for local addresses by default. The
            # Tailscale proxy connects from a pod address, which counts as
            # local, so the default would leave Radarr open to the whole
            # tailnet. `Enabled` asks for the login on every address.
            #
            # CAUTION: Do not set RADARR__AUTH__METHOD. The UI shows the
            # dialog that creates the first user only while the method is
            # `None`. A forced `Forms` on a new volume has no user, so every
            # login fails.
            - name: RADARR__AUTH__REQUIRED
              value: Enabled
          ports:
            - containerPort: 7878
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            # Same path as in the qBittorrent pod. A download needs no
            # remote path mapping. SMB has no hardlinks, so the import copies
            # a download that still seeds.
            - name: movies
              mountPath: /media/movies
          # /ping needs no login.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config-ssd
        # Owned by the qbittorrent Application. Both pods mount the same
        # SMB share, which is ReadWriteMany.
        - name: movies
          persistentVolumeClaim:
            claimName: qbittorrent-movies-rw
