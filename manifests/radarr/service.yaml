apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: jellyfin
  labels:
    app: radarr
# No external-dns annotation. Radarr is on the tailnet only, through
# ingress-tailnet.yaml. Seerr reaches it in the cluster at http://radarr:7878.
spec:
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: http
      protocol: TCP
