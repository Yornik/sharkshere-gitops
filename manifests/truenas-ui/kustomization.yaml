apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: truenas-ui
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress-tailnet.yaml
# The relay configuration is a real file, so that an editor and nginx -t can
# read it. The generated name carries a hash of the contents, so a changed
# file is a changed Deployment and the pod restarts without anybody running
# kubectl rollout restart.
configMapGenerator:
  - name: truenas-ui-nginx
    files:
      - nginx.conf
