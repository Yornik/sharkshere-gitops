apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truenas-ui-tailnet
  namespace: truenas-ui
  annotations:
    # The proxy serves port 443 only. Without the redirect, an http://
    # address times out instead of reaching the HTTPS one.
    tailscale.com/http-redirect: "true"
spec:
  # The Tailscale operator runs 1 proxy device for this Ingress. The proxy
  # ends TLS with a certificate for the ts.net name, then opens TLS to the
  # relay and on to the NAS. There is no public route. The TrueNAS login is
  # the gate, because tailnet traffic does not pass through Traefik.
  # See docs/runbooks/truenas-ui.md.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: truenas-ui
      port:
        number: 443
  tls:
    # The first label is the device name: nas.hedgehog-wage.ts.net.
    # The operator ignores tailscale.com/hostname on an Ingress.
    - hosts:
        - nas
