    <body>
      <main class="shell">
        <section class="hero">
          <p class="eyebrow">Cloud Reliability Engineering • Kubernetes • GitOps</p>
          <h1>Yornik Heyl</h1>
          <p class="role">Cloud Reliability Engineer at Mendix, a Siemens business</p>
          <p class="lede">
            I design and operate reliable cloud platforms with production-first engineering standards: measurable SLOs,
            resilient service architecture, strict automation, and fast recovery under pressure.
          </p>
          <p class="ai-note">
            Strong focus on AI and agent-driven workflows to improve engineering efficiency, reduce human error,
            strengthen security posture, and increase delivery output.
          </p>
          <div class="links">
            <a class="btn primary" href="https://github.com/Yornik">GitHub</a>
            <a class="btn" href="https://www.linkedin.com/in/yornik/">LinkedIn</a>
          </div>
        </section>

        <section class="stats">
          <article>
            <h2>Reliability Mindset</h2>
            <p>Change is safe only when rollback is boring. I optimize for clarity, observability, and repeatability.</p>
          </article>
          <article>
            <h2>Platform Scope</h2>
            <p>Talos + Kubernetes stack with GitOps, ingress hardening, identity, logs, metrics, and DNS automation.</p>
          </article>
          <article>
            <h2>Execution Style</h2>
            <p>Pragmatic, incident-driven iteration: reduce toil, ship safer defaults, and keep systems explainable.</p>
          </article>
        </section>

        <section class="showcase">
          <h2>What I Deliver</h2>
          <div class="grid">
            <article class="panel">
              <h3>Cloud Reliability Engineering</h3>
              <p>
                Incident response, preventive hardening, and operational standards that keep services stable while
                product velocity stays high.
              </p>
            </article>
            <article class="panel">
              <h3>GitOps-Native Operations</h3>
              <p>
                Declarative infrastructure and applications with auditable changes, reproducible rollouts,
                and clean ownership boundaries.
              </p>
            </article>
            <article class="panel">
              <h3>Observability that Drives Action</h3>
              <p>
                Logs, metrics, and traces shaped into practical signal. Alerting tuned for response quality,
                not alert noise.
              </p>
            </article>
          </div>
        </section>

        <section class="impact">
          <h2>Impact and Working Model</h2>
          <div class="impact-grid">
            <article class="impact-panel">
              <h3>Reliability Outcomes</h3>
              <p>
                Build systems that are understandable during incidents, recover quickly, and keep customer-facing
                services stable through controlled change.
              </p>
            </article>
            <article class="impact-panel">
              <h3>AI-Assisted Engineering</h3>
              <p>
                Use AI agents to improve implementation speed, reduce repetitive mistakes, and enforce safer
                operational defaults without sacrificing engineering quality.
              </p>
            </article>
            <article class="impact-panel">
              <h3>Security by Default</h3>
              <p>
                Integrate security controls into platform workflows early, so hardening is continuous and does not
                depend on manual one-off actions.
              </p>
            </article>
          </div>
        </section>

        <section class="stack">
          <h2>Current Focus</h2>
          <div class="chips">
            <span class="chip">Kubernetes</span>
            <span class="chip">Talos Linux</span>
            <span class="chip">Argo CD</span>
            <span class="chip">Traefik</span>
            <span class="chip">Grafana + Loki + Alloy</span>
            <span class="chip">ExternalDNS + deSEC</span>
            <span class="chip">Security Hardening</span>
            <span class="chip">Media + Stateful Workloads</span>
          </div>
          <p class="footer">
            Based in the Rotterdam area, Netherlands. Open to impactful Cloud/Platform/Reliability engineering conversations.
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 36" width="20" height="12" role="img" aria-label="Pride flag" style="display:inline-block; vertical-align:middle; margin-left:0.3em; border-radius:2px;"><rect fill="#E40303" width="60" height="6"/><rect fill="#FF8C00" y="6" width="60" height="6"/><rect fill="#FFED00" y="12" width="60" height="6"/><rect fill="#008026" y="18" width="60" height="6"/><rect fill="#004DFF" y="24" width="60" height="6"/><rect fill="#750787" y="30" width="60" height="6"/></svg>
          </p>
          <p class="trust">
            Certifications: <a href="https://www.credly.com/users/yornik-heyl">Credly</a>. Security posture:
            100% website score on <a href="https://internet.nl">Internet.nl</a>, aligned with Dutch NCSC guidance.
          </p>
          <p class="contact">
            Contact: <a href="mailto:yornik@yornik.nl">yornik@yornik.nl</a>
          </p>
        </section>
      </main>
    </body>
    </html>

  styles.css: |
    :root {
      --bg: #0b1117;
      --bg-2: #132233;
      --card: rgba(10, 18, 28, 0.74);
      --line: rgba(143, 179, 210, 0.26);
      --text: #ecf3fb;
      --muted: #b5c5d8;
      --accent: #ff6b2c;
      --accent-2: #50d7ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #0b1117;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(860px 460px at -5% 0%, rgba(255, 107, 44, 0.24), transparent 65%),
        radial-gradient(1000px 600px at 110% -10%, rgba(80, 215, 255, 0.24), transparent 62%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
      font-family: "Manrope", "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .shell {
      width: min(1080px, 100% - 2rem);
      margin: 0 auto;
      padding: 2.4rem 0 3.5rem;
      display: grid;
      gap: 1rem;
    }

    .hero,
    .stats,
    .showcase,
    .impact,
    .stack {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      backdrop-filter: blur(5px);
      box-shadow: 0 20px 48px rgba(2, 7, 13, 0.35);
    }

    .hero {
      padding: 2rem;
      animation: fade-up 0.55s ease-out;
    }

    .eyebrow {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.77rem;
      color: var(--accent-2);
      font-weight: 700;
    }

    h1 {
      margin: 0.35rem 0 0;
      font-size: clamp(2rem, 5vw, 3.55rem);
      line-height: 1.03;
      letter-spacing: -0.03em;
    }

    .role {
      margin: 0.3rem 0 0;
      color: var(--accent);
      font-weight: 700;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .lede {
      margin: 0.8rem 0 0;
      max-width: 780px;
      color: var(--muted);
      font-size: clamp(1rem, 1.9vw, 1.16rem);
    }

    .ai-note {
      margin: 0.65rem 0 0;
      max-width: 780px;
      color: #d4e3f3;
      font-size: 0.98rem;
      border-left: 3px solid rgba(255, 107, 44, 0.75);
      padding-left: 0.7rem;
    }

    .links {
      margin-top: 1.1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .btn {
      text-decoration: none;
      color: var(--text);
      padding: 0.62rem 0.9rem;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(7, 14, 23, 0.66);
      font-weight: 600;
      transition: 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: rgba(80, 215, 255, 0.75);
    }

    .btn.primary {
      background: linear-gradient(120deg, rgba(255, 107, 44, 0.24), rgba(80, 215, 255, 0.2));
      border-color: rgba(255, 107, 44, 0.65);
    }

    .stats {
      padding: 1.2rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      animation: fade-up 0.68s ease-out;
    }

    .stats article {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      background: rgba(8, 15, 24, 0.68);
    }

    .stats h2 {
      margin: 0;
      font-size: 1rem;
    }

    .stats p {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .showcase {
      padding: 1.5rem;
      animation: fade-up 0.82s ease-out;
    }

    .showcase h2,
    .impact h2,
    .stack h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .grid {
      margin-top: 0.85rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      background: rgba(8, 15, 24, 0.68);
      min-height: 165px;
    }

    .panel h3 {
      margin: 0;
      font-size: 1rem;
    }

    .panel p {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .impact {
      padding: 1.4rem;
      animation: fade-up 0.9s ease-out;
    }

    .impact-grid {
      margin-top: 0.72rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .impact-panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      background: rgba(8, 15, 24, 0.68);
      min-height: 170px;
    }

    .impact-panel h3 {
      margin: 0;
      font-size: 1rem;
    }

    .impact-panel p {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stack {
      padding: 1.4rem;
      animation: fade-up 0.95s ease-out;
    }

    .chips {
      margin-top: 0.72rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.42rem 0.72rem;
      font-size: 0.85rem;
      background: rgba(80, 215, 255, 0.09);
    }

    .footer {
      margin: 0.9rem 0 0;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .trust {
      margin: 0.45rem 0 0;
      font-size: 0.93rem;
      color: var(--text);
    }

    .trust a {
      color: var(--accent-2);
      text-decoration: none;
    }

    .trust a:hover {
      text-decoration: underline;
    }

    .contact {
      margin: 0.45rem 0 0;
      font-size: 0.93rem;
      color: var(--text);
    }

    .contact a {
      color: var(--accent-2);
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .stats,
      .grid,
      .impact-grid {
        grid-template-columns: 1fr;
      }

      .hero,
      .showcase,
      .impact,
      .stack {
        padding: 1.2rem;
      }
    }

