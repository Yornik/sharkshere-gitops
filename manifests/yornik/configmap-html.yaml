      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "name": "Yornik Heyl - Cloud Reliability Engineer",
        "url": "https://yornik.eu/",
        "mainEntity": {
          "@type": "Person",
          "name": "Yornik Heyl"
        }
      }
      </script>
      <link rel="stylesheet" href="/styles.css" />
