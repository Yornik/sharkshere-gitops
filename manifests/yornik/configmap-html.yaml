apiVersion: v1
kind: ConfigMap
metadata:
  name: yornik-html
  namespace: yornik
# No og:image or apple-touch-icon: scrapers ignore SVG and ConfigMap keys are text,
# so a preview card needs a PNG served from outside this ConfigMap.
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Yornik Heyl – Cloud Reliability Engineer, Rotterdam</title>
      <meta name="author" content="Yornik Heyl" />
      <meta name="description"
            content="Cloud Reliability &amp; Platform Engineer in Rotterdam. Incident response, GitOps and observability for production at Mendix (Siemens). Open to conversations." />
      <meta name="theme-color" content="#0a0e15" media="(prefers-color-scheme: dark)" />
      <meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="canonical" href="https://yornik.eu/" />
      <meta property="og:type" content="profile" />
      <meta property="og:url" content="https://yornik.eu/" />
      <meta property="og:title" content="Yornik Heyl – Cloud Reliability Engineer" />
      <meta property="og:description"
            content="Cloud Reliability &amp; Platform Engineer in Rotterdam. Incident response, GitOps and observability for production at Mendix (Siemens). Open to conversations." />
      <meta property="og:site_name" content="Yornik Heyl" />
      <meta property="og:locale" content="en_GB" />
      <meta property="profile:first_name" content="Yornik" />
      <meta property="profile:last_name" content="Heyl" />
      <meta name="twitter:card" content="summary" />
      <meta name="twitter:title" content="Yornik Heyl – Cloud Reliability Engineer" />
      <meta name="twitter:description"
            content="Cloud Reliability &amp; Platform Engineer in Rotterdam. Incident response, GitOps and observability for production at Mendix (Siemens). Open to conversations." />
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://yornik.eu/#website",
            "url": "https://yornik.eu/",
            "name": "Yornik Heyl – Cloud Reliability Engineer",
            "description": "Portfolio of Yornik Heyl, Cloud Reliability & Platform Engineer in Rotterdam, Netherlands",
            "publisher": { "@id": "https://yornik.eu/#person" },
            "inLanguage": "en"
          },
          {
            "@type": "ProfilePage",
            "@id": "https://yornik.eu/#profilepage",
            "url": "https://yornik.eu/",
            "name": "Yornik Heyl – Cloud Reliability Engineer",
            "inLanguage": "en",
            "dateModified": "2026-11-14",
            "isPartOf": { "@id": "https://yornik.eu/#website" },
            "mainEntity": { "@id": "https://yornik.eu/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://yornik.eu/#person",
            "name": "Yornik Heyl",
            "url": "https://yornik.eu/",
            "email": "mailto:yornik@yornik.nl",
            "jobTitle": "Cloud Reliability Engineer",
            "description": "Cloud Reliability & Platform Engineer based in Rotterdam, Netherlands. Specializing in Kubernetes, GitOps, observability, and resilient cloud infrastructure.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Rotterdam",
              "addressRegion": "South Holland",
              "addressCountry": "NL"
            },
            "worksFor": {
              "@type": "Organization",
              "name": "Mendix",
              "url": "https://www.mendix.com",
              "parentOrganization": {
                "@type": "Organization",
                "name": "Siemens"
              }
            },
            "sameAs": [
              "https://github.com/Yornik",
              "https://www.linkedin.com/in/yornik/",
              "https://www.credly.com/users/yornik-heyl"
            ],
            "knowsAbout": [
              "Kubernetes", "Site Reliability Engineering", "Platform Engineering",
              "GitOps", "Observability", "Argo CD", "Prometheus", "Grafana", "Helm",
              "OpenTofu", "Infrastructure as Code", "Incident response"
            ],
            "knowsLanguage": [
              { "@type": "Language", "name": "English" },
              { "@type": "Language", "name": "Dutch" }
            ]
          }
        ]
      }
      </script>
      <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
      <header class="masthead">
        <div class="status-strip">
          <span class="dot" aria-hidden="true"></span>
          <span class="status-label">Online</span>
          <span class="status-meta">yornik.eu</span>
        </div>
      </header>

      <main class="page">

        <section class="hero">
          <h1>Yornik Heyl</h1>
          <p class="hero-meta">
            <span class="role">Cloud Reliability Engineer</span>
            <span class="sep" aria-hidden="true">/</span>
            <span>Rotterdam, NL</span>
            <span class="sep" aria-hidden="true">/</span>
            <span>EN &middot; NL</span>
          </p>
          <p class="hero-prose">
            Five years keeping production calm at <a href="https://www.mendix.com">Mendix</a> (Siemens).
            Incident response, rollout design, and observability that means something at 03:00.
            I build platforms that are safe to change, not just safe to leave alone.
          </p>
          <div class="hero-actions">
            <a class="cta primary" href="mailto:yornik@yornik.nl">yornik@yornik.nl</a>
            <a class="cta" href="https://github.com/Yornik">github</a>
            <a class="cta" href="https://www.linkedin.com/in/yornik/">linkedin</a>
            <a class="cta" href="https://www.credly.com/users/yornik-heyl">credly</a>
          </div>
          <p class="hero-status">
            <span class="led" aria-hidden="true"></span>
            Open to conversations about platform &amp; reliability work in the Netherlands and remote across Europe.
          </p>
        </section>

        <section aria-labelledby="h-overview">
          <header class="section-head">
            <span class="section-num" aria-hidden="true">01</span>
            <h2 id="h-overview">Overview</h2>
            <span class="section-rule" aria-hidden="true"></span>
          </header>
          <div class="metrics">
            <div class="metric">
              <span class="metric-value">5<span class="metric-unit">yr</span></span>
              <span class="metric-label">In production</span>
              <span class="metric-foot">since 2021 &middot; mendix &middot; siemens</span>
            </div>
            <div class="metric">
              <span class="metric-value">59</span>
              <span class="metric-label">Apps under GitOps</span>
              <span class="metric-foot">homelab &middot; argo cd app-of-apps</span>
            </div>
            <div class="metric">
              <span class="metric-value">4</span>
              <span class="metric-label">Talos cluster nodes</span>
              <span class="metric-foot">3 control-plane &middot; 1 worker</span>
            </div>
            <div class="metric">
              <span class="metric-value">100<span class="metric-unit">%</span></span>
              <span class="metric-label">Internet.nl score</span>
              <span class="metric-foot">tls 1.3 &middot; dane &middot; hsts preload</span>
            </div>
          </div>
        </section>

        <section aria-labelledby="h-practice">
          <header class="section-head">
            <span class="section-num" aria-hidden="true">02</span>
            <h2 id="h-practice">Practice</h2>
            <span class="section-rule" aria-hidden="true"></span>
          </header>
          <div class="prose">
            <p>
              Declarative by default: reproducible rollouts, clear ownership, and security
              built into the platform rather than bolted on. Systems should be explainable
              under pressure, not just work when everything is fine.
            </p>
            <p>
              AI tooling where it pays, automating the boring parts and catching
              mistakes early, not as a buzzword.
            </p>
          </div>
        </section>

        <section aria-labelledby="h-runbook">
          <header class="section-head">
            <span class="section-num" aria-hidden="true">03</span>
            <h2 id="h-runbook">Runbook: what I operate</h2>
            <span class="section-rule" aria-hidden="true"></span>
          </header>
          <ul class="services">
            <li>
              <span class="led" aria-hidden="true"></span>
              <span class="svc-name">talos linux</span>
              <span class="svc-version">v1.12</span>
              <span class="svc-note">4-node cluster &middot; 3 control-plane / 1 worker &middot; intel n150</span>
            </li>
            <li>
              <span class="led" aria-hidden="true"></span>
              <span class="svc-name">argo cd</span>
              <span class="svc-version">v3</span>
              <span class="svc-note">app-of-apps &middot; 59 applications &middot; sops + ksops</span>
            </li>
            <li>
              <span class="led" aria-hidden="true"></span>
              <span class="svc-name">prometheus / grafana / loki</span>
              <span class="svc-version">stable</span>
              <span class="svc-note">alloy log shipping &middot; 60-day retention &middot; custom dashboards</span>
            </li>
            <li>
              <span class="led" aria-hidden="true"></span>
              <span class="svc-name">traefik</span>
              <span class="svc-version">v3</span>
              <span class="svc-note">tls 1.3 only &middot; ecdsa p-384 &middot; hsts preload &middot; acme via let's encrypt</span>
            </li>
            <li>
              <span class="led" aria-hidden="true"></span>
              <span class="svc-name">external-dns</span>
              <span class="svc-version">v0.24</span>
              <span class="svc-note">cloudflare &middot; dane / tlsa and caa cron jobs &middot; sops-encrypted creds</span>
            </li>
            <li>
              <span class="led" aria-hidden="true"></span>
              <span class="svc-name">opentofu</span>
              <span class="svc-version">v1.10</span>
              <span class="svc-note">hetzner edge nodes &middot; haproxy ingress to tailscale &middot; iac end-to-end</span>
            </li>
          </ul>
          <p class="runbook-note">
            All declarative. Every change is a pull request. Yaml lint, <code>helm template</code>,
            <code>kubeconform</code>, per&#8209;chart values rendering and a ksops hash guard must pass in CI before merge.
          </p>
        </section>

        <section aria-labelledby="h-signals">
          <header class="section-head">
            <span class="section-num" aria-hidden="true">04</span>
            <h2 id="h-signals">Signals</h2>
            <span class="section-rule" aria-hidden="true"></span>
          </header>
          <dl class="signals-list">
            <div>
              <dt>Backups</dt>
              <dd>4 ha postgres clusters &middot; wal + base every 3 h &middot; 14-day pitr &middot; restore runbook</dd>
            </div>
            <div>
              <dt>Incidents</dt>
              <dd>24 written post-mortems in git &middot; cause, correction, prevention</dd>
            </div>
            <div>
              <dt>Dependencies</dt>
              <dd>renovate &middot; automerge on patch and minor image bumps &middot; human gate on chart and major updates</dd>
            </div>
            <div>
              <dt>Admin plane</dt>
              <dd>admin uis tailnet-only &middot; one public webhook path</dd>
            </div>
            <div>
              <dt>Email auth</dt>
              <dd>spf &middot; dkim &middot; dmarc &middot; dane / tlsa</dd>
            </div>
            <div>
              <dt>IPv6</dt>
              <dd>end-to-end</dd>
            </div>
            <div>
              <dt>Audit</dt>
              <dd>ncsc nl &mdash; "good" on every category</dd>
            </div>
          </dl>
        </section>

      </main>

      <footer class="page-foot">
        <p>yornik.eu &middot; declarative &middot; in git &middot; written by hand, with help from AI</p>
      </footer>
    </body>
    </html>

  styles.css: |
    :root {
      color-scheme: light dark;

      --bg:        #0a0e15;
      --bg-2:      #0c1119;
      --line:      #1f2735;
      --text:      #e8eef6;
      --muted:     #8a96a8;
      /* 5:1 or better on --bg; the old #525e6e failed AA for small text. */
      --dim:       #7b8798;
      --accent:    #f5b942;
      --accent-wash: rgba(245, 185, 66, 0.07);
      --status:    #4ade80;
      --status-glow: rgba(74, 222, 128, 0.4);
      --link:      #93c5fd;
      --link-line: rgba(147, 197, 253, 0.55);
      --hover:     rgba(255, 255, 255, 0.025);

      --serif: ui-serif, "New York", "Iowan Old Style", "Charter", "Cambria", "Times New Roman", serif;
      --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --mono:  ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Menlo", Consolas, monospace;

      /* type scale: label / small / body / lead */
      --fs-label: 12px;
      --fs-sm:    14px;
      --fs-body:  16px;
      --fs-lead:  clamp(19px, 1.7vw, 22px);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:        #fbf8f1;
        --bg-2:      #f3efe5;
        --line:      #ddd6c6;
        --text:      #161a22;
        --muted:     #4a5566;
        --dim:       #5f6a7a;
        --accent:    #8f5400;
        --accent-wash: rgba(143, 84, 0, 0.08);
        --status:    #15803d;
        --status-glow: rgba(21, 128, 61, 0.3);
        --link:      #1d4ed8;
        --link-line: rgba(29, 78, 216, 0.5);
        --hover:     rgba(0, 0, 0, 0.03);
      }
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--mono);
      font-size: var(--fs-sm);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background: var(--bg);
    }

    /* Underline rather than border so wrapped links stay underlined on every line. */
    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-color: var(--link-line);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color 0.16s ease, text-decoration-color 0.16s ease;
    }
    a:hover { color: var(--accent); text-decoration-color: var(--accent); }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    code { font-family: var(--mono); }

    /* ─────────────── status strip ─────────────── */

    .masthead {
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    .status-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 13px 32px;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .status-label { color: var(--text); font-weight: 500; letter-spacing: 0.02em; }
    .status-meta  { margin-left: auto; color: var(--dim); }

    .dot {
      width: 8px; height: 8px;
      border-radius: 999px;
      background: var(--status);
      position: relative;
      flex: 0 0 auto;
    }
    /* Two pulses (4.8s) then rest: WCAG 2.2.2 allows motion under 5s without a pause control. */
    .dot::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 999px;
      background: var(--status-glow);
      animation: pulse 2.4s cubic-bezier(0.2, 0.6, 0.2, 1) 2 forwards;
      pointer-events: none;
    }
    @keyframes pulse {
      0%   { transform: scale(0.6); opacity: 0.7; }
      90%  { transform: scale(2.0); opacity: 0; }
      100% { transform: scale(2.0); opacity: 0; }
    }

    /* Static status LED shared by the runbook rows and the availability line. */
    .led {
      width: 6px; height: 6px;
      border-radius: 999px;
      background: var(--status);
      box-shadow: 0 0 12px var(--status-glow);
      flex: 0 0 auto;
    }

    /* ─────────────── page shell ─────────────── */

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px 40px;
    }

    section + section { margin-top: 72px; }

    /* ─────────────── hero ─────────────── */

    .hero {
      animation: fade-up 0.6s ease-out both;
      text-align: center;
    }

    h1 {
      margin: 0 auto;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(48px, 7vw, 88px);
      line-height: 1;
      letter-spacing: -0.025em;
      color: var(--text);
      text-wrap: balance;
    }

    .hero-meta {
      margin: 22px 0 0;
      font-size: clamp(14px, 1.4vw, 16px);
      letter-spacing: 0.06em;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 10px;
    }
    .hero-meta .role { color: var(--accent); }
    .hero-meta .sep { color: var(--dim); }

    .hero-prose {
      margin: 28px auto 0;
      max-width: 52ch;
      font-family: var(--serif);
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--text);
      text-wrap: balance;
    }
    .hero-prose a { color: var(--accent); text-decoration-color: var(--accent); }

    .hero-actions {
      margin: 36px 0 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .cta {
      font-size: var(--fs-label);
      letter-spacing: 0.04em;
      text-transform: lowercase;
      text-decoration: none;
      padding: 13px 16px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
    }
    .cta:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-wash);
    }
    .cta:active { transform: translateY(1px); }
    .cta.primary {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-wash);
    }
    .cta.primary:hover {
      color: var(--bg);
      background: var(--accent);
    }

    .hero-status {
      margin: 28px auto 0;
      max-width: 60ch;
      font-family: var(--sans);
      font-size: var(--fs-sm);
      color: var(--muted);
      text-wrap: balance;
    }
    .hero-status .led { display: inline-block; margin-right: 10px; vertical-align: middle; }

    /* ─────────────── section heads ─────────────── */

    .section-head {
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: center;
      gap: 14px;
      margin: 0 0 28px;
    }
    .section-num {
      font-size: var(--fs-label);
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    .section-head h2 {
      margin: 0;
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text);
    }
    .section-rule { height: 1px; background: var(--line); }

    /* ─────────────── metrics ─────────────── */

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .metric {
      background: var(--bg);
      padding: 28px 20px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      position: relative;
    }
    .metric::before {
      content: "";
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 32px; height: 2px;
      background: var(--accent);
    }
    .metric-value {
      font-family: var(--serif);
      font-size: 56px;
      line-height: 0.95;
      color: var(--text);
      letter-spacing: -0.02em;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
    }
    .metric-unit {
      font-style: italic;
      font-size: 22px;
      color: var(--muted);
    }
    .metric-label {
      font-size: var(--fs-label);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .metric-foot {
      font-size: var(--fs-label);
      color: var(--dim);
      letter-spacing: 0.02em;
      margin-top: auto;
    }

    /* ─────────────── practice ─────────────── */

    .prose {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 48px;
      font-family: var(--sans);
      font-size: var(--fs-body);
      line-height: 1.7;
    }
    .prose p { margin: 0; max-width: 64ch; text-wrap: pretty; }

    /* ─────────────── runbook ─────────────── */

    .services {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--line);
    }
    .services li {
      display: grid;
      grid-template-columns: 14px clamp(150px, 24vw, 240px) 64px 1fr;
      align-items: baseline;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .services li:hover {
      background: var(--hover);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .services li:hover .svc-name { color: var(--accent); }
    /* Baseline alignment ignores an empty box, so pin the LED to the first text line. */
    .services .led { align-self: start; margin-top: 8px; }
    .svc-name {
      font-size: 13.5px;
      color: var(--text);
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: color 0.15s ease;
    }
    .svc-version {
      font-size: var(--fs-label);
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .svc-note {
      font-family: var(--sans);
      font-size: var(--fs-sm);
      color: var(--muted);
    }
    .runbook-note {
      margin: 22px 0 0;
      max-width: 72ch;
      font-family: var(--sans);
      font-size: var(--fs-sm);
      color: var(--muted);
    }
    .runbook-note code {
      font-size: 12.5px;
      color: var(--text);
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 3px;
    }

    /* ─────────────── signals ─────────────── */

    .signals-list {
      margin: 0;
      border-top: 1px solid var(--line);
    }
    .signals-list > div {
      display: grid;
      grid-template-columns: 200px 1fr;
      align-items: baseline;
      gap: 24px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .signals-list dt {
      font-size: var(--fs-label);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .signals-list dd {
      margin: 0;
      font-size: 12.5px;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* ─────────────── footer ─────────────── */

    .page-foot {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 32px 56px;
    }
    .page-foot p {
      margin: 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: var(--fs-label);
      color: var(--dim);
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* ─────────────── motion ─────────────── */

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Remove the animations outright; a near-zero duration would still loop them. */
    @media (prefers-reduced-motion: reduce) {
      .dot::after { animation: none; opacity: 0; }
      .hero { animation: none; }
      * { transition: none !important; }
    }

    /* ─────────────── responsive ─────────────── */

    @media (max-width: 920px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .prose { grid-template-columns: 1fr; row-gap: 1.1em; }
      .signals-list > div { grid-template-columns: 1fr; gap: 4px; }
      .services li {
        grid-template-columns: 14px 1fr auto;
        row-gap: 6px;
      }
      .svc-version { grid-column: 3; }
      .svc-note { grid-column: 2 / -1; }
    }

    @media (max-width: 640px) {
      .page { padding: 44px 22px 32px; }
      .page-foot { padding: 0 22px 40px; }
      .status-strip { padding: 12px 22px; gap: 10px; flex-wrap: wrap; }
      .status-meta { margin-left: 0; flex-basis: 100%; }
      .metric { padding: 22px 12px 20px; }
      .metric-value { font-size: 44px; }
      .metric-unit { font-size: 18px; }
      .services li { grid-template-columns: 12px auto 1fr; }
      .svc-version { grid-column: 3; justify-self: start; }
      h1 { font-size: clamp(48px, 14vw, 80px); }
    }

    /* ─────────────── print ─────────────── */

    @media print {
      :root {
        --bg: #fff; --bg-2: #fff; --line: #ccc; --text: #111; --muted: #333;
        --dim: #555; --accent: #8a5a00; --link: #111; --link-line: #999;
        --accent-wash: transparent; --hover: transparent;
      }
      html, body { background: #fff; color: #111; font-size: 11pt; }
      .masthead, .dot, .section-rule, .metric::before { display: none; }
      .page { padding: 0; }
      section + section { margin-top: 18pt; }
      .hero { animation: none; }
      .cta { border: 0; padding: 0 8px; }
      a[href^="mailto:"]::after { content: none; }
      .led { box-shadow: none; }
      a { text-decoration: none; }
      a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; }
      .hero, .metric, .services li, .signals-list > div { break-inside: avoid; }
    }

