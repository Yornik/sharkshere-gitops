    ## Primary URL
    - https://yornik.eu/

    ## Profile Summary
    - Cloud Reliability & Platform Engineer (SRE / DevOps / Site Reliability Engineer)
    - Based in Rotterdam, Netherlands — available across the Netherlands and Europe
    - Kubernetes, Docker, Terraform, Helm, CI/CD, Infrastructure as Code
    - Observability: Prometheus, Grafana, Loki
    - Cloud platforms: AWS, Azure, GCP
    - AI-assisted and agent-driven engineering workflows
    - Strong practical focus on security, automation, and incident response

    ## Professional Links
    - LinkedIn: https://www.linkedin.com/in/yornik/
    - GitHub: https://github.com/Yornik
    - Credly: https://www.credly.com/users/yornik-heyl

