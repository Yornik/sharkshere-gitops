  llms.txt: |
    # Yornik Heyl
    > Cloud Reliability & Platform Engineer in Rotterdam, Netherlands. Five years at Mendix (Siemens): incident response, rollout design, GitOps and observability. Happy to network.

    yornik.eu is a one-page profile written like a runbook. It also describes the author's homelab, a 4-node Talos Kubernetes cluster managed declaratively with Argo CD.

    ## Links
    - [Website](https://yornik.eu/): the profile page
    - [GitHub](https://github.com/Yornik): code and infrastructure
    - [LinkedIn](https://www.linkedin.com/in/yornik/): professional profile
    - [Credly](https://www.credly.com/users/yornik-heyl): certifications and badges

    ## Contact
    - [yornik@yornik.nl](mailto:yornik@yornik.nl)

    ## Optional
    - Stack: Kubernetes, Argo CD, Helm, Prometheus, Grafana, Loki, OpenTofu
    - Website security: 100% website score on Internet.nl, aligned with Dutch NCSC guidance
