apiVersion: apps/v1
kind: Deployment
metadata:
  name: yornik
  namespace: yornik
  labels:
    app: yornik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yornik
  template:
    metadata:
      labels:
        app: yornik
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/
              readOnly: true
          resources:
            # No cpu limit by design - see fedishark/deployment.yaml for the full
            # reasoning. 50m = 5ms per 100ms CFS period; measured 67% of periods
            # throttled while using ~1% of the quota. CPU is compressible and the
            # request guarantees the share under contention; the memory limit stays.
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: html
          configMap:
            name: yornik-html
