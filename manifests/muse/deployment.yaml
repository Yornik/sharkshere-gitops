apiVersion: apps/v1
kind: Deployment
metadata:
  name: muse
  namespace: muse
  labels:
    app: muse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: muse
  template:
    metadata:
      labels:
        app: muse
    spec:
      containers:
        - name: muse
          # dovah/muse publishes only the "latest" tag (the pr-1284 yt-dlp
          # fork tag no longer exists on Docker Hub), so pin by digest.
          # This digest matches the image the running pod uses.
          image: dovah/muse:latest@sha256:1726a9083607d1e4d7b1e2be6f5c7ee089aca3e8234f54e8a40be13244530017
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: muse-secrets
                  key: DISCORD_TOKEN
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: muse-secrets
                  key: YOUTUBE_API_KEY
            - name: CACHE_LIMIT
              value: "1GB"
            - name: ENABLE_SPONSORBLOCK
              value: "True"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: muse-data-ssd
