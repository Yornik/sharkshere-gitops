apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: soiree
  namespace: soiree
  labels:
    # kube-prometheus-stack runs with the default selectors, so this label is
    # what makes Prometheus adopt the ServiceMonitor; the namespace selector
    # is empty by default, so living outside `monitoring` is fine.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: soiree
      app.kubernetes.io/instance: soiree
  namespaceSelector:
    matchNames:
      - soiree
  endpoints:
    # WARNING: the pinned image cannot serve this yet. Both /metrics and the
    # separate listener it now lives on landed upstream after v0.2.1 was cut,
    # so in that image port 9090 is not open at all and the scrape fails to
    # connect rather than 404ing. Prometheus records up == 0 and the stack's
    # default TargetDown rule fires until the image is bumped to a release
    # that has it. Merge this together with that bump.
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
