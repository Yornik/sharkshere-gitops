apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: soiree
  namespace: soiree
  labels:
    # kube-prometheus-stack runs with the default selectors, so this label is
    # what makes Prometheus adopt the ServiceMonitor; the namespace selector
    # is empty by default, so living outside `monitoring` is fine.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: soiree
      app.kubernetes.io/instance: soiree
  namespaceSelector:
    matchNames:
      - soiree
  endpoints:
    # WARNING: /metrics landed upstream after v0.2.1 was cut, so the pinned
    # image answers 404 here. Prometheus will record the target as up == 0
    # and the stack's default TargetDown rule will fire until the image is
    # bumped to a release that serves it. Either merge this together with
    # that bump, or accept the alert in the meantime.
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
