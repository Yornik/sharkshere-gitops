apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: soiree-pg
  namespace: soiree
  annotations:
    # Never let a pruned Application take the database with it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 3
  storage:
    storageClass: truenas-ssd-iscsi
    size: 10Gi
  walStorage:
    storageClass: truenas-ssd-iscsi
    size: 5Gi
  # Same shape as shared-pg/openproject-pg: requests high enough for Burstable
  # QoS rather than BestEffort (first evicted under memory pressure), memory
  # limit ~2x request and comfortably above shared_buffers + work_mem headroom.
  # No CPU limit: throttling a DB is worse than sharing.
  #
  # Nothing reads this cluster yet - soiree's Postgres layer is milestone 2 of
  # its roadmap and no released image connects to a database. It is provisioned
  # ahead of that, at a cost of 3x(10Gi + 5Gi) on ssd_pool and 3x512Mi RAM.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: 256MB
      work_mem: 16MB
      effective_cache_size: 1GB
  bootstrap:
    initdb:
      database: soiree
      owner: soiree
  monitoring:
    # Deprecated in CNPG; will be removed. We ship our own PodMonitor in
    # podmonitor.yaml so we control the release label Prometheus filters on.
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: soiree-pg-store
        serverName: soiree-pg
