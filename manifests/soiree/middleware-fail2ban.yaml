apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fail2ban-soiree
  namespace: soiree
spec:
  plugin:
    fail2ban:
      rules:
        # A backstop, not the primary control. soiree does its own login
        # throttling with four separate buckets - login by IP, login by
        # account, reset request, and token redemption - so credential
        # stuffing is already answered before it reaches here. This only has
        # to catch sustained abuse from one address.
        #
        # Deliberately permissive, for a reason specific to this app: an
        # unauthenticated visitor's very first page load calls
        # GET /api/v1/auth/session, which answers 401 by design. A strict rule
        # would count that and ban people who have not attempted to log in at
        # all. The guests here are a family, several of them behind one
        # household NAT and some behind CGNAT, so a ban lands on everyone
        # sharing that address.
        #
        # The estate already learned this the hard way: a 3-in-4h rule on
        # Vaultwarden banned NAT'd households off the vault on normal client
        # behaviour, and the same failure was documented and removed for
        # OpenProject. Matching the settled Vaultwarden numbers.
        statuscode: "401-403"
        maxretry: 30
        findtime: 10m
        bantime: 1h
        enabled: "true"
