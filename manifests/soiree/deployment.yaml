apiVersion: apps/v1
kind: Deployment
metadata:
  name: soiree
  namespace: soiree
  labels:
    app.kubernetes.io/name: soiree
    app.kubernetes.io/instance: soiree
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soiree
      app.kubernetes.io/instance: soiree
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soiree
        app.kubernetes.io/instance: soiree
    spec:
      containers:
        - name: soiree
          # Static Go binary on a scratch base. Source + CI:
          # github.com/Yornik/soiree
          image: ghcr.io/yornik/soiree:v0.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # The Prometheus exposition listens separately, on purpose: the
            # IngressRoute in front of :8080 has no path constraint, so
            # /metrics served there would be world-readable and
            # soiree_build_info would name the running commit to anyone who
            # asked. Nothing routes to this port from outside the cluster.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Everything event-specific is configuration, not source, which is
            # what lets one public image serve any event without a rebuild.
            # This block is the only place the occasion is named.
            - name: SOIREE_EVENT_NAME
              value: "Oma's 90th"
            - name: SOIREE_EVENT_TAGLINE
              value: "Invitation-only dinner"
            # PLACEHOLDER date, but a syntactically valid one on purpose. The
            # app parses this with time.Parse(time.RFC3339) and exits non-zero
            # if it does not carry an explicit offset — a REPLACE_ME string
            # here would be a CrashLoopBackOff rather than a visible default.
            # An empty value is also accepted and simply disables the
            # countdown.
            # Jakarta is UTC+7. The offset is mandatory: the app refuses to
            # start without one, because a bare local time is read in the
            # viewer's zone and the countdown then differs by a day between
            # the people planning together.
            - name: SOIREE_EVENT_DATE
              value: "2027-02-21T00:00:00+07:00"
            - name: SOIREE_CURRENCY
              value: "IDR"
            - name: SOIREE_LOCALE
              value: "id-ID"
            - name: SOIREE_SECONDARY_CURRENCY
              value: "EUR"
            - name: SOIREE_SECONDARY_LOCALE
              value: "nl-NL"
            # Canonical origin. Set-password links are built from this and
            # never from the request Host, which is attacker-supplied: a link
            # built from a forged Host would point somebody's one-time secret
            # at whatever host the attacker named.
            - name: SOIREE_BASE_URL
              value: "https://bokings-driessen.party"

            # Mail, via the same Resend relay the rest of the estate uses. The
            # sender is on this event's own domain: its DKIM, SPF and MX are
            # published and verified in Resend. Only the API key is secret -
            # host, port, user and sender are not, and putting them in the
            # Secret would only make them harder to read.
            - name: SOIREE_SMTP_HOST
              value: "smtp.resend.com"
            - name: SOIREE_SMTP_PORT
              value: "465"
            - name: SOIREE_SMTP_USER
              value: "resend"
            - name: SOIREE_SMTP_FROM
              value: "soiree@bokings-driessen.party"
            - name: SOIREE_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soiree-app
                  key: SMTP_PASSWORD

            # From the Secret CloudNativePG generates for the cluster's owner
            # role, not a copy of our own. A duplicated DSN is a rotation
            # hazard: CNPG can change that password and a hand-maintained copy
            # would keep the old one, failing at the next restart rather than
            # at the moment of the change.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: soiree-pg-app
                  key: uri

            # The first admin, and a password so that first login does not
            # depend on mail working. Both are consumed only while no admin
            # exists, so they are safe to leave set: neither can resurrect a
            # disabled account nor overwrite a password since changed. In the
            # Secret because the address is personal, not because it is secret.
            - name: SOIREE_BOOTSTRAP_ADMIN
              valueFrom:
                secretKeyRef:
                  name: soiree-app
                  key: BOOTSTRAP_ADMIN
            - name: SOIREE_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soiree-app
                  key: BOOTSTRAP_PASSWORD

            # Traefik terminates TLS and sets X-Forwarded-For. Without this the
            # per-IP rate limits would see the proxy's address for everyone and
            # one person could exhaust the allowance for all of them.
            - name: SOIREE_TRUST_PROXY_HEADERS
              value: "true"

            # There is no SOIREE_SESSION_SECRET. Sessions are rows in the
            # database keyed by a random token, so there is nothing to sign and
            # no key to rotate. An earlier draft of this manifest guessed at
            # one; it was never read by any version of the app.
          # v0.2.1 serves /healthz only. /readyz was split out from it after
          # the release (so the future database check has a home that is not
          # the liveness probe) and is not in any tag yet — pointing the
          # readiness probe at it today means a permanent 404, no Service
          # endpoints and a 503 behind the IngressRoute. Move readiness to
          # /readyz on the first release that ships it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
          resources:
            # No cpu limit by design - see fedishark/deployment.yaml for the
            # full reasoning. This is the same shape: a small Go HTTP server
            # whose work arrives in request bursts, where a CFS quota turns a
            # burst into a multi-period stall for no gain. CPU is compressible,
            # so the request below already guarantees a fair share under
            # contention. The memory limit stays: the whole site is held in
            # memory (raw + gzip + brotli per asset), and memory is NOT
            # compressible, so it must keep a hard ceiling.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
