apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: soiree-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # Both files below hold real values. SOPS encrypts YAML comments along with
  # everything else, so notes about them live here rather than inside.
  #
  # soiree-app.enc.yaml   Secret/soiree-app. Five values, all already filled
  #                       in with real ones:
  #
  #                         SMTP_PASSWORD      the Resend API key
  #                         BOOTSTRAP_ADMIN    the first admin's email address
  #                         BOOTSTRAP_PASSWORD their first password, 12+ chars
  #                         REMINDER_TO        extra deadline-digest recipients,
  #                                            on top of every active admin
  #                         VAPID_PRIVATE_KEY  the Web Push signing key
  #                         S3_BUCKET          the attachments bucket (private)
  #                         S3_ACCESS_KEY_ID   copied from openproject's
  #                         S3_SECRET_ACCESS_KEY  secret-s3-attachments.enc.yaml;
  #                                            rotate the two together
  #
  #                       VAPID_PRIVATE_KEY is the half of the Web Push pair
  #                       that must never leave the server; its public half is
  #                       in deployment.yaml in plain text, because a browser
  #                       cannot subscribe without having seen it. The pair was
  #                       generated once, and replacing it silently invalidates
  #                       every subscription ever made against the old public
  #                       key - see the note in deployment.yaml before touching
  #                       it. Nothing reads it yet: the pinned image predates
  #                       internal/push.
  #
  #                       The two bootstrap values are consumed only while the
  #                       database has no admin, so they are safe to leave in
  #                       place afterwards: neither can resurrect a disabled
  #                       account nor overwrite a password since changed. They
  #                       exist because the first account is otherwise a dead
  #                       end when mail is not working - every route that hands
  #                       back a set-password link is admin-only.
  #
  #                       BOOTSTRAP_ADMIN is here because the address is
  #                       personal, not because it is secret.
  #
  #                       DATABASE_URL is deliberately NOT here: it comes from
  #                       soiree-pg-app, the Secret CloudNativePG generates for
  #                       the cluster owner, so a rotation cannot leave a
  #                       hand-maintained copy behind. There is also no session
  #                       secret - sessions are database rows keyed by a random
  #                       token, so nothing is signed.
  #
  # secret-s3-wal.enc.yaml
  #                       Secret/cnpg-s3-wal: the Hetzner Object Storage
  #                       credentials barman-cloud archives WAL with.
  #
  #                       Filled in, copied from shared-pg. Worth keeping the
  #                       warning: a Secret that exists with wrong values does
  #                       not gate anything - soiree-pg would come up healthy and
  #                       then degrades quietly. Postgres will not recycle a
  #                       WAL segment the archiver has not confirmed, so every
  #                       failed upload leaves a .ready file behind until the
  #                       5Gi walStorage volume fills on all three instances
  #                       and the cluster stops accepting writes. The
  #                       ScheduledBackup's immediate: true also fires one
  #                       doomed base backup the moment it is created.
  #
  #                       The real values are already in this repo, encrypted
  #                       to the same age recipient, in three namespaces. To
  #                       reuse them:
  #                         sops -d manifests/shared-pg/secret.enc.yaml \
  #                           | sed 's/namespace: shared-pg/namespace: soiree/' \
  #                           > manifests/soiree/secret-s3-wal.enc.yaml
  #                         sops -e -i manifests/soiree/secret-s3-wal.enc.yaml
  #
  # Edit with: sops manifests/soiree/<file>.enc.yaml
  - ./soiree-app.enc.yaml
  - ./secret-s3-wal.enc.yaml
