apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: soiree
  namespace: soiree
spec:
  entryPoints:
    - websecure
  routes:
    # DNS must resolve before this route exists - Traefik does not retry a
    # failed ACME order, so an IngressRoute that appears first burns the
    # attempt and the cert has to be prompted by restarting Traefik.
    - match: Host(`bokings-driessen.party`) || Host(`www.bokings-driessen.party`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: redirect-www-to-apex
          namespace: soiree
        - name: csp
          namespace: soiree
        - name: rate-limit
          namespace: traefik
      services:
        - name: soiree
          port: 8080
  tls:
    certResolver: letsencrypt
