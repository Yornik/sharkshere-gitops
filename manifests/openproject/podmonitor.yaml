apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: openproject-pg
  namespace: openproject
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: openproject-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      metricRelabelings:
        # Drop deprecated, always-zero backup metrics. The plugin model
        # exposes real values under barman_cloud_cloudnative_pg_io_*; the
        # upstream Grafana dashboard regex __name__=~"cnpg_collector_*|
        # barman_cloud_*" returns both series per pod which collide after
        # `*1000` strips __name__ → "vector cannot contain metrics with
        # the same labelset" error.
        - sourceLabels: [__name__]
          regex: cnpg_collector_(last_available_backup_timestamp|first_recoverability_point|last_failed_backup_timestamp)
          action: drop
