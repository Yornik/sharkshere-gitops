apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openproject-pg
  namespace: openproject
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 3
  # The Postgres image comes from the ClusterImageCatalog of CNPG
  # (manifests/cnpg-catalog), not from a tag in this file. The cluster names
  # only its major version. The catalog maps that major to the current image.
  # See docs/incidents/2026-10-29-cnpg-image-frozen-at-creation.md.
  #
  # NOTE: a change of `major` is an offline in-place upgrade. CNPG stops the
  # cluster and runs pg_upgrade. Change 1 cluster at a time, and follow the
  # steps in the incident write-up (ANALYZE, new base backup).
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-system-trixie
    major: 18
  storage:
    storageClass: truenas-ssd-iscsi
    size: 10Gi
  walStorage:
    storageClass: truenas-ssd-iscsi
    size: 5Gi
  # Requests sized from observed usage (~75-165Mi, <20m CPU) + headroom so the
  # pods get Burstable QoS instead of BestEffort (first evicted under memory
  # pressure). Memory limit ~2x request and well above shared_buffers (256MB)
  # + work_mem headroom. No CPU limit: throttling a DB is worse than sharing.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: 256MB
      work_mem: 16MB
      effective_cache_size: 1GB
  bootstrap:
    initdb:
      database: openproject
      owner: openproject
  monitoring:
    # Deprecated in CNPG; will be removed. We ship our own PodMonitor in
    # podmonitor.yaml so we control the release label Prometheus filters on.
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: openproject-pg-store
        serverName: openproject-pg
