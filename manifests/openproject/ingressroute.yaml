apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openproject
  namespace: openproject
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plan.yornik.eu`)
      kind: Rule
      middlewares:
        - name: openproject-hsts
          namespace: openproject
        # NOTE: fail2ban-openproject removed. OpenProject's SPA makes
        # unauthenticated /api/v3/* calls that legitimately return 401,
        # which the IP-based fail2ban plugin counted as failed login
        # attempts → instant ban on first page load. OpenProject has
        # its own Rails-level login throttling; we rely on that.
      services:
        - name: openproject
          port: 8080
  tls:
    certResolver: letsencrypt
