# DANE TLSA for media.finfra.party, the host of the IRC file links
# (manifests/matrix/ingressroute-media.yaml). The daily 03:xx ladder is
# full (03, 13, 23, 33, 43, 53), so this job runs at 04:03: the first
# free minute after it, clear of every Sunday CAA job at 04:13 to 04:53
# and of caa-updater-finfra at 06:03. The zone is signed with DNSSEC - the
# DS record was live at the .party registry on 2026-11-28, verified
# against the TLD nameservers.
#
# The record is 3 1 1: the SHA-256 of the public key of the certificate
# that the host serves. Traefik keeps the private key when it renews a
# certificate, so a renewal does not change the record. A new key comes
# only with a new certificate, for example after a loss of acme.json. DANE
# then fails until the next run, at most 1 day plus the TTL of 1 hour.
#
# If the host serves no certificate, the script stops and keeps the record.
# See configmap-dane-updater-script.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dane-updater-media
  namespace: external-dns
spec:
  schedule: "3 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dane-updater
              image: alpine:3.24
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl jq openssl >/dev/null
                  /scripts/update-tlsa.sh
              env:
                - name: CF_ZONE_NAME
                  value: finfra.party
                - name: TARGET_HOST
                  value: media.finfra.party
                - name: TLSA_RECORD_NAME
                  value: _443._tcp.media.finfra.party
                - name: TLSA_TTL
                  value: "3600"
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-credentials
                      key: api-token
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: dane-updater-script
                defaultMode: 0555
