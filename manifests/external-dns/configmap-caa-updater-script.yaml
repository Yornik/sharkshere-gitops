apiVersion: v1
kind: ConfigMap
metadata:
  name: caa-updater-script
  namespace: external-dns
data:
  update-caa.sh: |
    #!/bin/sh
    set -eu

    : "${CF_API_TOKEN:?CF_API_TOKEN is required}"
    : "${CF_ZONE_NAME:?CF_ZONE_NAME is required}"
    : "${CAA_RECORD_NAME:?CAA_RECORD_NAME is required}"
    : "${CAA_REPORT_EMAIL:?CAA_REPORT_EMAIL is required}"
    : "${CAA_TTL:=3600}"

    MANAGED_COMMENT="managed-by: sharkshere-caa"

    api() {
      curl -fsS \
        -H "Authorization: Bearer ${CF_API_TOKEN}" \
        -H "Content-Type: application/json" \
        "$@"
    }

    ZONE_ID="$(
      api "https://api.cloudflare.com/client/v4/zones?name=${CF_ZONE_NAME}" \
      | jq -r '.result[0].id // empty'
    )"

    if [ -z "${ZONE_ID}" ]; then
      echo "Failed to resolve Cloudflare zone id for ${CF_ZONE_NAME}"
      exit 1
    fi

    upsert_caa() {
      tag="$1"
      value="$2"

      record_id="$(
        api "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CAA&name=${CAA_RECORD_NAME}" \
        | jq -r --arg comment "${MANAGED_COMMENT}" --arg tag "${tag}" '
            .result[]
            | select(.comment == $comment and .data.tag == $tag)
            | .id
          ' \
        | head -n 1
      )"

      body="$(
        jq -cn \
          --arg name "${CAA_RECORD_NAME}" \
          --arg comment "${MANAGED_COMMENT}" \
          --arg tag "${tag}" \
          --arg value "${value}" \
          --argjson ttl "${CAA_TTL}" \
          '{
            type: "CAA",
            name: $name,
            ttl: $ttl,
            comment: $comment,
            data: {
              flags: 0,
              tag: $tag,
              value: $value
            }
          }'
      )"

      if [ -n "${record_id}" ]; then
        api -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${record_id}" --data "${body}" >/dev/null
      else
        api -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" --data "${body}" >/dev/null
      fi

      echo "Ensured CAA ${tag} ${value} on ${CAA_RECORD_NAME}"
    }

    upsert_caa issue "letsencrypt.org"
    upsert_caa issuewild ";"
    upsert_caa iodef "mailto:${CAA_REPORT_EMAIL}"

    # Check the CAA set that resolvers serve, not only the records this
    # script writes. The upserts above never remove a record, so they report
    # success while other records widen the policy.
    #
    # 2026-10-13: yornik.eu and fedishark.eu served 9 extra CAA records. They
    # let 5 CAs issue, and they let them issue wildcards, which overrides the
    # issuewild ";" above. Wildcard certificates for both zones were issued.
    # This matches Cloudflare Universal SSL, which adds CAA records for its
    # CAs to a zone that has any CAA record. Turn Universal SSL off for the
    # zone: every record here is DNS-only, so the edge certificate is unused.
    #
    # The lookup uses dns.google, so the check does not depend on the DNS
    # provider whose records it checks. Only extra records fail the check.
    # A record that is missing because a cache has not caught up yet does not.
    live="$(
      curl -fsS --retry 3 "https://dns.google/resolve?name=${CAA_RECORD_NAME}&type=CAA" \
      | jq -r '.Answer[]? | select(.type == 257) | .data'
    )"
    unexpected="$(
      printf '%s\n' "${live}" \
      | grep -E '^[0-9]+ (issue|issuewild) ' \
      | grep -vxF -e '0 issue "letsencrypt.org"' -e '0 issuewild ";"' \
      || true
    )"
    if [ -n "${unexpected}" ]; then
      echo "CAA drift on ${CAA_RECORD_NAME}. Resolvers serve records this script does not set:"
      printf '%s\n' "${unexpected}" | sed 's/^/  /'
      echo "Turn off Cloudflare Universal SSL for ${CF_ZONE_NAME}, then run this job again."
      exit 1
    fi
    echo "CAA on ${CAA_RECORD_NAME} matches the policy"

    echo "CAA update succeeded for ${CAA_RECORD_NAME}"
