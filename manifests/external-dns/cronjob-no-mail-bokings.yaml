apiVersion: batch/v1
kind: CronJob
metadata:
  name: no-mail-bokings
  namespace: external-dns
spec:
  schedule: "23 5 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: no-mail
              image: alpine:3.24
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl jq >/dev/null
                  /scripts/update-no-mail.sh
              env:
                - name: CF_ZONE_NAME
                  value: bokings-driessen.party
                - name: MAIL_TTL
                  value: "3600"
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-credentials
                      key: api-token
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: no-mail-script
                defaultMode: 0555
