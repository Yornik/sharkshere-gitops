---
# soiree is served from the zone apex, so these must be direct A/AAAA records
# rather than the `target: jump.fedishark.eu` CNAME the subdomains above use:
# a CNAME at an apex is invalid, and it collides with the DANE TLSA records
# this estate publishes. Same four addresses as the yornik.eu apex — both jump
# hosts, v4 and v6 — so the name survives losing either one.
apiVersion: v1
kind: Service
metadata:
  name: dns-bokings-driessen-party
  namespace: external-dns
  annotations:
    external-dns.kubernetes.io/hostname: bokings-driessen.party
    external-dns.kubernetes.io/target: 78.47.240.158,77.42.94.152,2a01:4f8:1c19:60c2::1,2a01:4f9:c014:e6de::1
    external-dns.kubernetes.io/ttl: "3600"
spec:
  type: ClusterIP
  ports:
    - name: dummy
      port: 80
      targetPort: 80
---
# www is a plain CNAME to the jump hosts and is redirected to the apex by
# Traefik, matching how www.yornik.eu is handled.
apiVersion: v1
kind: Service
metadata:
  name: dns-www-bokings-driessen-party
  namespace: external-dns
  annotations:
    external-dns.kubernetes.io/hostname: www.bokings-driessen.party
    external-dns.kubernetes.io/target: jump.fedishark.eu
    external-dns.kubernetes.io/ttl: "3600"
spec:
  type: ClusterIP
  ports:
    - name: dummy
      port: 80
      targetPort: 80
---
# go-learn.party is the old host of go-practice, the apex of its own zone. Its
# route redirects every path to vesper-labs.org, so old links and the verify
# links of issued certificates keep working. An apex takes direct A and AAAA
# records, not the `target: jump.fedishark.eu` CNAME of the subdomains above.
# A CNAME at an apex is not valid, and it conflicts with the DANE TLSA records
# of this estate. The 4 addresses are the same as for the yornik.eu and
# bokings-driessen.party apexes. They are both jump hosts, v4 and v6, so the
# name stays up if 1 host is lost. There is no www record.
apiVersion: v1
kind: Service
metadata:
  name: dns-go-learn-party
  namespace: external-dns
  annotations:
    external-dns.kubernetes.io/hostname: go-learn.party
    external-dns.kubernetes.io/target: 78.47.240.158,77.42.94.152,2a01:4f8:1c19:60c2::1,2a01:4f9:c014:e6de::1
    external-dns.kubernetes.io/ttl: "3600"
spec:
  type: ClusterIP
  ports:
    - name: dummy
      port: 80
      targetPort: 80
---
# vesper-labs.org is the host of go-practice, again the apex of its own zone,
# with the same 4 jump-host addresses as go-learn.party above. There is no www
# record: the app accepts 1 origin only, the WebAuthn relying party
# vesper-labs.org. go-learn.party keeps its record and redirects here.
apiVersion: v1
kind: Service
metadata:
  name: dns-vesper-labs-org
  namespace: external-dns
  annotations:
    external-dns.kubernetes.io/hostname: vesper-labs.org
    external-dns.kubernetes.io/target: 78.47.240.158,77.42.94.152,2a01:4f8:1c19:60c2::1,2a01:4f9:c014:e6de::1
    external-dns.kubernetes.io/ttl: "3600"
spec:
  type: ClusterIP
  ports:
    - name: dummy
      port: 80
      targetPort: 80
