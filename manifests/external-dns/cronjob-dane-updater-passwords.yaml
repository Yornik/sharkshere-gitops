apiVersion: batch/v1
kind: CronJob
metadata:
  name: dane-updater-passwords
  namespace: external-dns
spec:
  schedule: "33 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dane-updater
              image: alpine:3.23
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl jq openssl >/dev/null
                  /scripts/update-tlsa.sh
              env:
                - name: CF_ZONE_NAME
                  value: yornik.eu
                - name: TARGET_HOST
                  value: passwords.yornik.eu
                - name: TLSA_RECORD_NAME
                  value: _443._tcp.passwords.yornik.eu
                - name: TLSA_TTL
                  value: "3600"
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-credentials
                      key: api-token
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: dane-updater-script
                defaultMode: 0555
