apiVersion: batch/v1
kind: CronJob
metadata:
  name: dane-updater
  namespace: external-dns
spec:
  schedule: "13 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dane-updater
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl openssl >/dev/null
                  chmod +x /scripts/update-tlsa.sh
                  /scripts/update-tlsa.sh
              env:
                - name: DESEC_ZONE
                  value: yornik.eu
                - name: TARGET_HOST
                  value: secrets.yornik.eu
                - name: TLSA_SUBNAME
                  value: _443._tcp.secrets
                - name: TLSA_TTL
                  value: "3600"
                - name: DESEC_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: desec-credentials
                      key: api-key
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: dane-updater-script
                defaultMode: 0555
