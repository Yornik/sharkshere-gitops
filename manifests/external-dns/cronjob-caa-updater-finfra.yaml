# CAA for finfra.party: only Let's Encrypt issues, and nobody issues a
# wildcard. The same job as caa-updater-vesper. The Sunday CAA ladder is
# full from 04:13 to 04:53 and 04:03 carries the daily DANE job, so this
# job runs at 06:03: the next free slot, still clear of every other CAA
# job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: caa-updater-finfra
  namespace: external-dns
spec:
  schedule: "3 6 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: caa-updater
              image: alpine:3.24
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl jq >/dev/null
                  /scripts/update-caa.sh
              env:
                - name: CF_ZONE_NAME
                  value: finfra.party
                - name: CAA_RECORD_NAME
                  value: finfra.party
                - name: CAA_REPORT_EMAIL
                  value: yornik@yornik.nl
                - name: CAA_TTL
                  value: "3600"
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-credentials
                      key: api-token
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: caa-updater-script
                defaultMode: 0555
