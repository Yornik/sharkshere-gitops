apiVersion: v1
kind: ConfigMap
metadata:
  name: dane-updater-script
  namespace: external-dns
data:
  update-tlsa.sh: |
    #!/bin/sh
    set -eu

    : "${CF_API_TOKEN:?CF_API_TOKEN is required}"
    : "${CF_ZONE_NAME:?CF_ZONE_NAME is required}"
    : "${TARGET_HOST:?TARGET_HOST is required}"
    : "${TLSA_RECORD_NAME:?TLSA_RECORD_NAME is required}"
    : "${TLSA_TTL:=3600}"

    api() {
      curl -fsS \
        -H "Authorization: Bearer ${CF_API_TOKEN}" \
        -H "Content-Type: application/json" \
        "$@"
    }

    echo "Computing SPKI hash for ${TARGET_HOST}:443"
    HASH="$(
      echo | openssl s_client -connect "${TARGET_HOST}:443" -servername "${TARGET_HOST}" 2>/dev/null \
      | openssl x509 -pubkey -noout \
      | openssl pkey -pubin -outform DER 2>/dev/null \
      | openssl dgst -sha256 -binary \
      | hexdump -v -e '/1 "%02x"'
    )"

    # The pipeline has no pipefail. If a step before dgst fails, dgst reads
    # no input and prints the SHA-256 of nothing. That happens when the host
    # serves no certificate yet: Traefik refuses an unknown name (sniStrict).
    # A record with that hash matches no key, so stop and keep the record.
    EMPTY_SHA256="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    if [ -z "${HASH}" ] || [ "${HASH}" = "${EMPTY_SHA256}" ]; then
      echo "Failed to compute TLSA hash for ${TARGET_HOST}: it served no certificate. The record stays as it is."
      exit 1
    fi

    ZONE_ID="$(
      api "https://api.cloudflare.com/client/v4/zones?name=${CF_ZONE_NAME}" \
      | jq -r '.result[0].id // empty'
    )"

    if [ -z "${ZONE_ID}" ]; then
      echo "Failed to resolve Cloudflare zone id for ${CF_ZONE_NAME}"
      exit 1
    fi

    MANAGED_COMMENT="managed-by: sharkshere-tlsa"
    RECORD_ID="$(
      api "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=TLSA&name=${TLSA_RECORD_NAME}" \
      | jq -r --arg comment "${MANAGED_COMMENT}" '
          .result[]
          | select(.comment == $comment)
          | .id
        ' \
      | head -n 1
    )"

    BODY="$(
      jq -cn \
        --arg name "${TLSA_RECORD_NAME}" \
        --arg comment "${MANAGED_COMMENT}" \
        --arg certificate "${HASH}" \
        --argjson ttl "${TLSA_TTL}" \
        '{
          type: "TLSA",
          name: $name,
          ttl: $ttl,
          comment: $comment,
          data: {
            usage: 3,
            selector: 1,
            matching_type: 1,
            certificate: $certificate
          }
        }'
    )"

    echo "Updating TLSA ${TLSA_RECORD_NAME} to 3 1 1 ${HASH}"

    if [ -n "${RECORD_ID}" ]; then
      api -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" --data "${BODY}" >/dev/null
    else
      api -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" --data "${BODY}" >/dev/null
    fi

    echo "TLSA update succeeded"
