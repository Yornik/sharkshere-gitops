apiVersion: v1
kind: ConfigMap
metadata:
  name: dane-updater-script
  namespace: external-dns
data:
  update-tlsa.sh: |
    #!/bin/sh
    set -eu

    : "${CF_API_TOKEN:?CF_API_TOKEN is required}"
    : "${CF_ZONE_NAME:?CF_ZONE_NAME is required}"
    : "${TARGET_HOST:?TARGET_HOST is required}"
    : "${TLSA_RECORD_NAME:?TLSA_RECORD_NAME is required}"
    : "${TLSA_TTL:=3600}"

    api() {
      curl -fsS \
        -H "Authorization: Bearer ${CF_API_TOKEN}" \
        -H "Content-Type: application/json" \
        "$@"
    }

    echo "Computing SPKI hash for ${TARGET_HOST}:443"
    HASH="$(
      echo | openssl s_client -connect "${TARGET_HOST}:443" -servername "${TARGET_HOST}" 2>/dev/null \
      | openssl x509 -pubkey -noout \
      | openssl pkey -pubin -outform DER 2>/dev/null \
      | openssl dgst -sha256 -binary \
      | hexdump -v -e '/1 "%02x"'
    )"

    if [ -z "${HASH}" ]; then
      echo "Failed to compute TLSA hash for ${TARGET_HOST}"
      exit 1
    fi

    ZONE_ID="$(
      api "https://api.cloudflare.com/client/v4/zones?name=${CF_ZONE_NAME}" \
      | jq -r '.result[0].id // empty'
    )"

    if [ -z "${ZONE_ID}" ]; then
      echo "Failed to resolve Cloudflare zone id for ${CF_ZONE_NAME}"
      exit 1
    fi

    CONTENT="3 1 1 ${HASH}"
    RECORD_ID="$(
      api "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=TLSA&name=${TLSA_RECORD_NAME}" \
      | jq -r '.result[0].id // empty'
    )"

    BODY="$(printf '{"type":"TLSA","name":"%s","content":"%s","ttl":%s}' "${TLSA_RECORD_NAME}" "${CONTENT}" "${TLSA_TTL}")"

    echo "Updating TLSA ${TLSA_RECORD_NAME} to ${CONTENT}"

    if [ -n "${RECORD_ID}" ]; then
      api -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" --data "${BODY}" >/dev/null
    else
      api -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" --data "${BODY}" >/dev/null
    fi

    echo "TLSA update succeeded"
