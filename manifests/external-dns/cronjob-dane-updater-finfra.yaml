# DANE TLSA for finfra.party, the Matrix homeserver host. The same job as
# dane-updater-vesper, in the free 03:03 slot of the daily ladder (13, 23,
# 33, 43 and 53 are taken). The zone is signed with DNSSEC - the DS record
# was live at the .party registry on 2026-11-28, verified against the TLD
# nameservers - so a DANE client can trust the record.
#
# The record is 3 1 1: the SHA-256 of the public key of the certificate
# that the host serves. Traefik keeps the private key when it renews a
# certificate, so a renewal does not change the record. A new key comes
# only with a new certificate, for example after a loss of acme.json. DANE
# then fails until the next run, at most 1 day plus the TTL of 1 hour.
#
# If the host serves no certificate, the script stops and keeps the record.
# See configmap-dane-updater-script.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dane-updater-finfra
  namespace: external-dns
spec:
  schedule: "3 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dane-updater
              image: alpine:3.24
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl jq openssl >/dev/null
                  /scripts/update-tlsa.sh
              env:
                - name: CF_ZONE_NAME
                  value: finfra.party
                - name: TARGET_HOST
                  value: finfra.party
                - name: TLSA_RECORD_NAME
                  value: _443._tcp.finfra.party
                - name: TLSA_TTL
                  value: "3600"
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-credentials
                      key: api-token
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: dane-updater-script
                defaultMode: 0555
