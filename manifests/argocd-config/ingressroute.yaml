apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Only the webhook stays public. GitHub sends a push event here and
    # cannot join the tailnet, so this one path must keep a public route.
    # The UI and the gRPC endpoint the argocd CLI uses are on the tailnet.
    # See manifests/argocd-config/service-tailnet.yaml.
    #
    # WARNING: Do not widen this match. The path is the boundary. A match on
    # the host alone puts the whole API and the UI back on the internet.
    - match: Host(`argocd.fedishark.eu`) && Path(`/api/webhook`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: fail2ban-argocd
          namespace: argocd
        - name: rate-limit
          namespace: traefik
        - name: no-compression
          namespace: traefik
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: letsencrypt
