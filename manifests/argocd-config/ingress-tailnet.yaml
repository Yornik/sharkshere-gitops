apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-tailnet
  namespace: argocd
  annotations:
    # The proxy serves port 443 only. Without the redirect, an http://
    # address times out instead of reaching the HTTPS one.
    tailscale.com/http-redirect: "true"
spec:
  # The Tailscale operator runs 1 proxy device for this Ingress. The proxy
  # ends TLS with a certificate for the ts.net name. The UI and the argocd
  # CLI reach ArgoCD here. The public IngressRoute serves only /api/webhook,
  # because GitHub cannot join the tailnet.
  # See docs/runbooks/tailnet-only-admin-uis.md.
  ingressClassName: tailscale
  defaultBackend:
    service:
      # The upstream Service. A bootstrap re-apply keeps its name and ports.
      name: argocd-server
      port:
        # Port 80 gives the proxy an http:// backend, so it can send the
        # gRPC of the argocd CLI as h2c. Port 443 makes the proxy use TLS,
        # which argocd-server does not serve with server.insecure.
        number: 80
  tls:
    # The first label is the device name: argocd.hedgehog-wage.ts.net.
    - hosts:
        - argocd
