apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  # Scaled to 0 on 2026-10-21 to stop the PHP-FPM process.
  # PrivateBin is the only PHP workload in this repository and is
  # internet-facing. It is exposed to the php2shell PHP core RCE
  # (CVE-2026-109618, CVE-2026-109619, CVSS 9.2). No in-application fix
  # exists. The fix is a patched PHP runtime.
  # To restore, bump the image below to a PrivateBin release built on
  # the fixed version of its PHP branch. The expected fixed versions are
  # 8.5.12, 8.4.27, 8.3.36 and 8.2.35, once PHP publishes them. Confirm
  # the branch with `php -v` in the container. Set replicas to 1 in the
  # same change. Do not just revert this commit. Do not restore on the
  # unpatched 2.1.0: a node can reuse a cached 2.1.0 even if upstream
  # re-pushes that tag. If upstream re-pushes 2.1.0 in place, Renovate
  # opens no PR; pin the new digest (2.1.0@sha256:...) in that same
  # change.
  # See docs/incidents/2026-10-21-privatebin-disabled-php2shell-rce.md.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: privatebin
  template:
    metadata:
      labels:
        app: privatebin
    spec:
      containers:
        - name: privatebin
          image: privatebin/nginx-fpm-alpine:2.1.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /srv/data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: privatebin-data-ssd
