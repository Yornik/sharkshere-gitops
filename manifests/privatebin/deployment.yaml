apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  # Restored to 1 on 2026-10-22 after the php2shell fix shipped.
  # PrivateBin was scaled to 0 on 2026-10-21 for the PHP core RCE
  # (CVE-2026-109618, CVE-2026-109619). PHP 8.5.12 carries the fix, and
  # the image below is pinned to that rebuild by digest.
  # See docs/incidents/2026-10-21-privatebin-disabled-php2shell-rce.md.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: privatebin
  template:
    metadata:
      labels:
        app: privatebin
    spec:
      containers:
        - name: privatebin
          # Pinned by digest on 2026-10-22. PrivateBin re-pushed the 2.1.0
          # tag in place onto the PHP 8.5.12 rebuild, so the tag alone can
          # reuse a cached pre-fix 2.1.0 on a node. This digest is the
          # 2.1.0 / 2.1.0-alpine3.24-php8.5.12 manifest list. Keep the
          # digest. Renovate still bumps the version and updates the tag and
          # digest together. An in-place re-push arrives as a digest update
          # that a person reviews.
          image: privatebin/nginx-fpm-alpine:2.1.0@sha256:0f80fb240c3c3073c53a82893da7c7d62f03f4e05403855b720e4371541ba412
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /srv/data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: privatebin-data-ssd
