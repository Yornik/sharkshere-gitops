apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  # Scaled to 0 on 2026-10-21 to stop the PHP-FPM process.
  # PrivateBin is the only PHP workload in this repository and is
  # internet-facing. It is exposed to the php2shell PHP core RCE
  # (CVE-2026-109618, CVE-2026-109619, CVSS 9.2). No in-application fix
  # exists. The fix is a patched PHP runtime.
  # To restore, bump the image below to a PrivateBin release built on
  # patched PHP (8.5.12 or later once PHP publishes the fix). Then set
  # replicas to 1 in the same change. Renovate proposes the image bump
  # as its own PR. Do not restore on tag 2.1.0 and do not just revert
  # this commit: 2.1.0 runs the unpatched PHP, and a node can reuse a
  # cached 2.1.0 even if upstream re-pushes that tag.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: privatebin
  template:
    metadata:
      labels:
        app: privatebin
    spec:
      containers:
        - name: privatebin
          image: privatebin/nginx-fpm-alpine:2.1.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /srv/data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: privatebin-data-ssd
