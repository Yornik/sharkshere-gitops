apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-backup-ssd
  namespace: jellyfin
spec:
  # The backup of jellyfin-config goes to the NAS, on the SSD pool. The NAS
  # takes a ZFS snapshot at 00:00 and its cloudsync tasks copy the dataset to
  # Hetzner. jellyfin-config itself is local-path on 1 node and has no other
  # copy. See cronjob-backup.yaml.
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-ssd
  resources:
    requests:
      storage: 5Gi
