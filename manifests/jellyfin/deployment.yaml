apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      initContainers:
        - name: patch-network-config
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              CONF=/config/config/network.xml
              if [ ! -f "$CONF" ]; then exit 0; fi
              # Force all clients (LAN + remote) to use the external URL for streams.
              # The env var only sets this in memory; patching the XML persists it.
              sed -i 's|<PublishedServerUriBySubnet />|<PublishedServerUriBySubnet><string>all=https://jelly.fedishark.eu</string></PublishedServerUriBySubnet>|' "$CONF"
              sed -i 's|<PublishedServerUriBySubnet></PublishedServerUriBySubnet>|<PublishedServerUriBySubnet><string>all=https://jelly.fedishark.eu</string></PublishedServerUriBySubnet>|' "$CONF"
              # Set public HTTPS port to 443 (Traefik terminates TLS)
              sed -i 's|<PublicHttpsPort>.*</PublicHttpsPort>|<PublicHttpsPort>443</PublicHttpsPort>|' "$CONF"
              sed -i 's|<PublicHttpPort>.*</PublicHttpPort>|<PublicHttpPort>443</PublicHttpPort>|' "$CONF"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.6
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "https://jelly.fedishark.eu"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /media/movies
              readOnly: true
            - name: series
              mountPath: /media/series
              readOnly: true
            - name: dri
              mountPath: /dev/dri
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: movies
          persistentVolumeClaim:
            claimName: jellyfin-movies
        - name: series
          persistentVolumeClaim:
            claimName: jellyfin-series
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
