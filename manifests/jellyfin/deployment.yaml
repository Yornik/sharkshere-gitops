apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        # Belt-and-braces for /dev/dri access: common render (44) and video (226)
        # GIDs. renderD128 is 0666 on Talos nodes so these are not strictly
        # required, but they keep transcoding working if permissions tighten.
        supplementalGroups:
          - 44
          - 226
      initContainers:
        - name: patch-network-config
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              CONF=/config/config/network.xml
              ENCODING=/config/config/encoding.xml
              KNOWN_PROXY_CIDR=10.244.0.0/16
              if [ ! -f "$CONF" ]; then exit 0; fi
              # Force all clients (LAN + remote) to use the external URL for streams.
              # The env var only sets this in memory; patching the XML persists it.
              sed -i 's|<PublishedServerUriBySubnet />|<PublishedServerUriBySubnet><string>all=https://jelly.yornik.eu</string></PublishedServerUriBySubnet>|' "$CONF"
              sed -i 's|<PublishedServerUriBySubnet></PublishedServerUriBySubnet>|<PublishedServerUriBySubnet><string>all=https://jelly.yornik.eu</string></PublishedServerUriBySubnet>|' "$CONF"
              # Disable LAN AutoDiscovery — broadcasting the pod IP causes Apple TV
              # to store the internal pod address and bypass Traefik for streams.
              sed -i 's|<AutoDiscovery>true</AutoDiscovery>|<AutoDiscovery>false</AutoDiscovery>|' "$CONF"
              # Trust only the cluster pod subnet that Traefik comes from.
              sed -i "s|<KnownProxies />|<KnownProxies><string>${KNOWN_PROXY_CIDR}</string></KnownProxies>|" "$CONF"
              sed -i "s|<KnownProxies></KnownProxies>|<KnownProxies><string>${KNOWN_PROXY_CIDR}</string></KnownProxies>|" "$CONF"
              sed -i "/<KnownProxies>/,/<\\/KnownProxies>/c\\  <KnownProxies><string>${KNOWN_PROXY_CIDR}</string></KnownProxies>" "$CONF"
              # Set public HTTPS port to 443 (Traefik terminates TLS)
              sed -i 's|<PublicHttpsPort>.*</PublicHttpsPort>|<PublicHttpsPort>443</PublicHttpsPort>|' "$CONF"
              sed -i 's|<PublicHttpPort>.*</PublicHttpPort>|<PublicHttpPort>443</PublicHttpPort>|' "$CONF"
              # Configure Intel QSV explicitly for single-GPU systems.
              if [ -f "$ENCODING" ]; then
                sed -i 's|<HardwareAccelerationType>.*</HardwareAccelerationType>|<HardwareAccelerationType>qsv</HardwareAccelerationType>|' "$ENCODING"
                sed -i 's|<QsvDevice />|<QsvDevice>/dev/dri/renderD128</QsvDevice>|' "$ENCODING"
                sed -i 's|<QsvDevice>.*</QsvDevice>|<QsvDevice>/dev/dri/renderD128</QsvDevice>|' "$ENCODING"
                sed -i 's|<VaapiDevice>.*</VaapiDevice>|<VaapiDevice>/dev/dri/renderD128</VaapiDevice>|' "$ENCODING"
                sed -i 's|<EnableHardwareEncoding>false</EnableHardwareEncoding>|<EnableHardwareEncoding>true</EnableHardwareEncoding>|' "$ENCODING"
                sed -i 's|<PreferSystemNativeHwDecoder>false</PreferSystemNativeHwDecoder>|<PreferSystemNativeHwDecoder>true</PreferSystemNativeHwDecoder>|' "$ENCODING"
                # Add HEVC to hardware decoding codecs so QSV handles H.265 — this makes
                # transcoding fast enough on the N150 iGPU that the Apple TV cold-start
                # "Stopped at 0ms" issue no longer occurs.
                grep -q '<string>hevc</string>' "$ENCODING" || \
                  sed -i 's|</HardwareDecodingCodecs>|<string>hevc</string></HardwareDecodingCodecs>|' "$ENCODING"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
        - name: install-libdvdcss
          image: alpine:3.24
          command: ["sh", "-c"]
          args:
            - |
              apk add --no-cache libdvdcss \
                --repository https://dl-cdn.alpinelinux.org/alpine/edge/testing > /dev/null 2>&1
              cp /usr/lib/libdvdcss.so* /dvdcss/
              echo "libdvdcss installed: $(ls /dvdcss/)"
          volumeMounts:
            - name: dvdcss
              mountPath: /dvdcss
        - name: enable-video-transcode
          image: alpine:3.24
          command: ["sh", "-c"]
          args:
            - |
              DB=/config/data/jellyfin.db
              MARKER=/config/.claude-migration-transcode-perms
              # One-time migration: guard with a marker file so admin-UI changes
              # to per-user transcoding settings are not reverted on every pod start.
              if [ -f "$MARKER" ]; then echo "Migration already applied, skipping"; exit 0; fi
              if [ ! -f "$DB" ]; then echo "DB not found, skipping"; exit 0; fi
              apk add --no-cache sqlite > /dev/null 2>&1
              # Re-enable video transcoding (Kind=9=EnableVideoPlaybackTranscoding) for all users.
              # Previously disabled to work around Apple TV "Stopped at 0ms" cold-start, but that
              # is now solved by HEVC hardware decoding via QSV (see patch-network-config above).
              sqlite3 "$DB" "UPDATE Permissions SET Value = 1 WHERE Kind = 9;"
              touch "$MARKER"
              echo "Done: video transcoding re-enabled for all users"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          securityContext:
            # Not privileged: QSV transcoding only needs the world-writable
            # /dev/dri/renderD128 hostPath mount, no extra capabilities.
            # privileged MUST stay explicitly false: the live object once had
            # privileged: true, and with server-side apply an omitted field
            # is retained, not removed — the merge produced the invalid combo
            # privileged=true + allowPrivilegeEscalation=false and wedged the
            # app in ComparisonError.
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "https://jelly.yornik.eu"
            - name: LIBVA_DRIVERS_PATH
              value: /usr/lib/jellyfin-ffmpeg/lib/dri
            - name: LIBVA_DRIVER_NAME
              value: iHD
            - name: LD_LIBRARY_PATH
              value: /dvdcss
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /media/movies
              readOnly: true
            - name: series
              mountPath: /media/series
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: dri
              mountPath: /dev/dri
            - name: dvdcss
              mountPath: /dvdcss
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: movies
          persistentVolumeClaim:
            claimName: jellyfin-movies
        - name: series
          persistentVolumeClaim:
            claimName: jellyfin-series
        - name: cache
          emptyDir: {}
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: dvdcss
          emptyDir: {}
