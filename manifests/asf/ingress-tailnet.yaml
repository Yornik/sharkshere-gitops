apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asf-tailnet
  namespace: asf
  annotations:
    # The proxy serves port 443 only. Without the redirect, an http://
    # address times out instead of reaching the HTTPS one.
    tailscale.com/http-redirect: "true"
spec:
  # The Tailscale operator runs 1 proxy device for this Ingress. The proxy
  # ends TLS with a certificate for the ts.net name and sends plain HTTP to
  # the ASF IPC port. ASF has no reason to be on the internet, so there is no
  # public route. IPCPassword still guards the interface.
  # See docs/runbooks/tailnet-only-admin-uis.md.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: asf
      port:
        number: 1242
  tls:
    # The first label is the device name: asf.hedgehog-wage.ts.net.
    - hosts:
        - asf
