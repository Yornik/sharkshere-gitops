apiVersion: v1
kind: Service
metadata:
  name: asf
  namespace: asf
  labels:
    app: asf
# No external-dns annotation. The UI is on the tailnet only, through
# ingress-tailnet.yaml. ExternalDNS runs with --policy=upsert-only, so an
# annotation here would recreate a public record that was deleted by hand.
spec:
  selector:
    app: asf
  ports:
    - name: ipc
      port: 1242
      targetPort: ipc
      protocol: TCP
