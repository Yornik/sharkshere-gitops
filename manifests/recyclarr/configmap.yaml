apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: jellyfin
data:
  # Two TRaSH Guides profiles in Sonarr and in Radarr. Recyclarr creates them
  # and their custom formats, and does not change the other profiles.
  #
  # - `Remux 2160p (Alternative)` for films and normal series. It aims for a
  #   2160p remux and falls back to 2160p Bluray or WEB, then 1080p and 720p,
  #   so a title without a 4K release still downloads.
  # - `[Anime] Remux-1080p` for anime. Most anime 2160p releases are
  #   upscales, so it stops at 1080p. `Dubs Only` gets -10000, so a release
  #   always has the Japanese audio. `Anime Dual Audio` keeps the TRaSH
  #   score of 0: a release with an English dub is not preferred.
  #
  # The `Unwanted Formats` group gives -10000 to BR-DISK, LQ groups,
  # upscales and 3D, so neither profile takes them. `Golden Rule UHD` refuses
  # x265 encodes of 1080p sources.
  #
  # Recyclarr also applies these TRaSH Guides settings to the whole app:
  #
  # - `quality_definition` sets the size limits of every quality. The maximum
  #   is unlimited for all of them. The minimum refuses fake releases that
  #   are too small for their quality. Sonarr uses the `anime` sizes, because
  #   the `series` minimums refuse small anime WEB episodes.
  # - `propers_and_repacks: do_not_prefer` lets the Repack custom formats
  #   decide, instead of a proper that always wins.
  # - `media_naming` adds the TMDB or TVDB ID to the folder names, so Jellyfin
  #   matches new titles without guessing. It changes the names of new
  #   imports only. To rename existing files, use Rename Files in the app.
  #
  # NOTE: The anime profile sets a minimum custom format score of 100. A
  # release from a group that the TRaSH tiers do not know is refused.
  #
  # NOTE: Instance names must be unique across Sonarr and Radarr.
  recyclarr.yml: |
    sonarr:
      sonarr-main:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY
        quality_profiles:
          - trash_id: 361717d531db5a6002e0f547ace46551 # Remux 2160p (Alternative)
            reset_unmatched_scores:
              enabled: true
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true
        quality_definition:
          type: anime
        media_management:
          propers_and_repacks: do_not_prefer
        media_naming:
          series: jellyfin-tvdb
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default
        custom_format_groups:
          add:
            - trash_id: e3f37512790f00d0e89e54fe5e790d1c # [Optional] Golden Rule UHD
            - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats

    radarr:
      radarr-main:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY
        quality_profiles:
          - trash_id: dd3cd75deb9645bae838d1c5da6388d5 # Remux 2160p (Alternative)
            reset_unmatched_scores:
              enabled: true
          - trash_id: 722b624f9af1e492284c4bc842153a38 # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true
        quality_definition:
          type: movie
        media_management:
          propers_and_repacks: do_not_prefer
        media_naming:
          folder: jellyfin-tmdb
          movie:
            rename: true
            standard: jellyfin-tmdb
        custom_format_groups:
          add:
            - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # [Optional] Golden Rule UHD
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
