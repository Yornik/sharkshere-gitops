apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-config-ssd
  namespace: jellyfin
spec:
  # Recyclarr keeps the IDs of the custom formats it created in /config/state.
  # Without that state, the next run sees its own custom formats as foreign
  # and stops updating them.
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-ssd
  resources:
    requests:
      storage: 1Gi
