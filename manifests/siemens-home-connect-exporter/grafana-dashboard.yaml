    tags\": [\n    \"homeconnect\",\n    \"siemens\",\n    \"appliances\"\n  ],\n  \"timezone\": \"Europe/Amsterdam\",\n \
    \ \"editable\": false,\n  \"graphTooltip\": 1,\n  \"style\": \"dark\",\n  \"refresh\": \"30s\",\n  \"schemaVersion\":\
    \ 39,\n  \"time\": {\n    \"from\": \"now-24h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n  \
    \    {\n        \"name\": \"datasource\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\",\n   \
