    \  \"sort\": 1,\n        \"current\": {\n          \"text\": \"All\",\n          \"value\": \"$__all\"\n        }\n  \
    \    }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Needs attention\"\
