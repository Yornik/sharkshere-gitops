apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dirigera-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dirigera-exporter
      app.kubernetes.io/instance: dirigera-exporter
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      metricRelabelings:
        # Every new pod gets a new name and IP. With these labels, each pod
        # change starts new series, and the dashboard shows broken lines: 6
        # pods in 53 days until 2026-10-24. Without them, the series
        # continue. The Deployment uses Recreate, so a rollout never runs 2
        # pods. After an eviction, the old pod can still stop while the new
        # pod starts. For about 1 scrape, samples from both pods then go into
        # the same series. Both pods read the same hub, so the values agree.
        # The `up` series keeps both labels.
        - action: labeldrop
          regex: pod|instance
