apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.yornik.eu`)
      kind: Rule
      middlewares:
        - name: gitlab-hsts
          namespace: gitlab
      services:
        # 8181 = workhorse port — handles git push/pull, LFS, large uploads,
        # and reverse-proxies to webservice (8080) for the Rails app. Always
        # ingress through workhorse; 8080 bypasses size limits + streaming.
        - name: gitlab-webservice-default
          port: 8181
  tls:
    certResolver: letsencrypt
