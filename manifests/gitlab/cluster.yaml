apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitlab-pg
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 3
  # On an image change, CNPG updates the replicas first. With `switchover`
  # it then moves the primary role to an updated replica and updates the old
  # primary as a replica. With the default `restart`, the primary waited up
  # to smartShutdownTimeout (180 s) for its client connections, so each
  # primary was down for about 3.5 minutes on 2026-10-29. See
  # docs/tech/database.md.
  primaryUpdateMethod: switchover
  # The Postgres image comes from the ClusterImageCatalog of CNPG
  # (manifests/cnpg-catalog), not from a tag in this file. The cluster names
  # only its major version. The catalog maps that major to the current image.
  # See docs/incidents/2026-10-29-cnpg-image-frozen-at-creation.md.
  #
  # NOTE: a change of `major` is an offline in-place upgrade. CNPG stops the
  # cluster and runs pg_upgrade. Change 1 cluster at a time, and follow the
  # steps in the incident write-up (ANALYZE, new base backup).
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-system-trixie
    major: 18
  storage:
    storageClass: truenas-ssd-iscsi
    size: 20Gi
  walStorage:
    storageClass: truenas-ssd-iscsi
    size: 10Gi
  # Requests sized from observed usage (~75-260Mi, <40m CPU; GitLab is the
  # busiest DB) + headroom so the pods get Burstable QoS instead of BestEffort
  # (first evicted under memory pressure). Memory limit ~2x request and well
  # above shared_buffers (256MB) + work_mem headroom. No CPU limit: throttling
  # a DB is worse than sharing.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  postgresql:
    parameters:
      shared_buffers: 256MB
      work_mem: 16MB
      effective_cache_size: 1GB
  bootstrap:
    initdb:
      database: gitlabhq_production
      owner: gitlab
  monitoring:
    # Deprecated in CNPG; will be removed. We ship our own PodMonitor in
    # podmonitor.yaml so we control the release label Prometheus filters on.
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gitlab-pg-store
        serverName: gitlab-pg
