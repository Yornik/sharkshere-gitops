apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-registry
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.git.yornik.eu`)
      kind: Rule
      middlewares:
        - name: gitlab-hsts
          namespace: gitlab
        # Shared edge rate limit — defense-in-depth only; the registry auths
        # through GitLab (JWT), which has app-level throttling. Deliberately
        # NO fail2ban: docker clients legitimately get 401 challenges on
        # every pull before token exchange, so a 401-based ban rule would
        # ban CI runners and normal docker pulls.
        - name: rate-limit
          namespace: traefik
      services:
        - name: gitlab-registry
          port: 5000
  tls:
    certResolver: letsencrypt
