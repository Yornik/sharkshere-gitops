apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-tailnet
  namespace: monitoring
  annotations:
    # The proxy serves port 443 only. Without the redirect, an http://
    # address times out instead of reaching the HTTPS one.
    tailscale.com/http-redirect: "true"
spec:
  # The Tailscale operator runs 1 proxy device for this Ingress. The proxy
  # ends TLS with a certificate for the ts.net name and sends plain HTTP to
  # Grafana. The old Service proxy served HTTP only, and browsers that try
  # HTTPS first timed out. See docs/runbooks/tailnet-only-admin-uis.md.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-grafana
      port:
        number: 80
  tls:
    # The first label is the device name: grafana.hedgehog-wage.ts.net.
    # The operator ignores tailscale.com/hostname on an Ingress.
    - hosts:
        - grafana
