apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager-tailnet
  namespace: monitoring
  annotations:
    # The proxy serves port 443 only. Without the redirect, an http://
    # address times out instead of reaching the HTTPS one.
    tailscale.com/http-redirect: "true"
spec:
  # The alert e-mail links to this address (alertmanagerSpec.externalUrl in
  # apps/values.yaml). Before 2026-10-21 the link named the in-cluster
  # Service, which no browser can resolve. See
  # docs/runbooks/tailnet-only-admin-uis.md.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-alertmanager
      port:
        number: 9093
  tls:
    # The first label is the device name: alertmanager.hedgehog-wage.ts.net.
    # The operator ignores tailscale.com/hostname on an Ingress.
    - hosts:
        - alertmanager
