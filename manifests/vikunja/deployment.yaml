apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
  labels:
    app: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.1.0
          ports:
            - name: http
              containerPort: 3456
              protocol: TCP
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: "https://todo.yornik.eu"
            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: "true"
            - name: VIKUNJA_SERVICE_JWTSECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-secrets
                  key: VIKUNJA_SERVICE_JWTSECRET
            - name: VIKUNJA_MAILER_ENABLED
              value: "true"
            - name: VIKUNJA_MAILER_HOST
              value: "smtp.resend.com"
            - name: VIKUNJA_MAILER_PORT
              value: "465"
            - name: VIKUNJA_MAILER_USERNAME
              value: "resend"
            - name: VIKUNJA_MAILER_FROMEMAIL
              value: "noreply@fedishark.eu"
            - name: VIKUNJA_MAILER_FORCESSL
              value: "true"
            - name: VIKUNJA_MAILER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vikunja-secrets
                  key: VIKUNJA_MAILER_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: files
              mountPath: /app/vikunja/files
            - name: db
              mountPath: /db
            - name: cache
              mountPath: /.cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: vikunja-files
        - name: db
          persistentVolumeClaim:
            claimName: vikunja-db
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
