apiVersion: apps/v1
kind: Deployment
metadata:
  name: tibber-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tibber-exporter
    app.kubernetes.io/instance: tibber-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tibber-exporter
      app.kubernetes.io/instance: tibber-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tibber-exporter
        app.kubernetes.io/instance: tibber-exporter
    spec:
      containers:
        - name: tibber-exporter
          # Fork of terjesannum/tibber-exporter adding 15-min (quarter-hourly)
          # price resolution. Source + CI: github.com/Yornik/tibber-exporter
          image: ghcr.io/yornik/tibber-exporter:v1.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --live
            - "8e35be0e-5303-40a1-920e-104eb9765346"
          env:
            - name: TIBBER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tibber-api
                  key: token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
          resources:
            # No cpu limit by design - see fedishark/deployment.yaml for the full
            # reasoning. Not yet over the 25% alert threshold, but this is the same
            # Go-exporter shape as dirigera/graphite (identical 100m limit, 10m
            # request) and throttles for the same reason; fixed pre-emptively rather
            # than waiting for it to trip the alert. The memory limit stays.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
