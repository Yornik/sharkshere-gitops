apiVersion: apps/v1
kind: Deployment
metadata:
  name: tibber-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tibber-exporter
    app.kubernetes.io/instance: tibber-exporter
spec:
  replicas: 1
  # The exporter holds 1 live websocket for the Tibber token. With
  # RollingUpdate, the new pod opens a second subscription before the old pod
  # stops. The ServiceMonitor also drops the pod label, so 2 pods would send
  # the same series. Recreate keeps exactly 1 pod.
  # On 2026-10-25 the live Deployment held the rollingUpdate block that the
  # API server adds by default. argocd-controller owns it with an Update.
  # ArgoCD diffs with a server-side apply (controller.diff.server.side), and
  # that apply does not remove the block. The API server then rejects
  # Recreate with "spec.strategy.rollingUpdate: Forbidden", and the whole
  # Application stops syncing. Remove the block 1 time by hand, as in part 2
  # of docs/incidents/2026-09-08-gitlab-valkey-rollingupdate-multi-attach.md.
  # dirigera-exporter needed the same patch on 2026-10-24.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tibber-exporter
      app.kubernetes.io/instance: tibber-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tibber-exporter
        app.kubernetes.io/instance: tibber-exporter
    spec:
      containers:
        - name: tibber-exporter
          # Fork of terjesannum/tibber-exporter adding 15-min (quarter-hourly)
          # price resolution. Source + CI: github.com/Yornik/tibber-exporter
          image: ghcr.io/yornik/tibber-exporter:v1.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --live
            - "8e35be0e-5303-40a1-920e-104eb9765346"
          env:
            - name: TIBBER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tibber-api
                  key: token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /healthz (from v1.2.0) answers while the HTTP listener runs and
          # does not depend on Tibber, so a Tibber outage neither restarts
          # the pod nor takes it out of service. The alerts in
          # manifests/monitoring/prometheusrule-tibber.yaml watch the data.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
          resources:
            # No cpu limit by design - see fedishark/deployment.yaml for the full
            # reasoning. Not yet over the 25% alert threshold, but this is the same
            # Go-exporter shape as dirigera/graphite (identical 100m limit, 10m
            # request) and throttles for the same reason; fixed pre-emptively rather
            # than waiting for it to trip the alert. The memory limit stays.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
