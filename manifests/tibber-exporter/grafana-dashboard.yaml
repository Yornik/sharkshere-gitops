---
# The Tibber dashboard. Source: Yornik/tibber-grafana-dashboard, dashboard.json.
# This copy differs from the source in 4 places: UID 5rT8QDiVk (the UID this
# Grafana has always used), time zone Europe/Amsterdam (the source uses the
# browser's), editable false, and a hidden data source variable.
# Grafana aligns 1d query steps to the viewer's current UTC offset, not to the
# offset of each day, so a step can sit 1 hour before or after local midnight.
# The per-day panels take max_over_time(...[1d:1m] offset -25h) of the
# since-midnight totals: the window starts 1 hour after the step, which gives
# the right total at any of these alignments, also on the 23- and 25-hour
# days. Today's bar appears 1 hour after local midnight.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tibber-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  dashboard.json: |-
    {
      "uid": "5rT8QDiVk",
      "title": "Tibber",
      "description": "Tibber power, price and cost for one home. Phone first; the meter values (Power now, Today so far, Phase current now) go blank when the meter feed stops. Exporter alerts (needs kube-prometheus alert rules) can be turned on under Settings > Annotations.",
      "tags": [
        "home",
        "energy"
      ],
      "timezone": "Europe/Amsterdam",
      "editable": false,
      "graphTooltip": 1,
      "refresh": "1m",
      "schemaVersion": 41,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "30s",
          "1m",
          "5m",
          "15m"
        ]
      },
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "weekStart": "monday",
      "links": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Feed gaps",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(137, 135, 129, 0.7)",
            "filter": {
              "exclude": false,
              "ids": [
                8,
                9,
                13,
                15,
                16
              ]
            },
            "expr": "max_over_time((absent_over_time(tibber_power_consumption{home_id=\"$home\"}[90s]))[$__interval:1m])",
            "step": "1m",
            "titleFormat": "No meter readings",
            "textFormat": "No reading in the 90 s before this point",
            "useValueForTime": false
          },
          {
            "name": "Exporter alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": false,
            "hide": true,
            "iconColor": "rgba(137, 135, 129, 0.7)",
            "filter": {
              "exclude": false,
              "ids": [
                8,
                9,
                13,
                15,
                16
              ]
            },
            "expr": "max by (alertname) (ALERTS{alertstate=\"firing\",container=\"tibber-exporter\"} or ALERTS{alertstate=\"firing\",pod=~\"tibber-exporter.*\"} or ALERTS{alertstate=\"firing\",job=\"tibber-exporter\"} or ALERTS{alertstate=\"firing\",deployment=\"tibber-exporter\"})",
            "step": "1m",
            "titleFormat": "{{alertname}}",
            "useValueForTime": false
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 2,
            "current": {},
            "regex": "",
            "includeAll": false,
            "multi": false,
            "options": []
          },
          {
            "name": "home",
            "label": "Home",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "tibber_home_info",
            "query": {
              "query": "tibber_home_info",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "hide": 0,
            "current": {},
            "options": [],
            "includeAll": false,
            "multi": false,
            "regex": "/.*home_id=\"(?<value>[^\"]+)(?:.*name=\"(?<text>[^\"]+))?/",
            "sort": 0,
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "",
          "description": "Is the meter data live? Live: the newest reading is under 2 min old (normal is 10 to 40 s). Delayed: 2 to 5 min. Stopped: older than 5 min. From 2 min the meter values on this page (Power now, Today so far, Phase current now) are blank instead of showing an old number. With an absolute time range (for example after zooming) this shows the state at the end of the range.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 2
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "time() - (max(timestamp(tibber_power_consumption{home_id=\"$home\"})) or max(max_over_time(timestamp(tibber_power_consumption{home_id=\"$home\"})[24h:1m])))",
              "editorMode": "code",
              "range": false,
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "time() - (max(timestamp(tibber_power_consumption{home_id=\"$home\"})) or max(max_over_time(timestamp(tibber_power_consumption{home_id=\"$home\"})[24h:1m])))",
              "editorMode": "code",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  }
                ]
              },
              "decimals": 0,
              "noValue": "No reading in 24 h"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Meter feed"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "transparent",
                          "value": null
                        },
                        {
                          "color": "#fab219",
                          "value": 120
                        },
                        {
                          "color": "#d03b3b",
                          "value": 300
                        }
                      ]
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "range",
                        "options": {
                          "from": 0,
                          "to": 119.999,
                          "result": {
                            "text": "● Live",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "range",
                        "options": {
                          "from": 120,
                          "to": 299.999,
                          "result": {
                            "text": "◐ Delayed",
                            "index": 1
                          }
                        }
                      },
                      {
                        "type": "range",
                        "options": {
                          "from": 300,
                          "to": 1000000000000.0,
                          "result": {
                            "text": "○ Stopped",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "noValue",
                    "value": "○ No reading in 24 h"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Since last reading"
                  },
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "transparent"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background_solid",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "showPercentChange": false,
            "text": {
              "titleSize": 12,
              "valueSize": 18
            }
          },
          "transparent": true,
          "timeFrom": "15m",
          "hideTimeOverride": true
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Power now",
          "description": "Power drawn from the grid, newest meter reading. Blank ('No reading') once the newest reading is 2 min old, so a stopped feed never looks like a live value. With an absolute time range (for example after zooming) this shows the state at the end of the range.",
          "gridPos": {
            "x": 0,
            "y": 2,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "max by (home_id) (tibber_power_consumption{home_id=\"$home\"} and on(pod) topk(1, timestamp(tibber_power_consumption{home_id=\"$home\"}) > time() - 120))",
              "editorMode": "code",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "No reading",
              "displayName": "Power"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "showPercentChange": false,
            "text": {
              "titleSize": 13,
              "valueSize": 48
            }
          },
          "timeFrom": "15m",
          "hideTimeOverride": true
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Price now",
          "description": "Price per kWh incl. tax of the current 15-minute slot (the exporter shows a new slot 0.5 to 2 min after it starts). Now and In 1 hour: Tibber's level for the current slot and for the slot that starts 60 min from now, relative to recent prices. 'No price' when the exporter is not scraped. With an absolute time range (for example after zooming) this shows the state at the end of the range.",
          "gridPos": {
            "x": 6,
            "y": 2,
            "w": 9,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "max by (home_id) (tibber_power_price{home_id=\"$home\",type=\"total\"})",
              "editorMode": "code",
              "range": false,
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "max by (home_id) (tibber_power_price_level{home_id=\"$home\"})",
              "editorMode": "code",
              "range": false,
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "C",
              "expr": "max by (home_id) (tibber_power_price_level_next_hour{home_id=\"$home\"})",
              "editorMode": "code",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  }
                ]
              },
              "noValue": "No price"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Per kWh"
                  },
                  {
                    "id": "unit",
                    "value": "currencyEUR"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "transparent"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Now"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "Very cheap",
                            "color": "rgba(111, 102, 248, 0.28)",
                            "index": 0
                          },
                          "2": {
                            "text": "Cheap",
                            "color": "rgba(11, 135, 208, 0.16)",
                            "index": 1
                          },
                          "3": {
                            "text": "Normal",
                            "color": "transparent",
                            "index": 2
                          },
                          "4": {
                            "text": "Expensive",
                            "color": "rgba(199, 90, 5, 0.16)",
                            "index": 3
                          },
                          "5": {
                            "text": "Very expensive",
                            "color": "rgba(220, 63, 99, 0.28)",
                            "index": 4
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "C"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "In 1 hour"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "Very cheap",
                            "color": "rgba(111, 102, 248, 0.28)",
                            "index": 0
                          },
                          "2": {
                            "text": "Cheap",
                            "color": "rgba(11, 135, 208, 0.16)",
                            "index": 1
                          },
                          "3": {
                            "text": "Normal",
                            "color": "transparent",
                            "index": 2
                          },
                          "4": {
                            "text": "Expensive",
                            "color": "rgba(199, 90, 5, 0.16)",
                            "index": 3
                          },
                          "5": {
                            "text": "Very expensive",
                            "color": "rgba(220, 63, 99, 0.28)",
                            "index": 4
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background_solid",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "showPercentChange": false,
            "text": {
              "titleSize": 13,
              "valueSize": 26
            }
          },
          "timeFrom": "15m",
          "hideTimeOverride": true
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Today so far",
          "description": "Since local midnight, from the exporter's day counters. Paid per kWh is cost divided by energy; it stays blank until 0.1 kWh is used. Blank ('No reading') when the newest reading is more than 2 min old. With an absolute time range (for example after zooming) this shows the state at the end of the range.",
          "gridPos": {
            "x": 15,
            "y": 2,
            "w": 9,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "max by (home_id) (tibber_power_consumption_day_total{home_id=\"$home\"} and on(pod) topk(1, timestamp(tibber_power_consumption{home_id=\"$home\"}) > time() - 120))",
              "editorMode": "code",
              "range": false,
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "max by (home_id) (tibber_power_cost_day{home_id=\"$home\"} and on(pod) topk(1, timestamp(tibber_power_consumption{home_id=\"$home\"}) > time() - 120))",
              "editorMode": "code",
              "range": false,
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "C",
              "expr": "max by (home_id) (tibber_power_cost_day{home_id=\"$home\"} and on(pod) topk(1, timestamp(tibber_power_consumption{home_id=\"$home\"}) > time() - 120)) / (max by (home_id) (tibber_power_consumption_day_total{home_id=\"$home\"} and on(pod) topk(1, timestamp(tibber_power_consumption{home_id=\"$home\"}) > time() - 120)) > 0.1)",
              "editorMode": "code",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "No reading"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Energy"
                  },
                  {
                    "id": "unit",
                    "value": "kwatth"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Cost"
                  },
                  {
                    "id": "unit",
                    "value": "currencyEUR"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "C"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Paid per kWh"
                  },
                  {
                    "id": "unit",
                    "value": "currencyEUR"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  },
                  {
                    "id": "noValue",
                    "value": "Under 0.1 kWh"
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "showPercentChange": false,
            "text": {
              "titleSize": 13,
              "valueSize": 26
            }
          },
          "timeFrom": "now/d",
          "hideTimeOverride": true
        },
        {
          "id": 5,
          "type": "table",
          "title": "Next hour, per quarter",
          "description": "The 15-minute slots that start in the next hour, with the price and level Tibber announced for them. Prometheus holds prices only 60 min ahead, so this is as far as the page can see. For up to 2 min after a quarter starts the last row can still show the previous slot. Not affected by the selected range; empty for an absolute range.",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "max by (home_id) (last_over_time(tibber_power_price_next_hour{home_id=\"$home\",type=\"total\"}[15m] offset 45m)) and on() (vector(time()) > ${__from:date:seconds}) and on() (vector($__range_s) == 3600)",
              "editorMode": "code",
              "range": true,
              "instant": false,
              "legendFormat": "Price",
              "interval": "15m",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "max by (home_id) (last_over_time(tibber_power_price_level_next_hour{home_id=\"$home\"}[15m] offset 45m)) and on() (vector(time()) > ${__from:date:seconds}) and on() (vector($__range_s) == 3600)",
              "editorMode": "code",
              "range": true,
              "instant": false,
              "legendFormat": "Level",
              "interval": "15m",
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "Shown when the range ends now"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Starts"
                  },
                  {
                    "id": "unit",
                    "value": "time:HH:mm"
                  },
                  {
                    "id": "custom.width",
                    "value": 70
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Per kWh"
                  },
                  {
                    "id": "unit",
                    "value": "currencyEUR"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  },
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Level"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
