apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: go-practice
  namespace: go-practice
spec:
  entryPoints:
    - websecure
  routes:
    # The site is on vesper-labs.org. go-learn.party, the old host, only
    # redirects here: see ingressroute-go-learn.yaml.
    #
    # DNS must resolve before this route exists. Traefik tries a failed ACME
    # order again only when its dynamic configuration changes, not on a
    # timer, so a route that comes first can stay without a certificate. The
    # certificate of vesper-labs.org was ordered before this route, through
    # the temporary route of the move. See "How to move the site to
    # vesper-labs.org" in docs/runbooks/go-practice.md.
    #
    # Order of the middlewares, for each route (REVIEW.md B8):
    #   1. security-headers first, so a ban (403) or a rate limit (429) also
    #      gets HSTS, nosniff and frameDeny.
    #   2. fail2ban and rate-limit next. Each one can end the chain.
    #   3. no-compression last. It changes the request only.
    # No middleware here authenticates. The app does that.
    #
    # No CSP middleware: the app sets its own Content-Security-Policy on each
    # HTML response. 2 policies on 1 response give the intersection, and the
    # app policy has the worker-src that the Monaco editor needs.
    #
    # no-compression: test results come back as an NDJSON stream, 1 line for
    # each test event. A compressed response holds lines back until its buffer
    # is full, and the test tree in the IDE stops moving.

    # The auth API: passkey login, sign-up, recovery and passkey management.
    # fail2ban watches this route only. See middleware-fail2ban.yaml.
    - match: Host(`vesper-labs.org`) && PathPrefix(`/api/auth/`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: fail2ban-go-practice
          namespace: go-practice
        - name: rate-limit
          namespace: traefik
        - name: no-compression
          namespace: traefik
      services:
        - name: go-practice-web
          port: 8080

    # Everything else: the same chain without fail2ban.
    - match: Host(`vesper-labs.org`)
      kind: Rule
      priority: 1
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: no-compression
          namespace: traefik
      services:
        - name: go-practice-web
          port: 8080
  tls:
    certResolver: letsencrypt
