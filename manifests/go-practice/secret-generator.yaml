apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: go-practice-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # SOPS encrypts YAML comments with the values, so the notes about the 2 files
  # are here.
  #
  # secret-web.enc.yaml     Secret/go-practice-web in namespace go-practice.
  #
  #                           GPW_RUNNER_TOKEN   the bearer token for the
  #                                              runner, 64 hex characters
  #                                              from `openssl rand -hex 32`
  #                           GPW_SMTP_PASSWORD  the Resend API key, copied
  #                                              from SMTP_PASSWORD in
  #                                              ../soiree/soiree-app.enc.yaml.
  #                                              Rotate the 2 together. It is
  #                                              REPLACE_ME until an operator
  #                                              copies it. Until then the app
  #                                              writes each mail to the log
  #                                              and sends nothing.
  #
  # secret-runner.enc.yaml  Secret/go-practice-runner in namespace
  #                         go-practice-runner.
  #
  #                           GPR_TOKEN          the same value as
  #                                              GPW_RUNNER_TOKEN
  #
  # The runner token is in 2 files. A pod reads a Secret only from its own
  # namespace, and the runner has a namespace of its own. If the 2 values
  # differ, each request from the web server to the runner gets 401, and the
  # IDE reports that the runner is down.
  #
  # The token was made on 2026-10-17. It lets a caller run code on the runner
  # and nothing more. To copy the Resend key or to rotate the token, see
  # docs/runbooks/go-practice.md.
  #
  # Edit with: sops manifests/go-practice/<file>.enc.yaml
  - ./secret-web.enc.yaml
  - ./secret-runner.enc.yaml
