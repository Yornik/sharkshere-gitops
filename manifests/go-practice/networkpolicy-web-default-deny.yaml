# NetworkPolicy has an effect only if the CNI plugin of the cluster enforces it.
# The CNI is Flannel, and Flannel does not enforce NetworkPolicy (checked on
# 2026-10-17, see docs/tech/README.md). These policies take effect only after a
# change to a CNI that enforces them. Treat them as defense in depth. Do not
# depend on them. To check the CNI again, see docs/runbooks/go-practice.md.
#
# No ingress and no egress for any pod in this namespace, except what
# networkpolicy-web-ingress.yaml and networkpolicy-web-egress.yaml allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: go-practice
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
