# Temporary. The route change of the move removes this file and
# middleware-redirect-go-learn.yaml. See "How to move the site to
# vesper-labs.org" in docs/runbooks/go-practice.md.
#
# This route makes Traefik order the certificate of vesper-labs.org before the
# route change. A failed order then leaves go-learn.party as it is, and the
# site stays up there. Traefik v3.7.4 tries a failed order again only when its
# dynamic configuration changes, not on a timer.
#
# The route does not serve the site. Until the route change, the WebAuthn
# relying party and the Origin check of the app are go-learn.party, so a
# sign-in or a form on another host fails. Each request goes back to
# go-learn.party instead, and the app gets no request from this host.
#
# Only websecure. The redirection of the web entry point in apps/values.yaml
# (priority MaxInt - 1) sends http://vesper-labs.org to https. The ACME
# HTTP-01 challenge has a router of its own with priority MaxInt, so the
# challenge path on port 80 reaches Traefik and is not redirected.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vesper-labs-temporary
  namespace: go-practice
spec:
  entryPoints:
    - websecure
  routes:
    # Order of the middlewares (REVIEW.md B8):
    #   1. security-headers first, so the redirect gets HSTS for this host.
    #   2. rate-limit next. It can end the chain with 429.
    #   3. redirect-go-learn last. It answers each request, so the service
    #      below gets none. An IngressRoute needs a service on each route.
    # No fail2ban: a redirect does not answer 401 to 403, so it counts
    # nothing. /.well-known/security.txt and /.well-known/pgp-key.txt do not
    # reach this route: the security-txt route in traefik-config has priority
    # 9999 on every host. Until the route change, that file has no Canonical
    # line for vesper-labs.org.
    - match: Host(`vesper-labs.org`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: redirect-go-learn
          namespace: go-practice
      services:
        - name: go-practice-web
          port: 8080
  # The same resolver and TLS options as ingressroute.yaml. The route change
  # then uses the certificate that this order stores in acme.json.
  tls:
    certResolver: letsencrypt
