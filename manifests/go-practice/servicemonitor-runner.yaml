apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-practice-runner
  namespace: go-practice-runner
  labels:
    app.kubernetes.io/name: go-practice-runner
    app.kubernetes.io/instance: go-practice-runner
    # Without this label Prometheus ignores the monitor, with no error. See
    # docs/incidents/2026-09-09-prometheus-release-label-selector.md.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-practice-runner
      app.kubernetes.io/instance: go-practice-runner
  namespaceSelector:
    matchNames:
      - go-practice-runner
  endpoints:
    # networkpolicy-runner-allow-monitoring.yaml lets Prometheus reach this
    # port and no other port of the runner.
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
