# Temporary, with ingressroute-vesper-labs-temporary.yaml. The route change of
# the move removes both files.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-go-learn
  namespace: go-practice
spec:
  # Each request to vesper-labs.org goes to the same path and query on
  # go-learn.party, where the site runs until the route change.
  #
  # The router already selects the host, so the regex takes any host and any
  # port, as in a Host header such as vesper-labs.org:443.
  #
  # permanent: false gives 302 to GET and 307 to every other method, HEAD
  # included. That is the code of Traefik v3.7.4, in
  # pkg/middlewares/redirect/redirect.go. A browser does not store a 302 or a
  # 307 that has no Cache-Control or Expires header (RFC 9111, 4.2.2), and no
  # middleware on the route adds one. This is necessary: the route change
  # makes go-learn.party redirect to vesper-labs.org, so a stored redirect
  # from here would make a loop.
  redirectRegex:
    regex: ^https?://[^/]+(.*)
    replacement: https://go-learn.party${1}
    permanent: false
