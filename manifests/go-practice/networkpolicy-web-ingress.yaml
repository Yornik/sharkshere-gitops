# Traefik reaches the site, and Prometheus reaches the metrics. See
# networkpolicy-web-default-deny.yaml for the CNI that this needs. The kubelet
# probes come from the node, and NetworkPolicy does not block traffic between a
# pod and its own node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-practice-web-ingress
  namespace: go-practice
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: go-practice-web
      app.kubernetes.io/instance: go-practice-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
