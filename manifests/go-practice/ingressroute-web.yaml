apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: go-practice-web
  namespace: go-practice
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`vesper-labs.org`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: go-practice
      services:
        - name: go-practice-web
          port: 8080
