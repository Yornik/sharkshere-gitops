apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: matrix-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # All three files below hold real values. SOPS encrypts YAML comments along
  # with everything else, so notes about them live here rather than inside.
  #
  # tuwunel-app.enc.yaml
  #                       Secret/tuwunel-app. One value, filled in with a
  #                       real one:
  #
  #                         REGISTRATION_TOKEN   gates the public /register
  #                                              endpoint. Tell it to nobody
  #                                              you would not let create
  #                                              an account; rotate with a
  #                                              new random value whenever
  #                                              someone should no longer
  #                                              be able to invite people.
  #
  # heisenbridge-registration.enc.yaml
  #                       Secret/heisenbridge-registration, one key
  #                       heisenbridge-registration.yaml. The appservice
  #                       registration file, in the shape `heisenbridge
  #                       --generate-compat` writes (the Conduit-family
  #                       variant, per upstream __main__.py): id, url, the
  #                       two tokens, rate_limited false, sender_localpart
  #                       heisenbridge, and BOTH exclusive user namespaces
  #                       - @irc_.* for the puppets, @heisenbridge:.* so
  #                       Conduit-family servers accept the bridge's own
  #                       user. The url names the in-cluster Service, not
  #                       a public host, so the homeserver does not push
  #                       transactions over the edge or through Traefik.
  #
  #                       The SAME Secret is mounted by both Deployments:
  #                       /appservices in tuwunel (TUWUNEL_APPSERVICE_DIR)
  #                       and /config in heisenbridge (-c). One file is
  #                       the only way as_token and hs_token cannot drift
  #                       between the two halves of the bridge.
  #
  #                       To rotate: generate two new tokens, put them in
  #                       both keys of the same registration, and restart
  #                       both Deployments in one change. The bridge state
  #                       lives in rooms, so nothing else moves.
  #
  # secret-s3-wal.enc.yaml
  #                       Secret/cnpg-s3-wal: the Hetzner Object Storage
  #                       credentials Tuwunel stores media with. The name
  #                       and the key names (ACCESS_KEY_ID,
  #                       ACCESS_SECRET_KEY) stay the ones shared-pg,
  #                       openproject, gitlab and soiree each hold, so the
  #                       documented reuse procedure stays exact:
  #
  #                         sops -d manifests/shared-pg/secret.enc.yaml \
  #                           | sed 's/namespace: shared-pg/namespace: matrix/' \
  #                           > manifests/matrix/secret-s3-wal.enc.yaml
  #                         sops encrypt -i manifests/matrix/secret-s3-wal.enc.yaml
  #
  #                       Worth keeping soiree's warning: a Secret that exists
  #                       with wrong values gates nothing. Tuwunel pings
  #                       the bucket at startup and refuses to start with a
  #                       clear error, so a bad copy is loud here, not
  #                       quiet. The media bucket `tuwunel-media` exists
  #                       since 2026-11-28: it was created before this
  #                       change merged, with the same key, and a
  #                       HEAD/list against the endpoint answered 200.
  #                       One key reaches every bucket of the Hetzner
  #                       project, so no second credential exists to copy.
  #
  # element-recovery.enc.yaml
  #                       Secret/element-recovery. 1 value:
  #
  #                         RECOVERY_KEY   the Element Web/Desktop secure
  #                                        backup recovery key of the
  #                                        first admin account
  #                                        (@yorde:finfra.party). It can
  #                                        decrypt every E2E room on the
  #                                        server, so treat it like the
  #                                        S3 keys.
  #
  #                                        ROTATE it if it ever appeared
  #                                        outside this repo (2026-11-28:
  #                                        the first copy was sent over a
  #                                        chat, so rotate it once and
  #                                        update this file over SSH).
  #                                        Element: Settings, Security &
  #                                        Privacy, reset secure backup,
  #                                        then edit with: sops manifests/
  #                                        matrix/element-recovery.enc.yaml
  #
  # Edit with: sops manifests/matrix/<file>.enc.yaml
  - ./tuwunel-app.enc.yaml
  - ./heisenbridge-registration.enc.yaml
  - ./secret-s3-wal.enc.yaml
  - ./element-recovery.enc.yaml
