# Port 80 redirect, same as every other public host in the repo. The
# websecure routes above hold all Matrix traffic; a client that lands on
# plain HTTP is told where the TLS is. Both public hosts of the zone are
# here: an IRC file link opened as plain http://media.finfra.party must
# redirect too, or it answers 404 on the web entrypoint.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix-web
  namespace: matrix
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`finfra.party`) || Host(`media.finfra.party`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: matrix
      services:
        # An IngressRoute needs a service on each route. The redirect answers
        # every request, so no request reaches it.
        - name: tuwunel
          port: 8008
