apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedishark
  namespace: fedishark
  labels:
    app: fedishark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fedishark
  template:
    metadata:
      labels:
        app: fedishark
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/
              readOnly: true
          resources:
            # No cpu limit by design. CFS enforces quota per 100ms period, so a 50m
            # limit granted 5ms per period: nginx drained it on the first request
            # burst and then sat frozen for the remaining 95ms. Measured 80% of
            # periods throttled at ~0% of the quota actually used - pure latency
            # tax on a public site, for nothing. CPU is compressible, so the request
            # below already guarantees a fair share under contention. The memory
            # limit stays: memory is NOT compressible and must keep a hard ceiling.
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: html
          configMap:
            name: fedishark-html
