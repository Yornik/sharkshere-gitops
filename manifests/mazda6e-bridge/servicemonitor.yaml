apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mazda6e-bridge
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mazda6e-bridge
      app.kubernetes.io/instance: mazda6e-bridge
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    # The bridge polls Mazda every 300 s. A 60 s scrape is enough to see each
    # poll. A shorter interval only stores the same value more often.
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
