apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mazda6e-bridge
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mazda6e-bridge
      app.kubernetes.io/instance: mazda6e-bridge
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    # The bridge polls Mazda every 120 s. A 60 s scrape is enough to see each
    # poll. A shorter interval only stores the same value more often.
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
      metricRelabelings:
        # Every new pod gets a new name and IP. With these labels, each pod
        # change starts new series, and the dashboard shows 2 lines or 2
        # bars for the same car. Without them, the series continue. The
        # Deployment uses Recreate, so 2 pods never send the same series.
        # The `up` series keeps both labels.
        - action: labeldrop
          regex: pod|instance
