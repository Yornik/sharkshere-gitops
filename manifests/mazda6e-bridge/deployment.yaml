apiVersion: apps/v1
kind: Deployment
metadata:
  name: mazda6e-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mazda6e-bridge
    app.kubernetes.io/instance: mazda6e-bridge
spec:
  replicas: 1
  # Two pods would log in twice with the same device ID and poll the Mazda
  # cloud twice. Recreate keeps exactly one session during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mazda6e-bridge
      app.kubernetes.io/instance: mazda6e-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mazda6e-bridge
        app.kubernetes.io/instance: mazda6e-bridge
    spec:
      # The bridge talks only to the Mazda cloud. It needs no Kubernetes API access.
      automountServiceAccountToken: false
      containers:
        - name: mazda6e-bridge
          # Read-only exporter for the Mazda 6e cloud API.
          # Source + CI: github.com/Yornik/mazda6e-grafana-bridge
          image: ghcr.io/yornik/mazda6e-grafana-bridge:v1.0.0
          imagePullPolicy: IfNotPresent
          # MAZDA_EMAIL, MAZDA_PASSWORD and MAZDA_DEVICE_ID. Together they are a
          # full login to the Mazda account. Keep them only in the SOPS file.
          envFrom:
            - secretRef:
                name: mazda6e-api
          env:
            - name: POLL_INTERVAL_SECONDS
              value: "300"
            - name: LISTEN_PORT
              value: "9120"
            # On for the "Last known position" panel on the dashboard. /metrics
            # has no authentication, so the Service stays ClusterIP. Do not add
            # an IngressRoute for this port. Prometheus keeps each position for
            # its 60 d retention, so the data is a 60-day trip history.
            - name: EXPORT_LOCATION
              value: "true"
          ports:
            - name: http
              containerPort: 9120
              protocol: TCP
          # /metrics answers even when the Mazda cloud is down: a failed poll
          # sets mazda6e_scrape_success to 0. A probe failure therefore means
          # the process is stuck, not that Mazda is unreachable.
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
          resources:
            # No cpu limit by design - see fedishark/deployment.yaml for the full
            # reasoning. Same exporter shape as dirigera-exporter. The memory
            # limit stays.
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
