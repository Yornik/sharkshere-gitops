---
# Source: github.com/Yornik/mazda6e-grafana-bridge, dashboards/mazda6e.json.
# Change the dashboard there first, then copy it here.
# This copy differs from the source in 4 places. Make all 4 changes again
# after each copy:
# - It has no Location section, because EXPORT_LOCATION is off.
# - The datasource variable selects "Prometheus". With no selection,
#   Grafana picks the first Prometheus-type data source by name, which
#   is grafana-amazonprometheus-datasource, and every panel shows No data.
# - The tire panels show bar, not kPa: the query divides by 100 and the
#   thresholds are 2.2, 2.4 and 3.0 bar.
# - The 2 "Charging power" queries and the 2 "Battery power while
#   driving" queries also read the deprecated
#   mazda6e_charge_current_amperes (kind "total" and "dc"). Images before
#   v1.1.0 export only that metric, so the fallback shows the history
#   from before the update.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mazda6e-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  mazda6e.json: |-
    {
      "__inputs": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Unofficial: not made, endorsed or supported by Mazda. Mazda and Mazda 6e are trademarks of Mazda Motor Corporation. Battery, charging, body, cabin and tire state from mazda6e-grafana-bridge.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "mazda6e-grafana-bridge",
          "type": "link",
          "icon": "external link",
          "url": "https://github.com/Yornik/mazda6e-grafana-bridge",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "State of charge",
          "description": "",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "percent",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 15
                  },
                  {
                    "color": "green",
                    "value": 30
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "mazda6e_battery_soc_percent{vin=~\"$vin\"}",
              "refId": "A",
              "legendFormat": "SoC",
              "range": true
            }
          ]
        },
        {
          "type": "stat",
          "title": "Range",
          "description": "",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "suffix: km",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "mazda6e_range_km{vin=~\"$vin\"}",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "type": "stat",
          "title": "Charging",
          "description": "Current charge state as reported by the car.",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Not charging",
                      "color": "text",
                      "index": 0
                    },
                    "1": {
                      "text": "Charging",
                      "color": "green",
                      "index": 1
                    },
                    "2": {
                      "text": "Complete",
                      "color": "blue",
                      "index": 2
                    },
                    "3": {
                      "text": "Paused",
                      "color": "orange",
                      "index": 3
                    },
                    "4": {
                      "text": "Unknown",
                      "color": "text",
                      "index": 4
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(mazda6e_charge_state{vin=~\"$vin\",state=\"charging\"}) + 2 * sum(mazda6e_charge_state{vin=~\"$vin\",state=\"completed\"}) + 3 * sum(mazda6e_charge_state{vin=~\"$vin\",state=\"paused\"}) + 4 * sum(mazda6e_charge_state{vin=~\"$vin\",state=\"unknown\"})",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "type": "stat",
          "title": "Doors",
          "description": "Unlocked if either the driver or passenger side reports unlocked.",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Locked",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "Unlocked",
                      "color": "orange",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(mazda6e_unlocked{vin=~\"$vin\"})",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "type": "stat",
          "title": "Odometer",
          "description": "",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "suffix: km",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "mazda6e_odometer_km{vin=~\"$vin\"}",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "type": "stat",
          "title": "Data age",
          "description": "How long ago the car last reported to the Mazda cloud. A parked car that is asleep reports rarely, up to about 4 hours overnight. Orange after 6 hours, red after 1 day.",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "s",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 21600
                  },
                  {
                    "color": "red",
                    "value": 86400
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "time() - max(mazda6e_status_updated_timestamp_seconds{vin=~\"$vin\"})",
              "refId": "A",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "type": "row",
          "title": "Battery & charging",
          "collapsed": false,
          "id": 8,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "State of charge",
          "description": "",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "lineInterpolation": "linear",
                "showPoints": "never",
                "spanNulls": 3600000,
                "axisBorderShow": false,
                "gradientMode": "none",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0,
              "max": 100
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Charge limit"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "mazda6e_battery_soc_percent{vin=~\"$vin\"}",
              "refId": "A",
              "legendFormat": "State of charge",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "mazda6e_charge_target_soc_percent{vin=~\"$vin\"}",
              "refId": "B",
              "legendFormat": "Charge limit",
              "range": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Range",
          "description": "",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "suffix: km",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "lineInterpolation": "linear",
                "showPoints": "never",
                "spanNulls": 3600000,
                "axisBorderShow": false,
                "gradientMode": "none",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "mazda6e_range_km{vin=~\"$vin\"}",
              "refId": "A",
              "legendFormat": "Range",
              "range": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Charging power",
          "description": "From charger is the power the charger supplies. Into battery is the power that charges the battery. The gap between them is the charging loss. The car reports current, not voltage, so power is an estimate with fixed voltages: 230 V for AC and 379 V for the battery (68.8 kWh pack; set the battery_voltage variable to 364 for the 78 kWh pack). Ranges over 12 days skip some readings, so Max can read low.",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "kwatt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "lineInterpolation": "stepAfter",
                "showPoints": "never",
                "spanNulls": false,
                "axisBorderShow": false,
                "gradientMode": "none",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "axisSoftMax": 12
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8a8a8a"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 15
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#A352CC"
                    }
                  },
                  {
                    "id": "custom.showPoints",
                    "value": "always"
                  },
                  {
                    "id": "custom.pointSize",
                    "value": 2
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "((max by (vin) (mazda6e_charger_current_amperes{vin=~\"$vin\"} or on(vin) mazda6e_charge_current_amperes{vin=~\"$vin\",kind=\"total\"})) * $battery_voltage / 1000 and on(vin) max by (vin) (mazda6e_plugged_in{vin=~\"$vin\",connector=\"dc\"}) == 1) or on(vin) (max by (vin) (mazda6e_charger_current_amperes{vin=~\"$vin\"} or on(vin) mazda6e_charge_current_amperes{vin=~\"$vin\",kind=\"total\"})) * $grid_voltage / 1000",
              "refId": "A",
              "legendFormat": "From charger",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "((-min by (vin) (mazda6e_battery_current_amperes{vin=~\"$vin\"} or on(vin) mazda6e_charge_current_amperes{vin=~\"$vin\",kind=\"dc\"}) and on(vin) max by (vin) (mazda6e_charger_current_amperes{vin=~\"$vin\"} or on(vin) mazda6e_charge_current_amperes{vin=~\"$vin\",kind=\"total\"}) > 0) or on(vin) 0 * ((max_over_time((max by (vin) (mazda6e_charger_current_amperes{vin=~\"$vin\"} or on(vin) mazda6e_charge_current_amperes{vin=~\"$vin\",kind=\"total\"}))[$__interval:1m] offset 1m) > 0) or on(vin) (max_over_time((max by (vin) (mazda6e_charger_current_amperes{vin=~\"$vin\"} or on(vin) mazda6e_charge_current_amperes{vin=~\"$vin\",kind=\"total\"}))[$__interval:1m] offset -$__interval) > 0))) * $battery_voltage / 1000",
              "refId": "B",
              "legendFormat": "Into battery",
              "range": true
            }
          ],
          "interval": "1m",
          "maxDataPoints": 5000
        },
        {
          "type": "state-timeline",
          "title": "Plug & charge state",
          "description": "",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 12,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "#5a5f6b"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "No",
                      "color": "#5a5f6b",
                      "index": 0
                    },
                    "1": {
                      "text": "Yes",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0,
                "insertNulls": false,
                "spanNulls": false,
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "auto",
            "mergeValues": true,
            "rowHeight": 0.9,
            "alignValue": "center",
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "mazda6e_plugged_in{vin=~\"$vin\"}",
              "refId": "A",
              "legendFormat": "Plug {{connector}}",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "mazda6e_charging{vin=~\"$vin\"}",
