apiVersion: v1
kind: Service
metadata:
  name: graphite-exporter
  namespace: monitoring
  labels:
    app: graphite-exporter
spec:
  type: NodePort
  selector:
    app: graphite-exporter
  ports:
    - name: metrics
      port: 9108
      targetPort: 9108
      protocol: TCP
    - name: graphite-tcp
      port: 2003
      targetPort: 2003
      nodePort: 32003
      protocol: TCP
