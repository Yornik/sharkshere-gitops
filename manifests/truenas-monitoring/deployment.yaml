apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphite-exporter
  namespace: monitoring
  labels:
    app: graphite-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphite-exporter
  template:
    metadata:
      labels:
        app: graphite-exporter
    spec:
      containers:
        - name: graphite-exporter
          image: prom/graphite-exporter:v0.16.0
          args:
            - --graphite.mapping-config=/etc/graphite-exporter/graphite_mapping.conf
            - --graphite.listen-address=:2003
          ports:
            - name: metrics
              containerPort: 9108
              protocol: TCP
            - name: graphite-tcp
              containerPort: 2003
              protocol: TCP
            - name: graphite-udp
              containerPort: 2003
              protocol: UDP
          volumeMounts:
            - name: mapping
              mountPath: /etc/graphite-exporter
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: mapping
          configMap:
            name: graphite-exporter-mapping
