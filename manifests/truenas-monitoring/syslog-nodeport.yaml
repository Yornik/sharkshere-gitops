apiVersion: v1
kind: Service
metadata:
  name: alloy-syslog
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: syslog-tcp
      port: 5140
      targetPort: 5140
      nodePort: 30514
      protocol: TCP
    - name: syslog-udp
      port: 5140
      targetPort: 5140
      nodePort: 30514
      protocol: UDP
