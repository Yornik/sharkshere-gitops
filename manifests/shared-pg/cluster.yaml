apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-pg
  namespace: shared-pg
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 3
  # The Postgres image comes from the ClusterImageCatalog of CNPG
  # (manifests/cnpg-catalog), not from a tag in this file. The cluster names
  # only its major version. The catalog maps that major to the current image.
  # See docs/incidents/2026-10-29-cnpg-image-frozen-at-creation.md.
  #
  # NOTE: a change of `major` is an offline in-place upgrade. CNPG stops the
  # cluster and runs pg_upgrade. Change 1 cluster at a time, and follow the
  # steps in the incident write-up (ANALYZE, new base backup).
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-system-trixie
    major: 18
  storage:
    storageClass: truenas-ssd-iscsi
    size: 10Gi
  walStorage:
    storageClass: truenas-ssd-iscsi
    size: 5Gi
  # Requests sized from observed usage (~70-140Mi, <25m CPU) + headroom so the
  # pods get Burstable QoS instead of BestEffort (first evicted under memory
  # pressure). Memory limit ~2x request and well above shared_buffers (256MB)
  # + work_mem headroom. No CPU limit: throttling a DB is worse than sharing.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: 256MB
      work_mem: 16MB
      effective_cache_size: 1GB
  bootstrap:
    initdb:
      database: app
      owner: app
  # App roles. Each role's password is in a basic-auth Secret next to this
  # Cluster (role-<app>.enc.yaml). Its databases are Database resources in
  # databases.yaml.
  managed:
    roles:
      - name: prowlarr
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-role-prowlarr
      - name: radarr
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-role-radarr
      - name: sonarr
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-role-sonarr
      - name: seerr
        ensure: present
        login: true
        passwordSecret:
          name: shared-pg-role-seerr
  monitoring:
    # Deprecated in CNPG; will be removed. We ship our own PodMonitor in
    # podmonitor.yaml so we control the release label Prometheus filters on.
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: shared-pg-store
        serverName: shared-pg
