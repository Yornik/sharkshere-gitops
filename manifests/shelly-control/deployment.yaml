apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelly-control
  namespace: shelly-control
  labels:
    app.kubernetes.io/name: shelly-control
    app.kubernetes.io/instance: shelly-control
spec:
  # 2 pods would both switch the relay and work against each other. The PVC
  # is also ReadWriteOnce.
  replicas: 1
  # Recreate stops the old pod before the new pod starts. With RollingUpdate,
  # the new pod waits on FailedAttachVolume while the old pod holds the
  # volume, and for a moment 2 pods could switch the relay. See
  # docs/incidents/grafana-rwo-multi-attach.md and
  # docs/incidents/2026-09-08-gitlab-valkey-rollingupdate-multi-attach.md.
  # The first commit sets Recreate. The live object then has no rollingUpdate
  # block for the API server to reject, as in part 2 of the Valkey incident.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shelly-control
      app.kubernetes.io/instance: shelly-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shelly-control
        app.kubernetes.io/instance: shelly-control
    spec:
      # The service talks to the relay on the LAN, to tibber-exporter and to
      # its own volume. It needs no Kubernetes API access.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Gives group 65532 write access to the NFS volume. go-practice-web
        # runs with the same fsGroup on truenas-ssd.
        fsGroup: 65532
        # Skips the recursive change of ownership at each start when the root
        # of the volume already has the group.
        fsGroupChangePolicy: OnRootMismatch
        # Required by the restricted profile of the namespace.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shelly-control
          # Switches the Shelly Plus 1PM relay of the boiler by the Tibber
          # price. Source + CI: github.com/Yornik/Shelly-control. Renovate
          # does not merge a bump of this image by itself, because the image
          # switches a real device. See renovate.json5.
          image: ghcr.io/yornik/shelly-control:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            # The same device as SHELLY_URL of shelly-bridge. Scheme, host and
            # port only. Authentication is off on the device, so there is no
            # SHELLY_PASSWORD and no Secret. If the address changes, change
            # the ipBlock in networkpolicy-egress.yaml too.
            - name: SHELLY_URL
              value: "http://192.168.1.25"
            # The home whose prices tibber-exporter serves at
            # /homes/<id>/prices. It is the `--live` argument in
            # manifests/tibber-exporter/deployment.yaml. Not a secret:
            # Prometheus holds it as the home_id label of the Tibber series.
            - name: TIBBER_HOME_ID
              value: "8e35be0e-5303-40a1-920e-104eb9765346"
            # What "today" and "05:00" mean for the rules. The same value as
            # the default, set here so that a new default cannot move the
            # switch times.
            - name: TIMEZONE
              value: "Europe/Amsterdam"
            # The mount path of the PVC below.
            - name: STATE_DIR
              value: "/data"
            - name: LISTEN_PORT
              value: "9123"
            # The page refuses every other Host, so a DNS-rebinding page
            # cannot use a browser on the tailnet to reach it. /metrics and
            # /healthz skip the check, so Prometheus and the probes need no
            # entry here. If the page answers 400 through the tailnet, the
            # `host_refused` log line shows the Host that the proxy sent.
            - name: ALLOWED_HOSTS
              value: "boiler.hedgehog-wage.ts.net"
            # The master switch. "true" lets the service send switch commands
            # (Switch.Set). The mode on the page decides when. In Shadow, the
            # first mode, the rules switch nothing, but an override does. Live
            # needs a confirmation on the page. The owner removed the cron job
            # on the Pi on 2026-10-26, so this service is the only controller.
            # "false" is the hard stop: no switch command in any mode, an
            # override included. It keeps the saved mode: if that is Live,
            # "true" again switches at once, without the confirmation on the
            # page. See docs/runbooks/shelly-control.md.
            - name: ALLOW_SWITCHING
              value: "true"
            # Not set, because the defaults are correct: TIBBER_EXPORTER_URL
            # (http://tibber-exporter.monitoring.svc:8080), DISPLAY_NAME
            # (Boiler) and MIN_SWITCH_INTERVAL_SECONDS (60).
            #
            # CAUTION: Do not set DEFAULT_MODE=live. It starts the service in
            # live mode without the confirmation on the page. Leave it unset,
            # so the default is shadow. Choose Live on the page instead.
          ports:
            - name: http
              containerPort: 9123
              protocol: TCP
          # Both probes use /healthz, which answers while the process runs.
          # /readyz turns 503 when the prices do not cover this quarter or no
          # decision was made in 20 minutes. With /readyz, the pod would leave
          # the Service, and the page could not say what is wrong. Prometheus
          # scrapes a pod that is not ready too, so the metrics show the
          # problem with either probe.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
          # No /tmp volume. The service writes only to STATE_DIR: its
          # temporary files go next to the state files. Waitress spools to
          # /tmp only a request body over 512 KiB or a response over 1 MiB.
          # The service refuses a body over 64 KiB. On 2026-10-26 the page was
          # 77 KB and 1 logged decision about 500 bytes, so the log of 700
          # stays below 1 MiB. The CI of the source repository runs the image
          # with a read-only root and no /tmp.
          volumeMounts:
            - name: state
              mountPath: /data
          resources:
            # No cpu limit by design - see fedishark/deployment.yaml for the full
            # reasoning. The memory request is a measurement outside the
            # cluster: v1.0.0 used 44 MiB RSS on 2026-10-26, with Python 3.13
            # and a fake relay and exporter. Read
            # container_memory_working_set_bytes after the first week, then
            # set the request from it. The memory limit stays.
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: shelly-control-state-ssd
