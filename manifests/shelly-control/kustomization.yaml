apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here. Each manifest sets its own namespace, because the
# dashboard ConfigMap goes to `monitoring`, with the other dashboards. The
# Grafana sidecar watches every namespace, but docs/tech/monitoring.md keeps
# the dashboards in `monitoring`.
#
# No ksops generator. Authentication is off on the relay, so there is no
# password, and the home id is not a secret. See deployment.yaml.
resources:
  - namespace.yaml
  - pvc-state.yaml
  - deployment.yaml
  - service.yaml
  - ingress-tailnet.yaml
  - servicemonitor.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-ingress.yaml
  - networkpolicy-egress.yaml
  # In the namespace monitoring.
  - grafana-dashboard.yaml
