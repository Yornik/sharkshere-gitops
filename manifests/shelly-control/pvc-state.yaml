# The state of the service: the settings and an active override
# (state.json), the decision log (decisions.json) and the last good prices
# (prices.json). Without it, a restart forgets the settings saved on the page
# and starts again from the defaults, in shadow mode.
#
# The files are small JSON files. The service writes each one to a temporary
# file next to it, syncs it and renames it, so NFS is enough. Only 1 process
# opens the files: the Deployment has 1 replica and uses Recreate.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelly-control-state-ssd
  namespace: shelly-control
  annotations:
    # truenas-ssd has reclaimPolicy Delete, so a deleted PVC deletes its NAS
    # dataset. The settings on the page, the switch factors among them, exist
    # only here. A PVC that leaves git by mistake stays on the cluster.
    # go-practice and the CNPG clusters use the same option.
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: shelly-control
    app.kubernetes.io/instance: shelly-control
spec:
  # 1 node at a time. deployment.yaml uses Recreate for this reason.
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-ssd
  resources:
    # The 3 files hold some KB. 1Gi is the smallest size of the other app
    # PVCs, for example asf, and the class can expand.
    requests:
      storage: 1Gi
