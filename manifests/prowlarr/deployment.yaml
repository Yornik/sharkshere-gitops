apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: jellyfin
  labels:
    app: prowlarr
spec:
  replicas: 1
  # The config volume is RWO and holds a SQLite database. A second pod
  # must not start while the first pod still has the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      # No gluetun sidecar, unlike qBittorrent. Public indexers block the
      # Mullvad exit addresses quickly, so searches leave from the home
      # address. Prowlarr only searches. qBittorrent still downloads through
      # the VPN.
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls165
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
            # Prowlarr skips the login for local addresses by default. The
            # Tailscale proxy connects from a pod address, which counts as
            # local. `Enabled` asks for the login on every address.
            #
            # CAUTION: Do not set PROWLARR__AUTH__METHOD. The UI shows the
            # dialog that creates the first user only while the method is
            # `None`. A forced `Forms` on a new volume has no user, so every
            # login fails.
            - name: PROWLARR__AUTH__REQUIRED
              value: Enabled
            # The databases are on shared-pg (manifests/shared-pg/databases.yaml),
            # not in SQLite on /config. SQLite takes an NFS lock for every
            # transaction, and those locks made the Servarr apps freeze for 25
            # to 30 seconds at a time (found 2026-10-28).
            #
            # NOTE: The old prowlarr.db and logs.db stay on /config as a
            # fallback. Remove these variables to go back to them.
            - name: PROWLARR__POSTGRES__HOST
              value: shared-pg-rw.shared-pg.svc.cluster.local
            - name: PROWLARR__POSTGRES__PORT
              value: "5432"
            - name: PROWLARR__POSTGRES__USER
              value: prowlarr
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prowlarr-postgres
                  key: PROWLARR__POSTGRES__PASSWORD
            - name: PROWLARR__POSTGRES__MAINDB
              value: prowlarr-main
            - name: PROWLARR__POSTGRES__LOGDB
              value: prowlarr-log
          ports:
            - containerPort: 9696
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
          # /ping needs no login.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config-ssd
