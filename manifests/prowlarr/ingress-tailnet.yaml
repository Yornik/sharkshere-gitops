apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-tailnet
  namespace: jellyfin
  annotations:
    # The proxy serves port 443 only. Without the redirect, an http://
    # address times out instead of reaching the HTTPS one.
    tailscale.com/http-redirect: "true"
spec:
  # The Tailscale operator runs 1 proxy device for this Ingress. The proxy
  # ends TLS with a certificate for the ts.net name and sends plain HTTP to
  # Prowlarr. There is no public route.
  #
  # NOTE: Tailnet traffic does not pass through Traefik. The Prowlarr login
  # is the gate. The deployment forces it on for every address. The first
  # visitor to a new Prowlarr creates the login, so create it before you
  # share the address. See docs/runbooks/seerr-sonarr.md.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: prowlarr
      port:
        number: 9696
  tls:
    # The first label is the device name: prowlarr.hedgehog-wage.ts.net.
    - hosts:
        - prowlarr
