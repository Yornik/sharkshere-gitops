# The ciphertext blobs: one <id>.sfs file per share, written to a
# temporary name and renamed only after the stream validates and fsyncs.
# The database on shared-pg keeps only the bookkeeping; these files are
# everything the service actually stores.
#
# Shares are transient by design (the default lifetime is 7 days, the
# ceiling 90, and the sweeper reclaims expired ones hourly), so the volume
# holds a rolling window, not an archive. 10 Gi fits a handful of
# near-ceiling video shares at once; the class can expand if the window
# ever needs to be wider.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secure-file-share-blobs
  namespace: secure-file-share
  annotations:
    # truenas-ssd has reclaimPolicy Delete, so a deleted PVC deletes its NAS
    # dataset. Live shares exist only here, so a PVC that leaves git by
    # mistake stays on the cluster. shelly-control uses the same option.
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: secure-file-share
    app.kubernetes.io/instance: secure-file-share
spec:
  # 1 pod at a time. deployment.yaml uses Recreate for this reason.
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-ssd
  resources:
    requests:
      storage: 10Gi
