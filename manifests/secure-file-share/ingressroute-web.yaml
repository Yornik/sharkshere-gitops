apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: secure-file-share-web
  namespace: secure-file-share
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`secure-share.yornik.eu`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: secure-file-share
      services:
        - name: secure-file-share
          port: 8080
