apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-file-share-control-tailnet
  namespace: secure-file-share
  annotations:
    # The proxy serves port 443 only. Without the redirect, an http://
    # address times out instead of reaching the HTTPS one.
    tailscale.com/http-redirect: "true"
spec:
  # The Tailscale operator runs 1 proxy device for this Ingress. The proxy
  # ends TLS with a certificate for the ts.net name and sends plain HTTP to
  # the control listener on :8081. The control plane has no reason to be on
  # the internet, so there is no public route: the public IngressRoute
  # carries no path to it. The control token still guards the door, and
  # every deletion writes one audit log line.
  # See docs/runbooks/tailnet-only-admin-uis.md and the app runbook.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: secure-file-share
      port:
        number: 8081
  tls:
    # The first label is the device name:
    # secure-share-control.hedgehog-wage.ts.net.
    - hosts:
        - secure-share-control
