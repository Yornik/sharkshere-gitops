---
# Source: github.com/Yornik/secure-file-share, dashboards/secure-file-share
# .json. Change the dashboard there first, then copy it here.
# This copy differs from the source in 1 place, the same fix as the other
# dashboards: the DS variable selects "Prometheus". With no selection,
# Grafana picks the first Prometheus-type data source by name, which is
# grafana-amazonprometheus-datasource, and every panel shows No data.
# The ConfigMap is in `monitoring`, with the other dashboards, but the
# Application `secure-file-share` owns it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secure-file-share-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
