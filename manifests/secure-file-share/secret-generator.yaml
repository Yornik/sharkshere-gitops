apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secure-file-share-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # secure-file-share-app.enc.yaml   Secret/secure-file-share-app. Two values:
  #
  #   DATABASE_URL  the DSN of the app database on shared-pg, including the
  #                 role password and sslmode=disable. The password matches
  #                 the one in manifests/shared-pg/role-secure-file-share
  #                 .enc.yaml. Rotate the two together.
  #   SFS_ADMIN_TOKEN  the bearer token every write path requires. Anyone
  #                 holding it can create, list and revoke shares; there is
  #                 no account model. Read it with:
  #                 sops -d manifests/secure-file-share/secure-file-share
  #                 -app.enc.yaml
  #
  # Edit with: sops manifests/secure-file-share/secure-file-share-app.enc.yaml
  - ./secure-file-share-app.enc.yaml
