apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secure-file-share-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # secure-file-share-app.enc.yaml   Secret/secure-file-share-app. Two values:
  #
  #   DATABASE_URL  the DSN of the app database on shared-pg, including the
  #                 role password and sslmode=disable. The password matches
  #                 the one in manifests/shared-pg/role-secure-file-share
  #                 .enc.yaml. Rotate the two together.
  #   SFS_ADMIN_TOKEN  the upload token every write path requires. v0.4
  #                 of the app calls it SFS_UPLOAD_TOKEN (the secret key
  #                 keeps the old name, so no sops edit is needed); anyone
  #                 holding it can create shares and read the listing.
  #                 There is no account model. Read it with:
  #                 sops -d manifests/secure-file-share/secure-file-share
  #                 -app.enc.yaml
  #
  # Edit with: sops manifests/secure-file-share/secure-file-share-app.enc.yaml
  - ./secure-file-share-app.enc.yaml
  # secure-file-share-control.enc.yaml   Secret/secure-file-share-control.
  # One value:
  #
  #   SFS_CONTROL_TOKEN  the token of the control plane, the ONLY door that
  #                 deletes a share (legal/compliance revocation, by share
  #                 link, on :8081, never routed through the ingress).
  #                 A different secret from the upload token on purpose:
  #                 the door that deletes must not be the door the
  #                 not-public mode can leave open. Every deletion writes
  #                 one audit log line. Read it with:
  #                 sops -d manifests/secure-file-share/secure-file-share
  #                 -control.enc.yaml
  #
  # Edit with: sops manifests/secure-file-share/secure-file-share-control.enc.yaml
  - ./secure-file-share-control.enc.yaml
