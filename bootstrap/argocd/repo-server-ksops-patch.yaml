apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      initContainers:
        - name: install-ksops
          image: alpine:3.21
          command:
            - /bin/sh
            - -c
          # KSOPS_SHA256 pins ksops v4.4.0 (ksops_4.4.0_Linux_x86_64.tar.gz, from the
          # release's checksums.txt). Bumping the ksops version REQUIRES updating this hash.
          args:
            - |
              set -eu
              KSOPS_VERSION=4.5.1
              KSOPS_TARBALL="ksops_${KSOPS_VERSION}_Linux_x86_64.tar.gz"
              KSOPS_SHA256=72973ce5a97d7ad0318c9f6ae4df2aa94a4a564c45fdf71772b759dff4df0cb4
              cd /custom-tools
              wget -q "https://github.com/viaduct-ai/kustomize-sops/releases/download/v${KSOPS_VERSION}/${KSOPS_TARBALL}"
              echo "${KSOPS_SHA256}  ${KSOPS_TARBALL}" | sha256sum -c -
              tar xzf "${KSOPS_TARBALL}"
              rm "${KSOPS_TARBALL}"
              chmod +x /custom-tools/ksops
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
      containers:
        - name: argocd-repo-server
          volumeMounts:
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops
            - mountPath: /.config/sops/age/keys.txt
              name: sops-age-key
              subPath: keys.txt
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age-key
          secret:
            secretName: sops-age-key
