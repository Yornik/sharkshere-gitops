apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: Default project for sharkshere cluster
  # keep in sync with repoURLs in apps/values.yaml — a new helm repo must be
  # added here or its Application errors with 'repository not permitted'
  sourceRepos:
    - https://github.com/Yornik/sharkshere-gitops.git
    - https://charts.gitlab.io
    - https://charts.jetstack.io
    - https://charts.openproject.org/
    - https://cloudnative-pg.github.io/charts
    - https://democratic-csi.github.io/charts/
    - https://grafana.github.io/helm-charts
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://pkgs.tailscale.com/helmcharts
    - https://prometheus-community.github.io/helm-charts
    - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
    - https://traefik.github.io/charts
    - https://valkey.io/valkey-helm/
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
