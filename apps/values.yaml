repoURL: https://github.com/Yornik/sharkshere-gitops.git
targetRevision: main

# Define your apps here. Each entry becomes an ArgoCD Application.
#
# To add a new app:
#   1. Add an entry below
#   2. Create its manifests under manifests/<name>/
#   3. Push — ArgoCD picks it up automatically
#
apps:
  local-path-provisioner:
    namespace: local-path-storage
    path: manifests/local-path-provisioner

  smb-csi-driver:
    namespace: kube-system
    helm:
      repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
      chart: csi-driver-smb
      targetRevision: "v1.*"
      values: |
        controller:
          replicas: 1

  external-dns:
    namespace: external-dns
    path: manifests/external-dns

  monitoring:
    namespace: monitoring
    path: manifests/monitoring

  kube-prometheus-stack:
    namespace: monitoring
    syncOptions:
      - ServerSideApply=true
    helm:
      repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "85.*"
      values: |
        # Talos Linux: control plane components not accessible via Omni
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

        # Grafana
        grafana:
          deployment:
            strategy:
              rollingUpdate:
                maxUnavailable: 1
                maxSurge: 0
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: truenas-ssd
            size: 2Gi
          sidecar:
            dashboards:
              enabled: true
            datasources:
              enabled: true
          # File-based dashboard providers. The sidecar auto-generates one
          # for /tmp/dashboards (where it dumps ConfigMap dashboards). We
          # add a 'Postgres' provider so URL-downloaded dashboards in
          # /var/lib/grafana/dashboards/default get picked up AND grouped
          # into a 'Postgres' folder in the Grafana UI.
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  orgId: 1
                  folder: Postgres
                  type: file
                  disableDeletion: false
                  allowUiUpdates: false
                  updateIntervalSeconds: 30
                  options:
                    path: /var/lib/grafana/dashboards/default
          # URL-imported dashboards (chart's initContainer fetches at
          # Grafana pod startup, writes into the file-provider path).
          dashboards:
            default:
              cnpg-cluster:
                # Pinned to the commit that added barman_cloud_* support;
                # Renovate tracks via the customManager in renovate.json5.
                url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/19f534b2b3d2d34e871d656351599eb8b170ad86/charts/cluster/grafana-dashboard.json
                sha256: 292cdeb3f17506d75623749fdfdfcaf51fbd9a414d6faa197434771fcff05bd2

        # Prometheus
        prometheus:
          prometheusSpec:
            retention: 60d
            retentionSize: 45GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: truenas-ssd
                  resources:
                    requests:
                      storage: 50Gi

        additionalPrometheusRulesMap:
          downsampling:
            groups:
              - name: downsample_5m
                interval: 5m
                rules:
                  - record: job:node_cpu_utilisation:avg5m
                    expr: avg without(cpu,mode) (1 - rate(node_cpu_seconds_total{mode="idle"}[5m]))
                  - record: job:node_memory_utilisation:avg5m
                    expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                  - record: job:node_network_receive_bytes:rate5m
                    expr: sum without(device) (rate(node_network_receive_bytes_total{device!~"lo|veth.*|cni.*"}[5m]))
                  - record: job:node_network_transmit_bytes:rate5m
                    expr: sum without(device) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*|cni.*"}[5m]))
                  - record: namespace:container_cpu_usage:rate5m
                    expr: sum by(namespace) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
                  - record: namespace:container_memory_working_set:avg5m
                    expr: sum by(namespace) (container_memory_working_set_bytes{container!=""})

        # Alertmanager
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: truenas-ssd
                  resources:
                    requests:
                      storage: 2Gi

        # Node exporter - Talos has no systemd
        prometheus-node-exporter:
          extraArgs:
            - --no-collector.systemd

  loki:
    namespace: monitoring
    helm:
      repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "7.*"
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          limits_config:
            retention_period: 1440h
            allow_structured_metadata: false
            ingestion_rate_mb: 100
            ingestion_burst_size_mb: 100
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
            working_directory: /var/loki/compactor
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: boltdb-shipper
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storageConfig:
            boltdb_shipper:
              active_index_directory: /var/loki/index
              cache_location: /var/loki/cache
              shared_store: filesystem
            filesystem:
              directory: /var/loki/chunks
          storage:
            type: filesystem
        singleBinary:
          replicas: 1
          extraArgs:
            - -log.level=error
          persistence:
            enabled: true
            storageClass: truenas-ssd
            size: 30Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false

  truenas-monitoring:
    namespace: monitoring
    path: manifests/truenas-monitoring

  alloy:
    namespace: monitoring
    helm:
      repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "1.*"
      values: |
        alloy:
          mounts:
            varlog: true
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + env("HOSTNAME")
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  regex         = "loki-canary.*"
                  action        = "drop"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  regex         = "(.+)"
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  regex         = "(.+)"
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.pipeline.receiver]
              }

              loki.process "pipeline" {
                stage.cri {}

                stage.drop {
                  // Noisy Kubernetes leader-election heartbeat logs.
                  expression = "successfully renewed lease"
                }

                stage.drop {
                  // Noisy Kubernetes readiness probe access logs.
                  expression = "userAgent=kube-probe.*uri=/readyz"
                }

                stage.match {
                  selector = "{app=\"tibber-exporter\"}"
                  stage.drop {
                    expression = "\"liveMeasurement\":"
                  }
                  stage.drop {
                    expression = "Updating (DAILY|HOURLY) data|Updating prices"
                  }
                }

                stage.match {
                  selector = "{app=\"democratic-csi\"}"
                  stage.drop {
                    expression = "NodeGetVolumeStats|request headers map\\["
                  }
                }

                stage.match {
                  selector = "{app=\"traefik\"}"
                  stage.drop {
                    // Traefik JSON access log: Kubernetes health probe requests to /ping.
                    expression = "\"UserAgent\":\"kube-probe"
                  }
                }

                stage.match {
                  selector = "{app=\"grafana\"}"
                  stage.drop {
                    expression = "logger=tsdb\\.loki|endpoint=queryData pluginId=loki|Response (received|parsed) from loki"
                  }
                }

                stage.match {
                  selector = "{app=\"external-dns\"}"
                  stage.drop {
                    // ExternalDNS webhook access logs. Keep in pod logs, drop from Loki.
                    expression = "msg=\"(started|completed) handling request\"|request=/(records|adjustendpoints)"
                  }
                }

                stage.match {
                  selector = "{app=\"loki\"}"
                  stage.drop {
                    expression = "caller=(metrics\\.go|roundtrip\\.go):|source=grafana-lokiexplore-app|query_type=volume|api=detected_labels"
                  }
                }

                stage.match {
                  selector = "{job=\"truenas\"}"
                  // Drop obvious noise from TrueNAS syslog. Keep all PAM, sshd,
                  // and ZFS/disk events.
                  stage.drop {
                    expression = "Cannot find unit for notify message"
                  }
                  stage.drop {
                    expression = "Syslog connection (failed|established);"
                  }
                  stage.drop {
                    // Ephemeral systemd user-session housekeeping; the matching
                    // sshd PAM lines carry the real audit signal.
                    expression = "user-runtime-dir@|run-user-\\d+\\.mount|session-\\d+\\.scope|user@\\d+\\.service|user-\\d+\\.slice"
                  }
                }

                stage.json {
                  expressions = {
                    level     = "level",
                    severity  = "severity",
                    log_level = "log_level",
                  }
                }

                stage.regex {
                  expression = "(?i)\\b(?P<level>trace|debug|info|warn|warning|error|fatal|panic)\\b"
                }

                stage.template {
                  source   = "level"
                  template = "{{ "{{" }} ToLower .Value {{ "}}" }}"
                }

                stage.replace {
                  source     = "level"
                  expression = "^warning$"
                  replace    = "warn"
                }

                stage.match {
                  selector = "{stream=\"stderr\"}"
                  stage.template {
                    source   = "level"
                    template = "{{ "{{" }} if .Value {{ "}}" }}{{ "{{" }} .Value {{ "}}" }}{{ "{{" }} else {{ "}}" }}error{{ "{{" }} end {{ "}}" }}"
                  }
                }

                stage.match {
                  selector = "{stream=\"stdout\"}"
                  stage.template {
                    source   = "level"
                    template = "{{ "{{" }} if .Value {{ "}}" }}{{ "{{" }} .Value {{ "}}" }}{{ "{{" }} else {{ "}}" }}info{{ "{{" }} end {{ "}}" }}"
                  }
                }

                stage.match {
                  selector            = "{app=\"democratic-csi\", level!~\"warn|error|fatal|panic\"}"
                  action              = "drop"
                  drop_counter_reason = "democratic_csi_non_error"
                }

                stage.match {
                  selector            = "{namespace=\"argocd\", level!~\"warn|error|fatal|panic\"}"
                  action              = "drop"
                  drop_counter_reason = "argocd_non_error"
                }

                stage.drop {
                  longer_than = "16KB"
                }

                stage.labels {
                  values = {
                    level = "",
                  }
                }

                forward_to = [loki.write.loki.receiver]
              }

              loki.source.syslog "truenas" {
                listener {
                  address  = "0.0.0.0:5140"
                  protocol = "tcp"
                  labels   = {
                    job      = "truenas",
                    instance = "nas",
                  }
                }
                listener {
                  address  = "0.0.0.0:5140"
                  protocol = "udp"
                  labels   = {
                    job      = "truenas",
                    instance = "nas",
                  }
                }
                forward_to = [loki.process.pipeline.receiver]
              }

              loki.write "loki" {
                endpoint {
                  url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
                }
              }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          extraPorts:
            - name: syslog-tcp
              port: 5140
              targetPort: 5140
              protocol: TCP
            - name: syslog-udp
              port: 5140
              targetPort: 5140
              protocol: UDP
        controller:
          type: daemonset
        tolerations:
          - operator: Exists

  tibber-exporter:
    namespace: monitoring
    path: manifests/tibber-exporter

  gotosocial:
    namespace: gotosocial
    path: manifests/gotosocial

  jellyfin:
    namespace: jellyfin
    path: manifests/jellyfin

  omni-tools:
    namespace: omni-tools
    path: manifests/omni-tools

  qbittorrent:
    namespace: jellyfin
    path: manifests/qbittorrent

  democratic-csi:
    namespace: democratic-csi
    path: manifests/democratic-csi

  democratic-csi-nfs:
    namespace: democratic-csi
    helm:
      repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: 0.15.1
      values: |
        csiDriver:
          name: org.democratic-csi.nfs
        driver:
          existingConfigSecret: democratic-csi-nfs-driver-config
          config:
            driver: freenas-api-nfs
        controller:
          externalSnapshotter:
            enabled: false
        storageClasses:
          - name: truenas-nfs
            defaultClass: true
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              fsType: nfs
            mountOptions:
              - noatime
              - nfsvers=4
        volumeSnapshotClasses: []

  democratic-csi-iscsi:
    namespace: democratic-csi
    helm:
      repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: 0.15.1
      values: |
        csiDriver:
          name: org.democratic-csi.iscsi
        node:
          hostPID: true
          driver:
            extraEnv:
              - name: ISCSIADM_HOST_STRATEGY
                value: nsenter
              - name: ISCSIADM_HOST_PATH
                value: /usr/local/sbin/iscsiadm
            iscsiDirHostPath: /etc/iscsi
            iscsiDirHostPathType: ""
        driver:
          existingConfigSecret: democratic-csi-iscsi-driver-config
          config:
            driver: freenas-api-iscsi
        controller:
          externalSnapshotter:
            enabled: false
        storageClasses:
          - name: truenas-iscsi
            defaultClass: false
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              fsType: ext4
            mountOptions: []
        volumeSnapshotClasses: []

  democratic-csi-iscsi-ssd:
    namespace: democratic-csi
    helm:
      repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: 0.15.1
      values: |
        csiDriver:
          name: org.democratic-csi.iscsi-ssd
        node:
          hostPID: true
          driver:
            extraEnv:
              - name: ISCSIADM_HOST_STRATEGY
                value: nsenter
              - name: ISCSIADM_HOST_PATH
                value: /usr/local/sbin/iscsiadm
            iscsiDirHostPath: /etc/iscsi
            iscsiDirHostPathType: ""
        driver:
          existingConfigSecret: democratic-csi-iscsi-ssd-driver-config
          config:
            driver: freenas-api-iscsi
        controller:
          externalSnapshotter:
            enabled: false
        storageClasses:
          - name: truenas-ssd-iscsi
            defaultClass: false
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              fsType: ext4
            mountOptions: []
        volumeSnapshotClasses: []

  democratic-csi-nfs-ssd:
    namespace: democratic-csi
    helm:
      repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: 0.15.1
      values: |
        csiDriver:
          name: org.democratic-csi.nfs-ssd
        driver:
          existingConfigSecret: democratic-csi-nfs-ssd-driver-config
          config:
            driver: freenas-api-nfs
        controller:
          externalSnapshotter:
            enabled: false
        storageClasses:
          - name: truenas-ssd
            defaultClass: false
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              fsType: nfs
            mountOptions:
              - noatime
              - nfsvers=4
              - nconnect=4
        volumeSnapshotClasses: []

  traefik:
    namespace: traefik
    helm:
      repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: "40.*"
      values: |
        updateStrategy:
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
        service:
          type: ClusterIP
          annotations:
            tailscale.com/expose: "true"
            tailscale.com/hostname: traefik
        ports:
          web:
            port: 8000
            exposedPort: 80
            protocol: TCP
            proxyProtocol:
              trustedIPs:
                - "10.0.0.0/8"
                - "100.64.0.0/10"
            forwardedHeaders:
              trustedIPs:
                - "10.0.0.0/8"
                - "100.64.0.0/10"
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
          websecure:
            port: 8443
            exposedPort: 443
            protocol: TCP
            proxyProtocol:
              trustedIPs:
                - "10.0.0.0/8"
                - "100.64.0.0/10"
            forwardedHeaders:
              trustedIPs:
                - "10.0.0.0/8"
                - "100.64.0.0/10"
            http:
              tls: {}
        certificatesResolvers:
          letsencrypt:
            acme:
              email: yornik@yornik.nl
              storage: /data/acme.json
              keyType: EC384
              httpChallenge:
                entryPoint: web
        persistence:
          enabled: true
          existingClaim: traefik-ssd
        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
          kubernetesIngress:
            enabled: true
          file:
            enabled: false
        experimental:
          plugins:
            fail2ban:
              moduleName: github.com/tomMoulard/fail2ban
              version: v0.8.9
        logs:
          general:
            format: json
            level: INFO
          access:
            enabled: true
            format: json
        ingressClass:
          enabled: true
          isDefaultClass: true

  muse:
    namespace: muse
    path: manifests/muse

  vaultwarden:
    namespace: vaultwarden
    path: manifests/vaultwarden

  vikunja:
    namespace: vikunja
    path: manifests/vikunja

  asf:
    namespace: asf
    path: manifests/asf

  fedishark:
    namespace: fedishark
    path: manifests/fedishark

  yornik:
    namespace: yornik
    path: manifests/yornik

  privatebin:
    namespace: privatebin
    path: manifests/privatebin

  argocd-config:
    namespace: argocd
    path: manifests/argocd-config

  traefik-config:
    namespace: traefik
    path: manifests/traefik-config

  tailscale:
    namespace: tailscale
    path: manifests/tailscale

  tailscale-operator:
    namespace: tailscale
    helm:
      repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.98.3
      values: |
        oauth:
          clientId: ""
          clientSecret: ""
        operatorConfig:
          defaultTags:
            - "tag:k8s-operator"
        proxyConfig:
          defaultTags: "tag:k8s"
        apiServerProxyConfig:
          mode: "false"

  cert-manager:
    namespace: cert-manager
    annotations:
      argocd.argoproj.io/sync-wave: "-20"
    syncOptions:
      - ServerSideApply=true
    helm:
      repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.20.2
      values: |
        crds:
          enabled: true
        replicaCount: 2

  cnpg-operator:
    namespace: cnpg-system
    annotations:
      argocd.argoproj.io/sync-wave: "-10"
    syncOptions:
      - ServerSideApply=true
    helm:
      repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.28.2
      values: |
        crds:
          create: true
        replicaCount: 2
        monitoring:
          podMonitorEnabled: true
          # Required so the chart-created PodMonitor matches Prometheus's
          # release-scoped selector (chart default selects only resources
          # with release=kube-prometheus-stack).
          podMonitorAdditionalLabels:
            release: kube-prometheus-stack
          grafanaDashboard:
            # Chart ships a stale dashboard snapshot that still queries
            # the deprecated cnpg_collector_* metrics. The maintained
            # dashboard at cloudnative-pg/grafana-dashboards queries both
            # the old AND new (barman_cloud_*) metric names. Load that
            # instead via grafana.dashboards URL pointer below.
            create: false
          prometheusRule:
            enabled: true

  cnpg-plugin-barman-cloud:
    namespace: cnpg-system
    annotations:
      argocd.argoproj.io/sync-wave: "-10"
    syncOptions:
      - ServerSideApply=true
    helm:
      repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      targetRevision: 0.6.0
      values: |
        replicaCount: 2

  shared-pg:
    namespace: shared-pg
    path: manifests/shared-pg

  openproject-pg:
    namespace: openproject
    path: manifests/openproject

  gitlab-pg:
    namespace: gitlab
    path: manifests/gitlab

  # GitLab's cache + sidekiq queue store. Chart 10.0 (GitLab 19) removed the
  # bundled redis subchart and GitLab's migration docs explicitly recommend the
  # official Valkey chart — see [[feedback_bitnami_charts_deprecated]] for why
  # Bitnami's redis isn't a viable option. Standalone is plenty for CE; promote
  # to master+replica if a second consumer ever needs it.
  gitlab-valkey:
    namespace: gitlab
    helm:
      repoURL: https://valkey.io/valkey-helm/
      chart: valkey
      targetRevision: 0.9.4
      values: |
        replica:
          enabled: false
        dataStorage:
          enabled: true
          requestedSize: 8Gi
          className: truenas-ssd-iscsi
          accessModes:
            - ReadWriteOnce
        auth:
          enabled: true
          # ACL-based; the `default` user's password is read from a SOPS
          # Secret in manifests/gitlab/secret-valkey.enc.yaml (single Secret
          # consumed by both Valkey and GitLab).
          usersExistingSecret: gitlab-valkey
          aclUsers:
            default:
              permissions: "~* &* +@all"
              passwordKey: password
        service:
          port: 6379

  # GitLab CE — chart 10.0 (GitLab 19) requires fully-external infra:
  #   - postgres: gitlab-pg CNPG Cluster (manifests/gitlab/cluster.yaml)
  #   - redis: gitlab-valkey (Valkey Helm app above)
  #   - object storage: Hetzner OS (six yornik-gitlab-* buckets)
  # bundled minio/postgresql/redis subcharts no longer exist in 10.0.
  #
  # First boot runs DB migrations as a Job — webservice + sidekiq stay
  # Init/0 for 5-15 min while that finishes. ArgoCD will show Progressing.
  # Don't re-sync; let it cook.
  gitlab:
    namespace: gitlab
    helm:
      repoURL: https://charts.gitlab.io
      chart: gitlab
      targetRevision: 10.0.0
      values: |
        # All subcharts disabled — we use external CNPG postgres, external
        # Valkey, external S3, and Traefik IngressRoutes instead of
        # bundled cert-manager/nginx-ingress/prometheus/runner.
        installCertmanager: false
        # Chart hook is `pre-upgrade` only; Helm skips on first install, but
        # ArgoCD applies all manifests and tries to run the version-detection
        # script against an empty database → "unsupported upgrade path".
        # Safe to leave off because we pin chart version + bump intentionally
        # through Renovate — there's no path where we'd silently skip versions.
        upgradeCheck:
          enabled: false
        # Chart 10.0.0 ships gitlab-exporter subchart pinned to image tag
        # 16.8.0, which is NOT published to registry.gitlab.com — every pod
        # ImagePullBackOff's. Disable it; kube-prometheus-stack already
        # scrapes the workload pods directly via PodMonitor (sidekiq /
        # webservice / gitaly expose their own metrics endpoints).
        gitlab-exporter:
          enabled: false
        nginx-ingress:
          enabled: false
        prometheus:
          install: false
        gitlab-runner:
          install: false
        # certmanager-issuer is templated even when chart cert-manager off;
        # email is just used for the optional ClusterIssuer that won't render
        # because configureCertmanager: false below.
        certmanager-issuer:
          email: noreply@yornik.eu

        gitlab:
          webservice:
            ingress:
              enabled: false
          gitaly:
            persistence:
              enabled: true
              storageClass: truenas-ssd-iscsi
              size: 50Gi
          # Backups: toolbox uploads tarballs to yornik-gitlab-backups via
          # s3cmd; auth via gitlab-backup-storage Secret.
          toolbox:
            backups:
              objectStorage:
                config:
                  secret: gitlab-backup-storage
                  key: config

        registry:
          enabled: true
          # Registry uses its own storage Secret shape (docker registry
          # config.yml, not Rails Fog YAML) — see gitlab-registry-storage.
          storage:
            secret: gitlab-registry-storage
            key: config

        global:
          edition: ce
          hosts:
            domain: yornik.eu
            # https: true even though TLS termination is on Traefik —
            # tells Rails to generate https:// URLs (webhooks etc.).
            https: true
            gitlab:
              name: git.yornik.eu
            registry:
              name: registry.git.yornik.eu
            # gitlab-shell advertised externally on port 2222 (HAProxy on
            # jump hosts forwards :2222 → gitlab-shell over Tailscale).
            ssh: git.yornik.eu
          shell:
            port: 2222
          ingress:
            configureCertmanager: false
            class: none
            tls:
              enabled: false
          # External CNPG. Single physical DB (gitlabhq_production) used
          # by both main and ci connection decompositions — chart 10 falls
          # back to the global psql.password Secret when per-decomp
          # overrides aren't set.
          psql:
            host: gitlab-pg-rw.gitlab.svc.cluster.local
            port: 5432
            database: gitlabhq_production
            username: gitlab
            password:
              useSecret: true
              secret: gitlab-pg-app
              key: password
          # External Valkey (gitlab-valkey Helm app).
          redis:
            host: gitlab-valkey.gitlab.svc.cluster.local
            port: 6379
            auth:
              enabled: true
              secret: gitlab-valkey
              key: password
          # Consolidated object storage — single connection Secret
          # (Rails Fog YAML) covers lfs/artifacts/uploads/packages/etc.
          appConfig:
            object_store:
              enabled: true
              connection:
                secret: gitlab-s3-connection
                key: connection
            lfs:
              enabled: true
              bucket: yornik-gitlab-lfs
            artifacts:
              enabled: true
              bucket: yornik-gitlab-artifacts
            uploads:
              enabled: true
              bucket: yornik-gitlab-uploads
            packages:
              enabled: true
              bucket: yornik-gitlab-packages
            backups:
              bucket: yornik-gitlab-backups
              tmpBucket: yornik-gitlab-backups
          smtp:
            enabled: true
            address: smtp.resend.com
            port: 465
            tls: true
            starttls_auto: false
            user_name: resend
            password:
              secret: gitlab-smtp
              key: password
            domain: yornik.eu
            authentication: plain
          email:
            from: gitlab@yornik.eu
            display_name: GitLab
          initialRootPassword:
            secret: gitlab-initial-root-password
            key: password

  openproject:
    namespace: openproject
    helm:
      repoURL: https://charts.openproject.org/
      chart: openproject
      targetRevision: 13.6.0
      values: |
        # We ship our own IngressRoute (see manifests/openproject/) so the
        # chart's bundled Ingress stays off.
        ingress:
          enabled: false
        # External CNPG Postgres (Cluster CR in manifests/openproject/cluster.yaml).
        # CNPG auto-creates the openproject-pg-app Secret with the connection
        # credentials; we just point the chart at the {host, secret, user, db}.
        postgresql:
          bundled: false
          connection:
            host: openproject-pg-rw.openproject.svc.cluster.local
            port: 5432
          auth:
            existingSecret: openproject-pg-app
            secretKeys:
              userPasswordKey: password
            username: openproject
            database: openproject
        # S3 attachments — Hetzner OS bucket openproject-attachments. Avoids
        # the RWX-PVC problem (web/worker/cron all need attachment writes).
        s3:
          enabled: true
          auth:
            existingSecret: openproject-s3-attachments
          region: nbg1
          bucketName: openproject-attachments
          endpoint: https://nbg1.your-objectstorage.com
        # Bundled memcached is fine — chart default, low overhead.
        memcached:
          enabled: true
        # Non-secret env vars (SMTP host/port/from + Rails trustedProxies +
        # registration disabled). Secret values come via extraEnvVarsSecret
        # below (openproject-smtp + openproject-s3-attachments).
        environment:
          OPENPROJECT_EMAIL__DELIVERY__METHOD: smtp
          OPENPROJECT_SMTP__ADDRESS: smtp.resend.com
          OPENPROJECT_SMTP__PORT: "465"
          OPENPROJECT_SMTP__DOMAIN: yornik.eu
          OPENPROJECT_SMTP__USER__NAME: resend
          OPENPROJECT_SMTP__AUTHENTICATION: plain
          OPENPROJECT_SMTP__SSL: "true"
          OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO: "false"
          OPENPROJECT_MAIL__FROM: openprojects@yornik.eu
          OPENPROJECT_SELF__REGISTRATION: "0"
          # Trusted proxies: pod CIDR + service CIDR. Without this Rails
          # ignores X-Forwarded-* from Traefik and logs the wrong client
          # IP, breaking rate-limiting and audit logs.
          OPENPROJECT_RAILS__TRUSTED__PROXIES: '["10.244.0.0/16","10.96.0.0/12"]'
        # We use S3 for attachments — disable the bundled persistence PVC
        # (which would also try to be RWX, requiring NFS).
        persistence:
          enabled: false
        openproject:
          host: plan.yornik.eu
          https: true
          hsts: true
          # readOnlyRootFilesystem: true means /tmp and /app/tmp come from
          # ephemeral PVCs. Default storage class is our truenas-nfs which
          # doesn't preserve the sticky bit Ruby's Tmpdir check requires
          # (errors with "/tmp is world-writable"). Pin to the ext4-on-zvol
          # iSCSI class — formatted with proper 1777 root perms.
          tmpVolumesStorageClassName: truenas-ssd-iscsi
          admin_user:
            name: yornik
            mail: openprojects@yornik.eu
            password_reset: "true"
            secret: openproject-app
          secretKeyBase:
            existingSecret: openproject-app
            secretKey: secret-key-base
          # Picks up both SMTP password (openproject-smtp) and S3 attachment
          # credentials (openproject-s3-attachments) via env vars with
          # OPENPROJECT_SMTP__PASSWORD / OPENPROJECT_FOG_CREDENTIALS_AWS__*
          # keys.
          extraEnvVarsSecret: openproject-smtp
