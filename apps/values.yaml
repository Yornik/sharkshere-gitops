repoURL: https://github.com/Yornik/sharkshere-gitops.git
targetRevision: main

# Define your apps here. Each entry becomes an ArgoCD Application.
#
# To add a new app:
#   1. Add an entry below
#   2. Create its manifests under manifests/<name>/
#   3. Push — ArgoCD picks it up automatically
#
apps:
  local-path-provisioner:
    namespace: local-path-storage
    path: manifests/local-path-provisioner

  smb-csi-driver:
    namespace: kube-system
    helm:
      repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
      chart: csi-driver-smb
      targetRevision: "v1.*"
      values: |
        controller:
          replicas: 1

  external-dns:
    namespace: external-dns
    path: manifests/external-dns

  monitoring:
    namespace: monitoring
    path: manifests/monitoring

  kube-prometheus-stack:
    namespace: monitoring
    syncOptions:
      - ServerSideApply=true
    helm:
      repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "81.*"
      values: |
        # Talos Linux: control plane components not accessible via Omni
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

        # Grafana
        grafana:
          deployment:
            strategy:
              rollingUpdate:
                maxUnavailable: 1
                maxSurge: 0
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: truenas-ssd
            size: 2Gi
          sidecar:
            dashboards:
              enabled: true
            datasources:
              enabled: true

        # Prometheus
        prometheus:
          prometheusSpec:
            retention: 60d
            retentionSize: 45GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: truenas-ssd
                  resources:
                    requests:
                      storage: 50Gi

        additionalPrometheusRulesMap:
          downsampling:
            groups:
              - name: downsample_5m
                interval: 5m
                rules:
                  - record: job:node_cpu_utilisation:avg5m
                    expr: avg without(cpu,mode) (1 - rate(node_cpu_seconds_total{mode="idle"}[5m]))
                  - record: job:node_memory_utilisation:avg5m
                    expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                  - record: job:node_network_receive_bytes:rate5m
                    expr: sum without(device) (rate(node_network_receive_bytes_total{device!~"lo|veth.*|cni.*"}[5m]))
                  - record: job:node_network_transmit_bytes:rate5m
                    expr: sum without(device) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*|cni.*"}[5m]))
                  - record: namespace:container_cpu_usage:rate5m
                    expr: sum by(namespace) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
                  - record: namespace:container_memory_working_set:avg5m
                    expr: sum by(namespace) (container_memory_working_set_bytes{container!=""})

        # Alertmanager
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: truenas-ssd
                  resources:
                    requests:
                      storage: 2Gi

        # Node exporter - Talos has no systemd
        prometheus-node-exporter:
          extraArgs:
            - --no-collector.systemd

  loki:
    namespace: monitoring
    helm:
      repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "6.*"
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          limits_config:
            retention_period: 1440h
            allow_structured_metadata: false
            ingestion_rate_mb: 100
            ingestion_burst_size_mb: 100
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
            working_directory: /var/loki/compactor
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: boltdb-shipper
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storageConfig:
            boltdb_shipper:
              active_index_directory: /var/loki/index
              cache_location: /var/loki/cache
              shared_store: filesystem
            filesystem:
              directory: /var/loki/chunks
          storage:
            type: filesystem
        singleBinary:
          replicas: 1
          extraArgs:
            - -log.level=error
          persistence:
            enabled: true
            storageClass: truenas-ssd
            size: 30Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false

  truenas-monitoring:
    namespace: monitoring
    path: manifests/truenas-monitoring

  alloy:
    namespace: monitoring
    helm:
      repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "1.*"
      values: |
        alloy:
          mounts:
            varlog: true
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + env("HOSTNAME")
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  regex         = "loki-canary.*"
                  action        = "drop"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  regex         = "(.+)"
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  regex         = "(.+)"
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.pipeline.receiver]
              }

              loki.process "pipeline" {
                stage.cri {}

                stage.drop {
                  // Noisy Kubernetes leader-election heartbeat logs.
                  expression = "successfully renewed lease"
                }

                stage.drop {
                  // Noisy Kubernetes readiness probe access logs.
                  expression = "userAgent=kube-probe.*uri=/readyz"
                }

                stage.match {
                  selector = "{app=\"tibber-exporter\"}"
                  stage.drop {
                    expression = "\"liveMeasurement\":"
                  }
                  stage.drop {
                    expression = "Updating (DAILY|HOURLY) data|Updating prices"
                  }
                }

                stage.match {
                  selector = "{app=\"democratic-csi\"}"
                  stage.drop {
                    expression = "NodeGetVolumeStats|request headers map\\["
                  }
                }

                stage.match {
                  selector = "{app=\"traefik\"}"
                  stage.drop {
                    // Traefik JSON access log: Kubernetes health probe requests to /ping.
                    expression = "\"UserAgent\":\"kube-probe"
                  }
                }

                stage.match {
                  selector = "{app=\"grafana\"}"
                  stage.drop {
                    expression = "logger=tsdb\\.loki|endpoint=queryData pluginId=loki|Response (received|parsed) from loki"
                  }
                }

                stage.match {
                  selector = "{app=\"external-dns\"}"
                  stage.drop {
                    // ExternalDNS webhook access logs. Keep in pod logs, drop from Loki.
                    expression = "msg=\"(started|completed) handling request\"|request=/(records|adjustendpoints)"
                  }
                }

                stage.match {
                  selector = "{app=\"loki\"}"
                  stage.drop {
                    expression = "caller=(metrics\\.go|roundtrip\\.go):|source=grafana-lokiexplore-app|query_type=volume|api=detected_labels"
                  }
                }

                stage.json {
                  expressions = {
                    level     = "level",
                    severity  = "severity",
                    log_level = "log_level",
                  }
                }

                stage.regex {
                  expression = "(?i)\\b(?P<level>trace|debug|info|warn|warning|error|fatal|panic)\\b"
                }

                stage.template {
                  source   = "level"
                  template = "{{ "{{" }} ToLower .Value {{ "}}" }}"
                }

                stage.replace {
                  source     = "level"
                  expression = "^warning$"
                  replace    = "warn"
                }

                stage.match {
                  selector = "{stream=\"stderr\"}"
                  stage.template {
                    source   = "level"
                    template = "{{ "{{" }} if .Value {{ "}}" }}{{ "{{" }} .Value {{ "}}" }}{{ "{{" }} else {{ "}}" }}error{{ "{{" }} end {{ "}}" }}"
                  }
                }

                stage.match {
                  selector = "{stream=\"stdout\"}"
                  stage.template {
                    source   = "level"
                    template = "{{ "{{" }} if .Value {{ "}}" }}{{ "{{" }} .Value {{ "}}" }}{{ "{{" }} else {{ "}}" }}info{{ "{{" }} end {{ "}}" }}"
                  }
                }

                stage.match {
                  selector            = "{app=\"democratic-csi\", level!~\"warn|error|fatal|panic\"}"
                  action              = "drop"
                  drop_counter_reason = "democratic_csi_non_error"
                }

                stage.match {
                  selector            = "{namespace=\"argocd\", level!~\"warn|error|fatal|panic\"}"
                  action              = "drop"
                  drop_counter_reason = "argocd_non_error"
                }

                stage.drop {
                  longer_than = "16KB"
                }

                stage.labels {
                  values = {
                    level = "",
                  }
                }

                forward_to = [loki.write.loki.receiver]
              }

              loki.source.syslog "truenas" {
                listener {
                  address  = "0.0.0.0:5140"
                  protocol = "tcp"
                  labels   = {
                    job      = "truenas",
                    instance = "nas",
                  }
                }
                listener {
                  address  = "0.0.0.0:5140"
                  protocol = "udp"
                  labels   = {
                    job      = "truenas",
                    instance = "nas",
                  }
                }
                forward_to = [loki.write.loki.receiver]
              }

              loki.write "loki" {
                endpoint {
                  url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
                }
              }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          extraPorts:
            - name: syslog-tcp
              port: 5140
              targetPort: 5140
              protocol: TCP
            - name: syslog-udp
              port: 5140
              targetPort: 5140
              protocol: UDP
        controller:
          type: daemonset
        tolerations:
          - operator: Exists

  tibber-exporter:
    namespace: monitoring
    path: manifests/tibber-exporter

  gotosocial:
    namespace: gotosocial
    path: manifests/gotosocial

  jellyfin:
    namespace: jellyfin
    path: manifests/jellyfin

  omni-tools:
    namespace: omni-tools
    path: manifests/omni-tools

  qbittorrent:
    namespace: jellyfin
    path: manifests/qbittorrent

  democratic-csi:
    namespace: democratic-csi
    path: manifests/democratic-csi

  democratic-csi-nfs:
    namespace: democratic-csi
    helm:
      repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: "*"
      values: |
        csiDriver:
          name: org.democratic-csi.nfs
        driver:
          existingConfigSecret: democratic-csi-nfs-driver-config
          config:
            driver: freenas-api-nfs
        controller:
          externalSnapshotter:
            enabled: false
        storageClasses:
          - name: truenas-nfs
            defaultClass: true
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              fsType: nfs
            mountOptions:
              - noatime
              - nfsvers=4
        volumeSnapshotClasses: []

  democratic-csi-iscsi:
    namespace: democratic-csi
    helm:
      repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: "*"
      values: |
        csiDriver:
          name: org.democratic-csi.iscsi
        node:
          hostPID: true
          driver:
            extraEnv:
              - name: ISCSIADM_HOST_STRATEGY
                value: nsenter
              - name: ISCSIADM_HOST_PATH
                value: /usr/local/sbin/iscsiadm
            iscsiDirHostPath: /etc/iscsi
            iscsiDirHostPathType: ""
        driver:
          existingConfigSecret: democratic-csi-iscsi-driver-config
          config:
            driver: freenas-api-iscsi
        controller:
          externalSnapshotter:
            enabled: false
        storageClasses:
          - name: truenas-iscsi
            defaultClass: false
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              fsType: ext4
            mountOptions: []
        volumeSnapshotClasses: []

  democratic-csi-nfs-ssd:
    namespace: democratic-csi
    helm:
      repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      targetRevision: "*"
      values: |
        csiDriver:
          name: org.democratic-csi.nfs-ssd
        driver:
          existingConfigSecret: democratic-csi-nfs-ssd-driver-config
          config:
            driver: freenas-api-nfs
        controller:
          externalSnapshotter:
            enabled: false
        storageClasses:
          - name: truenas-ssd
            defaultClass: false
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              fsType: nfs
            mountOptions:
              - noatime
              - nfsvers=4
              - nconnect=4
        volumeSnapshotClasses: []

  traefik:
    namespace: traefik
    helm:
      repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: "39.*"
      values: |
        updateStrategy:
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
        service:
          type: ClusterIP
          annotations:
            tailscale.com/expose: "true"
            tailscale.com/hostname: traefik
        ports:
          web:
            port: 8000
            exposedPort: 80
            protocol: TCP
            proxyProtocol:
              trustedIPs:
                - "10.0.0.0/8"
                - "100.64.0.0/10"
            forwardedHeaders:
              trustedIPs:
                - "10.0.0.0/8"
                - "100.64.0.0/10"
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
          websecure:
            port: 8443
            exposedPort: 443
            protocol: TCP
            proxyProtocol:
              trustedIPs:
                - "10.0.0.0/8"
                - "100.64.0.0/10"
            forwardedHeaders:
              trustedIPs:
                - "10.0.0.0/8"
                - "100.64.0.0/10"
            http:
              tls: {}
        certificatesResolvers:
          letsencrypt:
            acme:
              email: yornik@yornik.nl
              storage: /data/acme.json
              keyType: EC384
              httpChallenge:
                entryPoint: web
        persistence:
          enabled: true
          existingClaim: traefik-ssd
        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
          kubernetesIngress:
            enabled: true
          file:
            enabled: false
        experimental:
          plugins:
            fail2ban:
              moduleName: github.com/tomMoulard/fail2ban
              version: v0.8.9
        logs:
          general:
            format: json
            level: INFO
          access:
            enabled: true
            format: json
        ingressClass:
          enabled: true
          isDefaultClass: true

  muse:
    namespace: muse
    path: manifests/muse

  vaultwarden:
    namespace: vaultwarden
    path: manifests/vaultwarden

  vikunja:
    namespace: vikunja
    path: manifests/vikunja

  asf:
    namespace: asf
    path: manifests/asf

  fedishark:
    namespace: fedishark
    path: manifests/fedishark

  yornik:
    namespace: yornik
    path: manifests/yornik

  privatebin:
    namespace: privatebin
    path: manifests/privatebin

  argocd-config:
    namespace: argocd
    path: manifests/argocd-config

  traefik-config:
    namespace: traefik
    path: manifests/traefik-config

  tailscale:
    namespace: tailscale
    path: manifests/tailscale

  tailscale-operator:
    namespace: tailscale
    helm:
      repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: "*"
      values: |
        oauth:
          clientId: ""
          clientSecret: ""
        operatorConfig:
          defaultTags:
            - "tag:k8s-operator"
        proxyConfig:
          defaultTags: "tag:k8s"
        apiServerProxyConfig:
          mode: "false"
